[delivery]
state_branch = "discord-notification-state"
attempts = 6
request_timeout = 30
message_timeout = 180
run_timeout = 480
bootstrap_hours = 24
max_messages_per_run = 40
retry_interval = 300
max_retry_interval = 3600

[display]
body_length = 3500
max_commits = 11
commit_length = 67
username = "MoMMI"
avatar_url = "https://raw.githubusercontent.com/PJB3005/MoMMI/1a10f345dbb709dcae46e6495e522d4d7d6dfbbf/Files/MoMMIv2.png"
show_checks = true
show_reactions = true

[mommi]
new_comment = "New comment on"
edited_comment = "Edited comment on"
deleted_comment = "Deleted comment on"
commit_singular = "New Commit"
commit_plural = "New Commits"
push_to = "to"
force_push = "[FORCE PUSHED]"
ellipsis = "..."
overflow = "<.....>"
review_comment = "Review comment"
edited_review_comment = "Edited review comment"
deleted_review_comment = "Deleted review comment"
file = "File"
checks = "Checks"
status = "status"
conflicts = "🚨CONFLICTS🚨"
upvote = "＋"
downvote = "−"
pull_request = "pull request"
issue = "issue"
commit = "commit"
discussion = "<:ghdiscussion:1082078543770554429>"
discussion_created = "Created"
discussion_answered = "Answered"
discussion_unanswered = "Unanswered"
discussion_commented = "Commented"

[icons]
approved = "✓"
changes_requested = "📝"
review = "👁"
comment = "💬"
failure = "❌"
pending = "⏳"
neutral = "−"

[pr_status]
open = "Open"
closed = "Closed"
merged = "Merged"
draft = "Draft"
unknown = "Unavailable"

[review_status]
approved = "Approved"
changes_requested = "Changes requested"
review_required = "Waiting for review"
none = "No review decision"
unknown = "Unavailable"

[reviews.approved]
label = "Approved"
color = "#6CC644"
icon = "approved"

[reviews.changes_requested]
label = "Changes requested"
color = "#FF4444"
icon = "changes_requested"

[reviews.commented]
label = "Comment"
color = "#8B949E"
icon = "review"

[reviews.dismissed]
label = "Dismissed"
color = "#8B949E"
icon = "review"

[filters]
ignore_bots = true
ignored_users = ["Sunrise-Bot", "PJBot"]
branches = []
ignored_labels = []

[events]
pull_request = ["*"]
pull_request_review = ["*"]
pull_request_review_comment = ["*"]
issue_comment = ["*"]
issues = ["*"]
discussion = ["*"]
discussion_comment = ["*"]
commit_comment = ["*"]
fork = ["*"]
watch = ["*"]
push = ["*"]
create = ["*"]
delete = ["*"]
release = ["*"]
public = ["*"]
check_run = ["completed"]
check_suite = ["completed"]

[destinations.primary]
webhook_env = "DISCORD_EVENTS_WEBHOOK"
required = true
excluded_events = []

[destinations.secondary]
webhook_env = "DISCORD_EVENTS_WEBHOOK_SECONDARY"
required = false
excluded_events = ["fork"]

