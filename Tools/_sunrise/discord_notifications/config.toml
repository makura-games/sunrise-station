[delivery]
state_branch = "discord-notification-state"
attempts = 6
request_timeout = 30
message_timeout = 180
run_timeout = 480
bootstrap_hours = 24
max_messages_per_run = 40
retry_interval = 300
max_retry_interval = 3600

[display]
body_length = 500
max_commits = 8
username = "GitHub"
repository_label = ""

[filters]
ignore_bots = true
ignored_users = ["Sunrise-Bot", "PJBot"]
branches = []
ignored_labels = []

[events]
pull_request = ["*"]
pull_request_review = ["*"]
pull_request_review_comment = ["*"]
issue_comment = ["*"]
issues = ["*"]
discussion = ["*"]
discussion_comment = ["*"]
commit_comment = ["*"]
fork = ["*"]
watch = ["*"]
push = ["*"]
create = ["*"]
delete = ["*"]
release = ["*"]
public = ["*"]
check_run = ["completed"]
check_suite = ["completed"]

[destinations.primary]
webhook_env = "DISCORD_EVENTS_WEBHOOK"
required = true
excluded_events = []

[destinations.secondary]
webhook_env = "DISCORD_EVENTS_WEBHOOK_SECONDARY"
required = false
excluded_events = ["fork"]

