# Шаблон цели публикации чейнджлога в Discord.
#
# Файл целиком закомментирован, поэтому реестр считает его пустым и пропускает.
# Для добавления цели шаблон копируется в новый файл этого каталога, например
# fish.yml, после чего необходимые строки освобождаются от символа комментария.
#
# Имя файла может быть совершенно любым
#
# Относительный путь к YAML-чейнджлогу внутри репозитория.
# Указанный файл должен существовать в публикуемом коммите.
# changelog_file: Resources/Changelog/ChangelogFork.yml
#
# Имя секрета GitHub Actions, содержащего полный адрес вебхука Discord.
# Используется имя существующего секрета из настроек репозитория.
# Секрет должен содержать ссылку на вебхук
# webhook_secret: CHANGELOG_DISCORD_WEBHOOK_FORK
