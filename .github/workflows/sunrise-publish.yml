name: Publish Sunrise

permissions:
  contents: read

concurrency:
  group: ${{ inputs.concurrency_group || 'publish' }}
  cancel-in-progress: true

env:
  PUBLISH_FORK_ID: ${{ inputs.publish_fork_id || vars.PUBLISH_FORK_ID }}
  ROBUST_CDN_URL: ${{ vars.ROBUST_CDN_URL }}
  SERVER_PLATFORMS: ${{ inputs.server_platforms || '--platform win-x64 --platform win-arm64 --platform linux-x64 --platform linux-arm64 --platform osx-x64 --platform osx-arm64' }}

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: 'Commit hash for this repository (leave empty for latest). USE ONLY IF YOU KNOW WHAT YOU ARE DOING'
        required: false
        type: string
        default: ''
      use_private_content:
        description: 'Include content from SunrisePrivate'
        required: false
        type: boolean
        default: false
      private_commit_hash:
        description: 'Commit hash for SunrisePrivate (leave empty for latest). USE ONLY IF YOU KNOW WHAT YOU ARE DOING'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      commit_hash:
        description: 'Commit hash for this repository'
        required: false
        type: string
        default: ''
      publish_fork_id:
        description: 'Robust.Cdn fork identifier'
        required: true
        type: string
      concurrency_group:
        description: 'Publish concurrency group'
        required: false
        type: string
        default: 'publish'
      required_branch:
        description: 'Required caller branch; empty disables the check'
        required: false
        type: string
        default: ''
      use_private_content:
        description: 'Checkout and apply private content'
        required: false
        type: boolean
        default: false
      private_commit_hash:
        description: 'Commit hash for the private content repository'
        required: false
        type: string
        default: ''
      server_platforms:
        description: 'Arguments selecting server package platforms'
        required: false
        type: string
        default: '--platform win-x64 --platform win-arm64 --platform linux-x64 --platform linux-arm64 --platform osx-x64 --platform osx-arm64'
      publish_announcements:
        description: 'Publish server update announcements'
        required: false
        type: boolean
        default: false
    secrets:
      PUBLISH_TOKEN:
        required: true
      MAKURA_PRIVATE_REPO:
        required: false
      MAKURA_PRIVATE_REPO_SSH_KEY:
        required: false
      ANNOUNCE_UPDATE_DISCORD_WEBHOOK:
        required: false
      ANNOUNCE_UPDATE_DISCORD_ROLE_ID:
        required: false
  schedule:
  - cron: '0 10 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source

    steps:
#    - name: Fail if not on master branch
#      if: ${{GITHUB.REF_NAME != 'master'}}
#      run: exit 1

    - name: Fail if not on required branch
      if: ${{ inputs.required_branch != '' && github.ref_name != inputs.required_branch }}
      working-directory: .
      run: exit 1

    - name: Checkout workflow revision
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        path: automation
        sparse-checkout: Tools
        persist-credentials: false

    - name: Validate publish configuration
      working-directory: automation
      env:
        COMMIT_HASH: ${{ inputs.commit_hash }}
        PRIVATE_COMMIT_HASH: ${{ inputs.private_commit_hash }}
        CURRENT_REF_NAME: ${{ github.ref_name }}
        CURRENT_REF_TYPE: ${{ github.ref_type }}
        USE_PRIVATE_CONTENT: ${{ inputs.use_private_content }}
        PRIVATE_REPOSITORY: ${{ secrets.MAKURA_PRIVATE_REPO }}
        PRIVATE_REPOSITORY_SSH_KEY: ${{ secrets.MAKURA_PRIVATE_REPO_SSH_KEY }}
      run: python3 Tools/_sunrise/publishing/validate_publish.py

    - name: Checkout requested revision
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        ref: ${{ inputs.commit_hash || github.sha }}
        path: source
        submodules: 'recursive'
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: python -m pip install --require-hashes -r ../automation/Tools/_sunrise/publishing/requirements.lock

    - name: Checkout private content
      if: ${{ inputs.use_private_content }}
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        repository: ${{ secrets.MAKURA_PRIVATE_REPO }}
        path: source/PrivateContent
        ssh-key: ${{ secrets.MAKURA_PRIVATE_REPO_SSH_KEY }}
        ref: ${{ inputs.private_commit_hash }}
        persist-credentials: false

    - name: Move private content files
      if: ${{ inputs.use_private_content }}
      run: python3 ../automation/Tools/_sunrise/move_private.py --clone-dir "PrivateContent" --target-dirs "Resources"

    - name: Setup .NET Core
      uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25 # v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Get Engine Tag
      run: |
        cd RobustToolbox
        git fetch --depth=1

    - name: Install dependencies
      run: dotnet restore

    - name: Build Packaging
      run: dotnet build Content.Packaging --configuration Release --no-restore /m

    - name: Package server
      run: dotnet run --project Content.Packaging server ${SERVER_PLATFORMS}

    - name: Package client
      run: dotnet run --project Content.Packaging client --no-wipe-release

    - name: Publish version
      run: python3 ../automation/Tools/_sunrise/publishing/publish_multi_request.py --fork-id "${PUBLISH_FORK_ID}"
      env:
        PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}

    - name: Publish server update info
      if: ${{ inputs.publish_announcements }}
      continue-on-error: true
      run: python3 ../automation/Tools/_sunrise/discord_publish_announce.py
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.ANNOUNCE_UPDATE_DISCORD_WEBHOOK }}
        DISCORD_ROLE_ID: ${{ secrets.ANNOUNCE_UPDATE_DISCORD_ROLE_ID }}
        BUILD_PATH: ./release/SS14.Client.zip

