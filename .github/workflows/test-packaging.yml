name: Test Packaging

on:
  push:
    branches: [ master, staging, stable ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
      - '**.git**'
      - '**.yml'
      # no docs on which one of these is supposed to work, so
      # why not just do both
      - 'RobustToolbox'
      - 'RobustToolbox/**'
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ master, staging, stable ]

permissions:
  contents: read
  pull-requests: read

# Sunrise added start - отменяем устаревший запуск этой проверки для того же PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Sunrise added end

jobs:
  # Sunrise edit start - распределяем независимые цели упаковки по матрице и сохраняем единый обязательный статус
  changes:
    name: Check packaging paths
    runs-on: ubuntu-latest
    outputs:
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - name: Check changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" --jq '.[] | .filename, (.previous_filename // empty)')"
          packaging=false
          while IFS= read -r path; do
            case "$path" in
              *.cs|*.csproj|*.sln|*.git*|*.yml|RobustToolbox|RobustToolbox/*)
                packaging=true
                break
                ;;
            esac
          done <<< "$changed_files"
          echo "packaging=$packaging" >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.name }}
    needs: changes
    if: github.actor != 'Sunrise-Bot' && github.actor != 'PJBot' && needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: client
            arguments: client
          - name: server (win-x64)
            arguments: server --platform win-x64
          - name: server (win-arm64)
            arguments: server --platform win-arm64
          - name: server (linux-x64)
            arguments: server --platform linux-x64
          - name: server (linux-arm64)
            arguments: server --platform linux-arm64
          - name: server (osx-x64)
            arguments: server --platform osx-x64
          - name: server (osx-arm64)
            arguments: server --platform osx-arm64

    steps:
      - name: Checkout Master
        uses: actions/checkout@v4.2.2

      - name: Setup Submodule
        run: |
          git submodule update --init --recursive

      - name: Pull engine updates
        uses: space-wizards/submodule-dependency@v0.1.5

      - name: Update Engine Submodules
        run: |
          cd RobustToolbox/
          git submodule update --init --recursive

      # ubuntu-latest has .NET 10
      # - name: Setup .NET Core
      #   uses: actions/setup-dotnet@v4.1.0
      #   with:
      #     dotnet-version: 10.0.x

      - name: Install dependencies
        run: dotnet restore

      - name: Build Packaging
        run: dotnet build Content.Packaging --configuration Release --no-restore /m

      - name: Package ${{ matrix.name }}
        run: dotnet run --project Content.Packaging --configuration Release --no-build -- ${{ matrix.arguments }} --log-build

      - uses: actions/upload-artifact@v4
        with:
          name: binlogs-${{ matrix.name }}
          path: release/*.binlog
          retention-days: 7

  build:
    name: Test Packaging
    needs: [changes, package]
    if: ${{ always() && github.actor != 'Sunrise-Bot' && github.actor != 'PJBot' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify packaging jobs
        env:
          PACKAGING_NEEDED: ${{ needs.changes.outputs.packaging }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          if [[ "$PACKAGING_NEEDED" == "false" ]]; then
            echo "Packaging is not required for the changed files."
            exit 0
          fi

          echo "package=$PACKAGE_RESULT"
          if [[ "$PACKAGE_RESULT" != "success" ]]; then
            echo "::error title=Packaging failed::At least one packaging job did not succeed."
            exit 1
          fi
  # Sunrise edit end
