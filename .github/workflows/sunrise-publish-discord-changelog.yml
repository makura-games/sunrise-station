name: Publish Discord Changelog
run-name: Discord changelog ${{ inputs.target_id }} for ${{ inputs.released_sha }}

on:
  workflow_dispatch:
    inputs:
      target_id:
        description: Идентификатор цели из Tools/_sunrise/changelog/targets
        required: true
        type: string
      released_sha:
        description: SHA опубликованного коммита
        required: true
        type: string
      source_workflow_run_id:
        description: ID соответствующего запуска Publish Stable
        required: true
        type: string

permissions:
  actions: read # Чтение истории этой цели и истории стабильных публикаций.
  contents: read # Чтение реестра и версий файла чейнджлога через GitHub API.

concurrency:
  group: publish-discord-changelog-${{ inputs.target_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout automation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 requests==2.32.4

      - name: Resolve changelog target
        id: target
        env:
          CHANGELOG_TARGET_ID: ${{ inputs.target_id }}
        run: python Tools/_sunrise/changelog/changelog_targets.py "$CHANGELOG_TARGET_ID"

      - name: Publish changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets[steps.target.outputs.webhook_secret] }}
          CHANGELOG_FILE: ${{ steps.target.outputs.changelog_file }}
          CHANGELOG_TARGET_ID: ${{ steps.target.outputs.target_id }}
          RELEASED_SHA: ${{ inputs.released_sha }}
          SOURCE_WORKFLOW_RUN_ID: ${{ inputs.source_workflow_run_id }}
        run: python Tools/_sunrise/changelog/actions_changelogs_since_last_run.py
