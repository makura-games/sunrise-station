name: Check Merge Conflicts

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  Label:
    if: false # Sunrise-Edit - устаревший сценарий Wizden отключён
    # if: github.actor != 'Sunrise-Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Check for Merge Conflicts
        uses: eps1lon/actions-label-merge-conflict@v3.0.0
        with:
          dirtyLabel: "S: Merge Conflict"
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          commentOnDirty: "Этот PR содержит конфликты, пожалуйста, разрешите их, прежде чем мы сможем его оценить."
