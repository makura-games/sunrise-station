name: Discord Notification Delivery

on:
  workflow_run:
    workflows: [Discord Event Capture]
    types: [completed]
  schedule:
    - cron: '3/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: read
  pull-requests: read

concurrency:
  group: discord-notification-delivery
  cancel-in-progress: false

jobs:
  deliver:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: Tools/_sunrise
      GITHUB_TOKEN: ${{ github.token }}
      DISCORD_STATE_PATH: ${{ github.workspace }}/discord-state.json
    steps:
      - name: Получить только доверенный код основной ветки
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: Tools/_sunrise/discord_notifications
      - name: Подготовить Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Установить библиотеку HTTP
        run: python -m pip install --disable-pip-version-check requests==2.32.4
      - name: Восстановить очередь из последнего артефакта
        id: restore
        run: python -m discord_notifications.state restore
      - name: Собрать новые события в очередь
        id: collect
        timeout-minutes: 4
        run: python -m discord_notifications.deliver collect
      - name: Сохранить очередь до отправки
        id: queue
        if: always() && steps.restore.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: discord-notification-queue
          path: ${{ env.DISCORD_STATE_PATH }}
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Отправить очередь в Discord
        id: send
        if: ${{ !cancelled() && steps.queue.outcome == 'success' }}
        timeout-minutes: 5
        env:
          DISCORD_EVENTS_WEBHOOK: ${{ secrets.DISCORD_EVENTS_WEBHOOK }}
        run: python -m discord_notifications.deliver send
      - name: Сохранить результат даже после ошибки отправки
        id: state
        if: always() && steps.queue.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: discord-notification-state
          path: ${{ env.DISCORD_STATE_PATH }}
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Оставить последние резервные снимки очереди
        if: ${{ !cancelled() && steps.state.outcome == 'success' }}
        env:
          DISCORD_STATE_ARTIFACT_ID: ${{ steps.state.outputs.artifact-id }}
        run: python -m discord_notifications.state prune
