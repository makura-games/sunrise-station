name: Discord Notification Delivery

on:
  workflow_run:
    workflows: [Discord Event Capture]
    types: [completed]
  schedule:
    - cron: '3/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  checks: read
  issues: read
  pull-requests: read

concurrency:
  group: discord-notification-delivery
  queue: max
  cancel-in-progress: false

jobs:
  deliver:
    if: vars.DISCORD_NOTIFICATIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Получить только доверенный код основной ветки
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: Tools/_sunrise/discord_notifications
      - name: Подготовить Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Установить библиотеку HTTP
        run: python -m pip install --disable-pip-version-check requests==2.32.4
      - name: Доставить сообщения и показать понятный отчёт
        env:
          PYTHONPATH: Tools/_sunrise
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_EVENTS_WEBHOOK: ${{ secrets.DISCORD_EVENTS_WEBHOOK }}
          DISCORD_EVENTS_WEBHOOK_SECONDARY: ${{ secrets.DISCORD_EVENTS_WEBHOOK_SECONDARY }}
        run: python -m discord_notifications.deliver
