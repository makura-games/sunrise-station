name: Validate Changelog
run-name: "Validate changelog for PR #${{ github.event.pull_request.number }}"

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]
    branches: [master]

permissions:
  contents: read # Чтение доверенного парсера из базовой ветки.
  pull-requests: read # Чтение списка изменённых файлов PR.

concurrency:
  group: validate-changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted parser
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
          sparse-checkout: |
            .github/PULL_REQUEST_TEMPLATE.md
            Tools/_sunrise/changelog
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Parse changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHANGELOG_FILE: ${{ vars.CHANGELOG_FILE || 'Resources/Changelog/ChangelogSunrise.yml' }}
          CHANGELOG_EXTRA_CATEGORIES: ${{ vars.CHANGELOG_EXTRA_CATEGORIES }}
        run: >-
          python Tools/_sunrise/changelog/changelog_actions.py
          --event-path "$GITHUB_EVENT_PATH"
          --validate-only
