# Sunrise added start - пресет стабильной публикации
name: Publish Stable

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: 'Commit hash for this repository (leave empty for latest). USE ONLY IF YOU KNOW WHAT YOU ARE DOING'
        required: false
        type: string
        default: ''
      use_private_content:
        description: 'Include content from SunrisePrivate'
        required: false
        type: boolean
        default: true
      private_commit_hash:
        description: 'Commit hash for SunrisePrivate (leave empty for latest). USE ONLY IF YOU KNOW WHAT ARE YOU DOING'
        required: false
        type: string
        default: ''

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    with:
      commit_hash: ${{ inputs.commit_hash }}
      publish_fork_id: ${{ vars.PUBLISH_STABLE_FORK_ID }}
      concurrency_group: 'publish-mapping'
      required_branch: 'stable'
      use_private_content: ${{ inputs.use_private_content }}
      private_commit_hash: ${{ inputs.private_commit_hash }}
      server_platforms: '--platform win-x64 --platform linux-x64 --platform osx-x64 --platform linux-arm64'
      publish_announcements: true
      changelog_file: ${{ vars.PUBLISH_CHANGELOG_FILE }}
    secrets:
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      PRIVATE_REPOSITORY: ${{ secrets.PRIVATE_REPOSITORY }}
      PRIVATE_REPOSITORY_SSH_KEY: ${{ secrets.PRIVATE_REPOSITORY_SSH_KEY }}
      ANNOUNCE_UPDATE_DISCORD_WEBHOOK: ${{ secrets.ANNOUNCE_UPDATE_DISCORD_WEBHOOK }}
      ANNOUNCE_UPDATE_DISCORD_ROLE_ID: ${{ secrets.ANNOUNCE_UPDATE_DISCORD_ROLE_ID }}
      CHANGELOG_DISCORD_WEBHOOK: ${{ secrets.CHANGELOG_DISCORD_WEBHOOK }}
# Sunrise added end
