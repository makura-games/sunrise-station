name: Automatic Changelog

on:
  pull_request_target:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      changelog:
        description: "Текст: :ci: Автор; add/fix/remove/tweak/media. Много строк — через gh/API"
        required: true
        type: string

permissions:
  actions: read

concurrency:
  group: automatic-changelog
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CHANGELOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read

      # pull_request_target требует выполнять только код из доверенной ветки master.
      - name: Checkout master
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Update changelog
        shell: bash
        env:
          CHANGELOG_EXTRA_CATEGORIES: ${{ vars.CHANGELOG_EXTRA_CATEGORIES }}
          CHANGELOG_FILE: ${{ vars.CHANGELOG_FILE }}
          ACTIONS_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          MANUAL_CHANGELOG: ${{ inputs.changelog }}
        run: bash Tools/_sunrise/changelog/run.sh
