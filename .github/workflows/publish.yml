name: Publish

concurrency:
  # Sunrise edit start - выбираем группу параллельности из пресета
  group: ${{ inputs.concurrency_group || 'publish' }}
  # Sunrise edit end
  cancel-in-progress: true

# Sunrise added start - настраиваем публикацию через переменные GitHub
env:
  PUBLISH_FORK_ID: ${{ inputs.publish_fork_id || vars.PUBLISH_FORK_ID }}
  ROBUST_CDN_URL: ${{ vars.ROBUST_CDN_URL }}
  SERVER_PLATFORMS: ${{ inputs.server_platforms || '--platform win-x64 --platform win-arm64 --platform linux-x64 --platform linux-arm64 --platform osx-x64 --platform osx-arm64' }}
# Sunrise added end

on:
  workflow_dispatch:
    # Sunrise added start - поддерживаем выбор конкретного коммита
    inputs:
      commit_hash:
        description: 'Commit hash for this repository (leave empty for latest). USE ONLY IF YOU KNOW WHAT YOU ARE DOING'
        required: false
        type: string
        default: ''
      use_private_content:
        description: 'Include content from SunrisePrivate'
        required: false
        type: boolean
        default: true
      private_commit_hash:
        description: 'Commit hash for SunrisePrivate (leave empty for latest). USE ONLY IF YOU KNOW WHAT YOU ARE DOING'
        required: false
        type: string
        default: ''
    # Sunrise added end
  # Sunrise added start - предоставляем общий сценарий для пресетов публикации
  workflow_call:
    inputs:
      commit_hash:
        description: 'Commit hash for this repository'
        required: false
        type: string
        default: ''
      publish_fork_id:
        description: 'Robust.Cdn fork identifier'
        required: true
        type: string
      concurrency_group:
        description: 'Publish concurrency group'
        required: false
        type: string
        default: 'publish'
      required_branch:
        description: 'Required caller branch; empty disables the check'
        required: false
        type: string
        default: ''
      use_private_content:
        description: 'Checkout and apply private content'
        required: false
        type: boolean
        default: true
      private_commit_hash:
        description: 'Commit hash for the private content repository'
        required: false
        type: string
        default: ''
      server_platforms:
        description: 'Arguments selecting server package platforms'
        required: false
        type: string
        default: '--platform win-x64 --platform win-arm64 --platform linux-x64 --platform linux-arm64 --platform osx-x64 --platform osx-arm64'
      publish_announcements:
        description: 'Publish update and changelog announcements'
        required: false
        type: boolean
        default: false
      changelog_file:
        description: 'Path to the changelog file'
        required: false
        type: string
        default: ''
    secrets:
      PUBLISH_TOKEN:
        required: true
      PRIVATE_REPOSITORY:
        required: false
      PRIVATE_REPOSITORY_SSH_KEY:
        required: false
      ANNOUNCE_UPDATE_DISCORD_WEBHOOK:
        required: false
      ANNOUNCE_UPDATE_DISCORD_ROLE_ID:
        required: false
      CHANGELOG_DISCORD_WEBHOOK:
        required: false
  # Sunrise added end
  # Sunrise edit start - сохраняем публикацию по расписанию для Sunrise
  schedule:
  - cron: '0 10 * * *'
  # Sunrise edit end

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Sunrise edit start - используем проверку ветки Sunrise
#    - name: Fail if not on master branch
#      if: ${{GITHUB.REF_NAME != 'master'}}
#      run: exit 1
    # Sunrise edit end

    # Sunrise added start - проверяем ветку, заданную пресетом
    - name: Fail if not on required branch
      if: ${{ inputs.required_branch != '' && github.ref_name != inputs.required_branch }}
      run: exit 1
    # Sunrise added end

    # Sunrise edit start - получаем скрипт проверки из текущей ревизии workflow
    - name: Checkout workflow revision
      uses: actions/checkout@v4.2.2
      with:
        submodules: 'recursive'
        persist-credentials: false
    # Sunrise edit end

    # Sunrise added start - проверяем настройки публикации до сборки
    - name: Validate publish configuration
      env:
        COMMIT_HASH: ${{ inputs.commit_hash }}
        PRIVATE_COMMIT_HASH: ${{ inputs.private_commit_hash }}
        CURRENT_REF_NAME: ${{ github.ref_name }}
        CURRENT_REF_TYPE: ${{ github.ref_type }}
        USE_PRIVATE_CONTENT: ${{ inputs.use_private_content || github.event_name == 'schedule' }}
        PRIVATE_REPOSITORY: ${{ secrets.PRIVATE_REPOSITORY }}
        PRIVATE_REPOSITORY_SSH_KEY: ${{ secrets.PRIVATE_REPOSITORY_SSH_KEY }}
      run: python3 Tools/_sunrise/validate_publish.py
    # Sunrise added end

    # Sunrise edit start - переключаемся на выбранный коммит после проверки
    - name: Checkout requested revision
      if: ${{ inputs.commit_hash != '' }}
      uses: actions/checkout@v4.2.2
      with:
        ref: ${{ inputs.commit_hash }}
        submodules: 'recursive'
        persist-credentials: false
    # Sunrise edit end

    # Sunrise edit start - устанавливаем зависимости публикации через Python
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: pip install pyyaml requests
    # Sunrise edit end

    # Sunrise added start - подключаем приватное содержимое по настройке пресета
    - name: Checkout private content
      if: ${{ inputs.use_private_content || github.event_name == 'schedule' }}
      uses: actions/checkout@v4.2.2
      with:
        repository: ${{ secrets.PRIVATE_REPOSITORY }}
        path: PrivateContent
        ssh-key: ${{ secrets.PRIVATE_REPOSITORY_SSH_KEY }}
        ref: ${{ inputs.private_commit_hash }}

    - name: Move private content files
      if: ${{ inputs.use_private_content || github.event_name == 'schedule' }}
      run: python3 Tools/_sunrise/move_private.py --clone-dir "PrivateContent" --target-dirs "Resources"
    # Sunrise added end

    # Sunrise edit start - используем закреплённую версию действия настройки .NET
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x
    # Sunrise edit end

    - name: Get Engine Tag
      run: |
        cd RobustToolbox
        git fetch --depth=1

    - name: Install dependencies
      run: dotnet restore

    - name: Build Packaging
      run: dotnet build Content.Packaging --configuration Release --no-restore /m

    - name: Package server
      # Sunrise edit start - выбираем платформы из пресета
      run: dotnet run --project Content.Packaging server ${SERVER_PLATFORMS}
      # Sunrise edit end

    - name: Package client
      run: dotnet run --project Content.Packaging client --no-wipe-release

    - name: Publish version
      # Sunrise edit start - передаём настраиваемый идентификатор сборки
      run: Tools/publish_multi_request.py --fork-id "${PUBLISH_FORK_ID}"
      # Sunrise edit end
      env:
        PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}

    # Sunrise added start - отправляем уведомления по настройке пресета
    - name: Publish server update info
      if: ${{ inputs.publish_announcements }}
      continue-on-error: true
      run: Tools/_sunrise/discord_publish_announce.py
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.ANNOUNCE_UPDATE_DISCORD_WEBHOOK }}
        DISCORD_ROLE_ID: ${{ secrets.ANNOUNCE_UPDATE_DISCORD_ROLE_ID }}
        BUILD_PATH: ./release/SS14.Client.zip

    - name: Publish Discord changelog
      if: ${{ inputs.publish_announcements }}
      continue-on-error: true
      run: Tools/_sunrise/actions_changelogs_since_last_run.py
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DISCORD_WEBHOOK_URL: ${{ secrets.CHANGELOG_DISCORD_WEBHOOK }}
        CHANGELOG_FILE: ${{ inputs.changelog_file || 'Resources/Changelog/ChangelogSunrise.yml' }}
    # Sunrise added end

    # Sunrise edit start - отключаем upstream-публикацию списка изменений
    # - name: Publish changelog (Discord)
    #   run: Tools/actions_changelogs_since_last_run.py
    #   env:
    #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    #     DISCORD_WEBHOOK_URL: ${{ secrets.CHANGELOG_DISCORD_WEBHOOK }}

    # - name: Publish changelog (RSS)
    #   continue-on-error: true
    #   run: Tools/actions_changelog_rss.py
    #   env:
    #     CHANGELOG_RSS_KEY: ${{ secrets.CHANGELOG_RSS_KEY }}
    # Sunrise edit end
