name: Dispatch Discord Changelogs
run-name: Dispatch Discord changelogs for ${{ github.event.workflow_run.head_sha || inputs.source_workflow_run_id }}

on:
  workflow_run:
    workflows: ["Publish Stable"]
    types: [completed]
    branches: [stable]
  workflow_dispatch:
    inputs:
      source_workflow_run_id:
        description: ID успешного запуска Publish Stable для повторной публикации
        required: true
        type: string

permissions:
  actions: write # Создание отдельного запуска для каждой цели чейнджлога.
  contents: read # Чтение реестра целей из основной ветки.

jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout automation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Dispatch changelog targets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_workflow_run_id }}
          TARGET_WORKFLOW_REF: ${{ github.event.repository.default_branch }}
        run: python Tools/_sunrise/changelog/dispatch_changelogs.py
