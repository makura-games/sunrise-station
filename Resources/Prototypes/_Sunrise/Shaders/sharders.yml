- type: shader
  id: Gradient
  kind: source
  path: "/Textures/_Sunrise/Shaders/gradient.swsl"

- type: shader
  id: RoughGradient
  kind: source
  path: "/Textures/_Sunrise/Shaders/gradient_rough.swsl"

- type: shader
  id: TutorialTargetOutline
  kind: source
  path: "/Textures/Shaders/outline.swsl"
  params:
    outline_color: "#FFD84DCC"
    outline_fullbright: true
