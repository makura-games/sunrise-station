- type: reagent
  id: FleshAcid
  name: reagent-name-flesh-acid
  group: Toxins
  desc: reagent-desc-flesh-acid
  physicalDesc: reagent-physical-desc-strong-smelling
  flavor: acid
  color: "#c9000e"
  boilingPoint: 0.0
  meltingPoint: 0.0
  reactiveEffects:
    Acidic:
      methods: [ Touch ]
      effects:
      - !type:HealthChange
        conditions:
        - !type:TagCondition
          tag: "Flesh"
          inverted: true
        scaling: false
        ignoreResistances: true
        damage:
          types:
            Caustic: 15
      - !type:Emote
        conditions:
        - !type:TagCondition
          tag: "Flesh"
          inverted: true
        emote: Scream
        probability: 0.9
      - !type:PopupMessage
        conditions:
        - !type:TagCondition
          tag: "Flesh"
          inverted: true
        type: Local
        visualType: Large
        messages: [ "generic-reagent-effect-burning-insides" ]
        probability: 0.9


- type: reagent
  id: Carol
  name: reagent-name-carol
  group: Toxins
  desc: reagent-desc-carol
  physicalDesc: reagent-physical-desc-necrotic
  flavor: bitter
  color: "#c9000e"
  metabolisms:
    Bloodstream:
      effects:
      - !type:CauseFleshCultInfection
        conditions:
        - !type:TagCondition
          tag: "Flesh"
          inverted: true
        - !type:ReagentCondition
          reagent: Carol
          min: 5
      - !type:ModifyBloodLevel
        conditions:
        - !type:TagCondition
          tag: "Flesh"
        amount: 0.1 
      - !type:SatiateThirst
        conditions:
        - !type:TagCondition
          tag: "Flesh"
        factor: 2.5
      - !type:SatiateHunger
        conditions:
        - !type:TagCondition
          tag: "Flesh"
        factor: 2.5
      - !type:EvenHealthChange
        conditions:
        - !type:TagCondition
          tag: "Flesh"
        damage:
          Brute: -4
          Toxin: -4
          Airloss: -4
      - !type:HealthChange
        conditions:
        - !type:TagCondition
          tag: "Flesh"
        damage:
          types:
            Heat: -2
            Cold: -4
            Shock: -4
            Caustic: -4



