# Препараты из вакцинатора. Болезнь и код штамма проставляет машина при изготовлении.
- type: entity
  parent: BaseItem
  id: SunriseDiseaseVaccine
  name: vaccine
  description: A single-use injector of cloudy fluid with a blank label.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: Objects/Specific/Medical/medipen.rsi
    state: salpen
  - type: Label
  - type: Tag
    tags:
    - Trash
    - SunriseDiseaseVaccine

- type: entity
  parent: SunriseDiseaseVaccine
  id: SunriseDiseaseSerum
  name: serum
  description: A single-use injector of yellowish plasma with a blank label.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/medipen.rsi
    state: medipen
  # Сыворотку в многоразовый инжектор не вставить: её запас ограничен кровью донора.
  - type: Tag
    tags:
    - Trash
    - SunriseDiseaseSerum

- type: entity
  parent: BaseItem
  id: SunriseDiseaseFailedVaccine
  name: spoiled serum
  description: A cloudy ampoule of separated protein sludge.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: Objects/Specific/Medical/medipen.rsi
    state: medipen
    color: "#8A9A5B"
  - type: Tag
    tags:
    - Recyclable
    - Trash

# Таблетки. Симптоматика есть в медотделе на старте, подавление докупается в карго.
