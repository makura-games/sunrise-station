    - symptom: SymptomFever
      weight: 5
    - symptom: SymptomMuscleAche
      weight: 5
    - symptom: SymptomNausea
      weight: 4
    - symptom: SymptomHallucinations
      weight: 4
    - symptom: SymptomAnemia
      weight: 3

# Архетип-рамка для штаммов, собранных вирусологом в селекционном микроскопе: пути передачи,
# иммунитет и скорость развития. Стадии и симптомы задаёт сам геном, поэтому число таких штаммов
# за смену ничем не ограничено, а форма последней стадии повторяется для всех, что длиннее рамки.
- type: disease
  id: SunriseDesignedStrainBase
  name: disease-designed-name
  description: disease-designed-description
  syndrome: disease-syndrome-unknown
  classification: Viral
  routes: [ Injection ]
  treatmentHints:
  - disease-hint-isolation
  blacklist:
    tags:
    - SiliconEmotes
  # Набор симптомов задан руками, поэтому бросок штамма отключён.
  rollStrain: false
  immunity:
    type: Temporary
    duration: 900
  regression:
    minDuration: 60
    chance: 0.2
    maxDuration: 180
  stages:
  - advance:
      minDuration: 60
      chance: 0.3
      maxDuration: 120
    minSymptoms: 0
    maxSymptoms: 0
  - advance:
      minDuration: 90
      chance: 0.22
      maxDuration: 240
    minSymptoms: 1
    maxSymptoms: 1
    spreadMultiplier: 1.0
    contactSpreadChance: 0.04
  - advance:
      minDuration: 120
      chance: 0.19
      maxDuration: 300
    minSymptoms: 1
    maxSymptoms: 1
    spreadMultiplier: 1.1
    contactSpreadChance: 0.06

# Аэрозольный штамм даёт только временные дебафы и проходит самостоятельно.
- type: disease
  id: SunriseSyndicateHaze
  name: disease-syndicate-haze-name
  description: disease-syndicate-haze-description
  syndrome: disease-syndrome-respiratory
  classification: Viral
  routes: [ Droplet, Contact ]
  processInterval: 3
  rollStrain: false
  treatmentHints:
  - disease-hint-mask
  - disease-hint-isolation
  - disease-hint-rest
  blacklist:
    tags:
    - SiliconEmotes
  immunity:
    type: Temporary
    duration: 900
  regression:
    minDuration: 20
    chance: 0.35
    maxDuration: 45
  stages:
  # Короткая инкубация оставляет время отойти от облака и включить баллон.
  - advance:
      minDuration: 10
      chance: 0.5
      maxDuration: 20
    minSymptoms: 0
    maxSymptoms: 0
  # Кашель появляется у каждого носителя и разносит штамм после рассеивания облака.
  - advance:
      minDuration: 30
      chance: 0.4
      maxDuration: 60
    spreadMultiplier: 1.4
    contactSpreadChance: 0.3
    minSymptoms: 1
    maxSymptoms: 1
    symptomPool:
    - symptom: SunriseSymptomHazeCough
  # На пике гарантированы слабость, утомление и дрожь; повреждения органов исключены.
  - advance:
      minDuration: 120
      chance: 0.3
      maxDuration: 180
    spreadMultiplier: 1.8
    contactSpreadChance: 0.4
    minSymptoms: 3
    maxSymptoms: 3
    symptomPool:
    - symptom: SunriseSymptomHazeWeakness
    - symptom: SunriseSymptomHazeFatigue
    - symptom: SunriseSymptomHazeTremor

