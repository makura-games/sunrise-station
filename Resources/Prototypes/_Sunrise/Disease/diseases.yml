  blacklist:
    tags:
    - SiliconEmotes
  immunity:
    type: Permanent
  # Хроническая: сама не отступает и супрессантами не тормозится.
  suppressionPausesProgression: false
  regression:
    minDuration: 600
    chance: 0
  stages:
  - advance:
      minDuration: 600
      chance: 0
    rollCount: 3
    minSymptoms: 2
    maxSymptoms: 3
