# Набор болезней станции. Каждая запись — архетип: класс возбудителя, пути передачи и форма стадий
# заданы жёстко, а какие именно симптомы достанутся штамму этого раунда, решает rollCount.
# Поэтому заучить «эта болезнь — кашель и жар» нельзя: в следующий раз тот же архетип
# проявится иначе, и загадка вакцины соберётся из других свойств.

# Слабые: разгадываются с одного отчёта, учат цепочке и никого не убивают.

- type: disease
  id: SunriseSpaceCold
  name: disease-space-cold-name
  description: disease-space-cold-description
  syndrome: disease-syndrome-respiratory
  classification: Viral
  routes: [ Droplet, Contact ]
  # Лёгкая зараза проходит сама, если отлежаться.
  sleepCureTime: 180
  treatmentHints:
  - disease-hint-rest
  blacklist:
    tags:
    - SiliconEmotes
  immunity:
    type: Temporary
    duration: 900
  regression:
    minDuration: 30
    chance: 0.3
    maxDuration: 90
  stages:
  - advance:
      minDuration: 60
      chance: 0.25
      maxDuration: 120
    minSymptoms: 0
    maxSymptoms: 0
  - advance:
      minDuration: 120
      chance: 0.1
      maxDuration: 300
    enterEffects:
    - !type:PopupMessage
      type: Local
      visualType: Medium
      messages: [ "disease-space-cold-onset" ]
    rollCount: 3
    minSymptoms: 1
    maxSymptoms: 2
    symptomPool:
    - symptom: SymptomSneeze
      weight: 5
    - symptom: SymptomSoreThroat
      weight: 5
    - symptom: SymptomCough
      weight: 4
    - symptom: SymptomHeadache
      weight: 3

