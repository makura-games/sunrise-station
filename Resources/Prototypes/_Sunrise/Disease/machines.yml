# Наследники ванильных машин: сами машины уже стоят на картах, подмена идёт через migration.yml.
- type: entity
  parent: DiseaseDiagnoser
  id: SunriseDiseaseDiagnoser
  name: disease diagnoser
  description: A squat machine with a sample tray and a printer slot.
  components:
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      diseaseSample: !type:ContainerSlot
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.VisualState:
        enum.DiseaseMachineVisualLayers.IsRunning:
          True: { state: running }
          False: { state: icon }

- type: entity
  parent: Vaccinator
  id: SunriseVaccinator
  name: vaccinator
  description: A tall machine with two slots and a rack of ampoules behind glass.
  components:
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      vaccinatorSample: !type:ContainerSlot
      vaccinatorBlood: !type:ContainerSlot
  - type: MaterialStorage
    materialWhiteList:
    - Biomass
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.VisualState:
        enum.DiseaseMachineVisualLayers.IsRunning:
          True: { state: running }
          False: { state: icon }

# Отчёт диагностера.
- type: entity
  parent: DiagnosisReportPaper
  id: SunriseDiagnosisReportPaper
  name: disease diagnoser report
  description: A chilling medical receipt.
  components:
  - type: Sprite
    sprite: Objects/Misc/bureaucracy.rsi
    layers:
    - state: paper_receipt_horizontal
    - state: paper_receipt_horizontal_words
      map: ["enum.PaperVisualLayers.Writing"]
      visible: false
    - state: paper_stamp-generic
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: PaperVisuals
    backgroundPatchMargin: 6.0, 0.0, 6.0, 0.0
    contentMargin: 12.0, 0.0, 12.0, 0.0
    maxWritableArea: 440.0, 260.0

# Консоль базы данных вирусов: знания о штаммах, прогресс исследования и выдача лабораторных образцов.
- type: entity
  parent: BaseComputerAiAccess
  id: SunriseDiseaseDatabaseConsole
  name: virus database console
  description: A terminal with a scrolling catalogue readout and a dispenser slot.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: comm_monitor
    - map: ["computerLayerKeys"]
      state: med_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: AccessReader
    access: [["Medical"], ["ChiefMedicalOfficer"], ["Research"]]
  - type: Computer
    board: SunriseDiseaseDatabaseCircuitboard
  - type: PointLight
    radius: 1.5
    energy: 4.0
    color: "#1f8c28"

- type: entity
  parent: BaseComputerCircuitboard
  id: SunriseDiseaseDatabaseCircuitboard
  name: virus database board
  description: A computer printed circuit board for a virus database console.
  components:
  - type: Sprite
    state: cpu_science
  - type: ComputerBoard
    prototype: SunriseDiseaseDatabaseConsole

# Стерилизующая арка у входа в карантин: обдаёт прошедшего дезинфектантом из своего бака
# и пищит, если через неё прошёл заражённый.
- type: entity
  parent: [ BaseMachinePowered, ConstructibleMachine, BaseMachineDestructible ]
  id: SunriseDiseaseSterilizerArch
  name: sterilizer arch
  description: A walk-through arch lined with nozzles and a strip of indicators.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Sunrise/Disease/sterilizer_arch.rsi
    drawdepth: OverMobs
    snapCardinals: true
    layers:
    - state: base
    - state: idle
      shader: unshaded
      map: [ "sterilizerStatus" ]
  - type: Appearance
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        hard: false
        layer:
        - LowImpassable
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.2
    stepOn: true
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: Machine
    board: SunriseDiseaseSterilizerCircuitboard
  - type: Solution
    id: tank
    solution:
      maxVol: 100
  - type: RefillableSolution
    solution: tank
  - type: DrainableSolution
    solution: tank
  - type: ExaminableSolution
    solution: tank

- type: entity
  parent: BaseMachineCircuitboard
  id: SunriseDiseaseSterilizerCircuitboard
  name: sterilizer arch board
  description: A machine printed circuit board for a sterilizer arch.
  components:
  - type: Sprite
    state: medical
  - type: MachineBoard
    prototype: SunriseDiseaseSterilizerArch
    stackRequirements:
      Manipulator: 1
      Cable: 5
    tagRequirements:
      GlassBeaker:
        amount: 1
        defaultPrototype: Beaker
