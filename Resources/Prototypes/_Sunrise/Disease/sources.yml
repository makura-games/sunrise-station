# Источники заражения, которые заводят болезнь в раунд.

# Ящик-обманка, заразный.
- type: entity
  parent: CrateMedicalSupplies
  id: SunriseCrateContaminatedAid
  suffix: Contaminated

- type: entity
  parent: CrateMedical
  id: SunriseCrateContaminatedBiowaste
  name: biowaste crate
  description: A sealed crate of medical waste. The seal does not look intact.

# Мышь которая заражает и бьет, потому что бешенная.
- type: entity
  abstract: true
  id: SunriseMobMouseInfectedBase
  suffix: Infected
  components:
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 1

- type: entity
  parent: [ SunriseMobMouseInfectedBase, MobMouse ]
  id: SunriseMobMouseInfected

- type: entity
  parent: [ SunriseMobMouseInfectedBase, MobMouse1 ]
  id: SunriseMobMouseInfectedGrey

- type: entity
  parent: [ SunriseMobMouseInfectedBase, MobMouse2 ]
  id: SunriseMobMouseInfectedBrown

- type: entity
  id: SunriseDiseaseCloud
  name: strange haze
  description: A cloud of sticky haze. Breathing it in seems like a bad idea.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Effects/chemsmoke.rsi
    state: chemsmoke
    color: "#8FBF6F"
  - type: TimedDespawn
    lifetime: 20
  - type: Tag
    tags:
    - HideContextMenu

# Культура из разбитого сосуда: плотное облако на пол-отсека, которому не нужен воздушный путь штамма.
- type: entity
  parent: SunriseDiseaseCloud
  id: SunriseDiseaseCloudBreach
  name: dense culture haze
  description: A thick, glistening fog of escaped culture. It clings to everything.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Effects/chemsmoke.rsi
    state: chemsmoke
    color: "#8FBF6F"
    scale: 2.5,2.5
  - type: TimedDespawn
    lifetime: 45
