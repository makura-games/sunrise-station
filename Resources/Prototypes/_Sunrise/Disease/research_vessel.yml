- type: entity
  parent: [ BaseMachinePowered, ConstructibleMachine, StructureHealthMachine ]
  id: SunriseDiseaseResearchVessel
  name: viral research vessel
  description: A sealed culture vessel with a glass chamber, a sampling port and a research terminal.
  components:
  # По образцу сосуда аномалии: корпус, подсветка стекла и культура лежат отдельными слоями.
  - type: Sprite
    sprite: _Sunrise/Disease/research_vessel.rsi
    noRot: true
    layers:
    - state: base
      map: ["enum.DiseaseResearchVesselVisualLayers.Base"]
    # Лючок открыт, пока внутри нет образца.
    - state: open
      map: ["vesselOpen"]
    - state: powered
      shader: unshaded
      visible: false
      map: ["vesselPowered"]
    # Образец виден тёмным силуэтом в стекле, пока исследование не идёт.
    - state: sample
      visible: false
      map: ["vesselSample"]
    # Светящаяся культура и бегущие полосы сканера — только во время исследования.
    - state: culture
      shader: unshaded
      visible: false
      map: ["vesselCulture"]
    - state: running
      shader: unshaded
      visible: false
      map: ["vesselRunning"]
  - type: Machine
    board: SunriseDiseaseResearchVesselCircuitboard
  - type: ResearchClient
  - type: ActivatableUI
    key: enum.ResearchClientUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.ResearchClientUiKey.Key:
        type: ResearchClientBoundUserInterface
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        vesselPowered:
          True: { visible: true }
          False: { visible: false }
      enum.DiseaseResearchVesselVisuals.Loaded:
        vesselSample:
          True: { visible: true }
          False: { visible: false }
        vesselOpen:
          True: { visible: false }
          False: { visible: true }
      enum.DiseaseResearchVesselVisuals.Active:
        vesselCulture:
          True: { visible: true }
          False: { visible: false }
        vesselRunning:
          True: { visible: true }
          False: { visible: false }

- type: entity
  parent: BaseMachineCircuitboard
  id: SunriseDiseaseResearchVesselCircuitboard
  name: viral vessel board
  description: A machine printed circuit board for a viral research vessel.
  components:
  - type: Sprite
    state: medical
  - type: MachineBoard
    prototype: SunriseDiseaseResearchVessel
    stackRequirements:
      Manipulator: 2
      Glass: 5
      Cable: 5
- type: entity
  parent: SunriseDiseaseResearchVessel
  id: SunriseDiseaseResearchVesselExperimental
  name: experimental viral vessel
  description: A tall overclocked culture column wrapped in glowing tubes. The glass hums faintly under the pressure.
  components:
  - type: Sprite
    sprite: _Sunrise/Disease/research_vessel_experimental.rsi
    offset: 0,0.5
    drawdepth: Mobs
  - type: SpriteFade
  - type: Machine
    board: SunriseDiseaseResearchVesselExperimentalCircuitboard

- type: entity
  parent: BaseMachineCircuitboard
  id: SunriseDiseaseResearchVesselExperimentalCircuitboard
  name: experimental vessel board
  description: A machine printed circuit board for an experimental viral research vessel.
  components:
  - type: Sprite
    state: medical
  - type: MachineBoard
    prototype: SunriseDiseaseResearchVesselExperimental
    stackRequirements:
      Manipulator: 3
      Glass: 10
      Cable: 5
      MetalRod: 4
- type: entity
  parent: BaseFlatpack
  id: SunriseDiseaseResearchVesselFlatpack
  name: viral vessel flatpack
  description: A flatpack used for constructing a viral research vessel.
  components:
  - type: Flatpack
    entity: SunriseDiseaseResearchVessel
  - type: Sprite
    layers:
    - state: base
    - state: overlay
