- type: entity
  parent: [ BaseMachinePowered, ConstructibleMachine, StructureHealthMachine ]
  id: SunriseDiseaseResearchVessel
  name: viral research vessel
  description: A sealed culture vessel with a glass chamber, a sampling port and a research terminal.
  components:
  # По образцу сосуда аномалии: культура в колбе и индикатор питания светятся отдельными слоями.
  - type: Sprite
    sprite: _Sunrise/Disease/research_vessel.rsi
    noRot: true
    layers:
    - state: base
      map: ["enum.DiseaseResearchVesselVisualLayers.Base"]
    - state: culture
      shader: unshaded
      visible: false
      map: ["vesselCulture"]
    - state: powered
      shader: unshaded
      visible: false
      map: ["vesselPowered"]
  - type: Machine
    board: SunriseDiseaseResearchVesselCircuitboard
  - type: DiseaseResearchVessel
    sampleSlot:
      name: disease-vessel-slot
      ejectOnInteract: false
      swap: false
      whitelist:
        components: [ DiseaseStrainSample ]
  - type: ResearchClient
  - type: ActivatableUI
    key: enum.ResearchClientUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.ResearchClientUiKey.Key:
        type: ResearchClientBoundUserInterface
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DiseaseResearchVesselVisuals.Loaded:
        vesselCulture:
          True: { visible: true }
          False: { visible: false }
      enum.DiseaseResearchVesselVisuals.Active:
        vesselPowered:
          True: { visible: true }
          False: { visible: false }

- type: entity
  parent: BaseMachineCircuitboard
  id: SunriseDiseaseResearchVesselCircuitboard
  name: viral vessel board
  description: A machine printed circuit board for a viral research vessel.
  components:
  - type: Sprite
    state: medical
  - type: MachineBoard
    prototype: SunriseDiseaseResearchVessel
    stackRequirements:
      Manipulator: 2
      Glass: 5
      Cable: 5

- type: latheRecipe
  parent: BaseCircuitboardRecipe
  id: SunriseDiseaseResearchVesselCircuitboard
  result: SunriseDiseaseResearchVesselCircuitboard

- type: cargoProduct
  id: SunriseDiseaseResearchVesselCircuitboard
  icon:
    sprite: Objects/Misc/module.rsi
    state: cpu_medical
  product: SunriseDiseaseResearchVesselCircuitboard
  cost: 1200
  category: cargoproduct-category-name-medical
  group: market

# Экспериментальный сосуд по образцу экспериментального сосуда аномалий: изучает вдвое быстрее.
# Разрушенный, он, как и обычный, выпускает культуру облаком и запускает вспышку.
- type: entity
  parent: SunriseDiseaseResearchVessel
  id: SunriseDiseaseResearchVesselExperimental
  name: experimental viral research vessel
  description: A tall overclocked culture column wrapped in glowing tubes. The glass hums faintly under the pressure.
  components:
  - type: Sprite
    sprite: _Sunrise/Disease/research_vessel_experimental.rsi
    offset: 0,0.5
    drawdepth: Mobs
  - type: SpriteFade
  - type: DiseaseResearchVessel
    pointsPerStrength: 1
    maxPointsPerSecond: 60
  - type: Machine
    board: SunriseDiseaseResearchVesselExperimentalCircuitboard

- type: entity
  parent: BaseMachineCircuitboard
  id: SunriseDiseaseResearchVesselExperimentalCircuitboard
  name: experimental viral vessel board
  description: A machine printed circuit board for an experimental viral research vessel.
  components:
  - type: Sprite
    state: medical
  - type: MachineBoard
    prototype: SunriseDiseaseResearchVesselExperimental
    stackRequirements:
      Manipulator: 3
      Glass: 10
      Cable: 5
      MetalRod: 4

- type: latheRecipe
  parent: BaseGoldCircuitboardRecipe
  id: SunriseDiseaseResearchVesselExperimentalCircuitboard
  result: SunriseDiseaseResearchVesselExperimentalCircuitboard

# Флэтпак для расстановки на картах, как у сосуда аномалий.
- type: entity
  parent: BaseFlatpack
  id: SunriseDiseaseResearchVesselFlatpack
  name: viral research vessel flatpack
  description: A flatpack used for constructing a viral research vessel.
  components:
  - type: Flatpack
    entity: SunriseDiseaseResearchVessel
  - type: Sprite
    layers:
    - state: base
    - state: overlay
