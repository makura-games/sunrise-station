# Профили сложности исследования. Профиль выбирается по силе болезни:
# берётся запись с наибольшим minStrength, не превышающим силу штамма.
# Сила складывается из заразности (пути передачи, контактная и капельная передача),
# тяжести симптомов, взвешенной по их весам в пулах стадий, и из набора симптомов штамма:
# сколько их всего и насколько они тяжёлые. Пороги учитывают эту последнюю составляющую,
# поэтому широкий штамм разгадывается дольше узкого, даже если стадии у них одинаковые.

# Простуда: разгадывается с одного отчёта, скрытых свойств нет.
- type: diseaseDifficulty
  id: DiseaseDifficultyWeak
  minStrength: 0
  candidates: 4
  claims: 2
  lockedClaims: 0

# Обычная зараза: одно свойство закрыто, нужен хотя бы один заход в лабораторию.
- type: diseaseDifficulty
  id: DiseaseDifficultyModerate
  minStrength: 11
  candidates: 6
  claims: 3
  lockedClaims: 1
  researchPerUnlock: 3

# Тяжёлый штамм: два замка, без культур их не снять за разумное время.
# Партий больше и замки дороже: вслепую перебирать тяжёлый штамм должно быть заведомо хуже,
# чем изучать его, тем более что каждая неудача ставит машину на промывку.
- type: diseaseDifficulty
  id: DiseaseDifficultySevere
  minStrength: 21
  candidates: 10
  claims: 4
  lockedClaims: 2
  researchPerUnlock: 4
