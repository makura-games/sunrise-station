# Полевые инструменты вирусолога: карманный анализатор, распылитель-обеззараживатель и визор.

- type: entity
  parent: BaseItem
  id: SunriseDiseaseScanner
  name: disease analyzer
  description: A hand-held analyzer with a narrow printer slot and a roll of paper.
  components:
  - type: Item
    heldPrefix: analyzer
    storedRotation: -90
    sprite: Objects/Specific/Medical/healthanalyzer.rsi
  - type: Sprite
    sprite: _Sunrise/Disease/disease_analyzer.rsi
    layers:
    - state: icon
    - state: analyzer
      shader: unshaded
  - type: UseDelay
    delay: 0.5

# Пульверизатор по образцу садовых опрыскивателей
- type: entity
  abstract: true
  parent: SprayBottleBase
  id: SunriseDiseaseSprayerBase
  components:
  - type: Sprite
    sprite: Objects/Tools/Hydroponics/sprays.rsi
    state: nolabelspray
  - type: Item
    sprite: Objects/Tools/Hydroponics/sprays.rsi
  - type: Spray
    transferAmount: 5
  - type: Tag
    tags:
    - Spray

- type: entity
  parent: SunriseDiseaseSprayerBase
  id: SunriseDiseaseSprayer
  name: disinfectant sprayer
  suffix: Filled
  description: A hand sprayer with a measuring scale on the canister.
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: SunriseDisinfectant
        Quantity: 60

# Очки показывают только заражённые предметы рядом: больных людей вирусолог ищет анализатором и мазками.
- type: entity
  parent: ClothingEyesHudBase
  id: SunriseClothingEyesHudVirology
  name: virology hud
  description: A light heads-up display with a teal lens on a thin arc.
  components:
  - type: Sprite
    sprite: _Sunrise/Clothing/Eyes/Hud/virology.rsi
  - type: Clothing
    sprite: _Sunrise/Clothing/Eyes/Hud/virology.rsi
  - type: Tag
    tags:
    - PetWearable
    - WhitelistChameleon
