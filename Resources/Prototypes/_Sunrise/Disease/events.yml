# Станционные события, заводящие болезни. Вес и порог онлайна — главный рычаг безопасности:
# тяжёлые штаммы не должны выпадать на малолюдном раунде, где некому работать вирусологом.

# Слабые: безопасны всегда, нужны ради фона и обучения медотдела.
- type: entity
  id: SunriseMinorOutbreak
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    weight: 8
    duration: 1
    earliestStart: 10
    reoccurrenceDelay: 25
    minimumPlayers: 5
  - type: DiseaseOutbreakRule
    diseases:
    - SunriseSpaceCold
    - SunriseMoldAllergy
    - SunriseClownFever
    - SunriseMucusBronchitis
    minInfected: 1
    maxInfected: 3

# Средние: требуют работающего медотдела, но не убивают.
- type: entity
  id: SunriseModerateOutbreak
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    startAnnouncement: station-event-disease-outbreak-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    weight: 5
    duration: 1
    earliestStart: 25
    reoccurrenceDelay: 40
    minimumPlayers: 15
  - type: DiseaseOutbreakRule
    diseases:
    - SunriseInfluenza
    - SunriseGastroenteritis
    - SunriseParasiticInfestation
    - SunriseHiveFever
    - SunriseApathyVirus
    minInfected: 1
    maxInfected: 2

# Тяжёлые: без вмешательства доводят до смерти, поэтому порог онлайна высокий,
# старт поздний, а повтор за раунд запрещён.
- type: entity
  id: SunriseSevereOutbreak
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    startAnnouncement: station-event-disease-outbreak-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    weight: 2.5
    duration: 1
    earliestStart: 40
    reoccurrenceDelay: 60
    minimumPlayers: 30
    maxOccurrences: 1
    occursDuringRoundEnd: false
  - type: DiseaseOutbreakRule
    diseases:
    - SunrisePneumonia
    - SunriseHemorrhagicFever
    - SunriseXenoSpores
    - SunriseAnomalousBlight
    - SunriseNeurotropicFever
    - SunriseRadianSyndrome
    - SunriseSimianRetrovirus
    minInfected: 1
    maxInfected: 2

# Разгерметизация сосуда для исследования вирусов: событие находит сосуд с заразной культурой,
# выпускает её облаком и заражает ещё нескольких членов экипажа тем же штаммом. Без такого сосуда
# проходит молча, поэтому вес невысокий. Поломка сосуда игроками это событие не запускает.
- type: entity
  id: SunriseDiseaseVesselBreach
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    weight: 3
    duration: 1
    earliestStart: 30
    reoccurrenceDelay: 45
    minimumPlayers: 15
  - type: DiseaseVesselBreachRule
    minInfected: 1
    maxInfected: 2

# Заражённый груз: партия приходит обычным подарком и объявляется как подарок, но один ящик в ней
# заразен. Снаружи он неотличим от соседних, поэтому очаг ищут по заболевшим, а не по виду ящика.
# Доставка идёт штатным грузовым заказом, так что первым его трогает снабжение, а не медотдел.
- type: entity
  id: SunriseContaminatedCargo
  parent: CargoGiftsBase
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    weight: 4
    duration: 120
    earliestStart: 20
    reoccurrenceDelay: 40
    minimumPlayers: 15
  - type: CargoGiftsRule
    description: cargo-gift-sunrise-humanitarian
    dest: cargo-gift-dest-med
    gifts:
      MedicalSupplies: 1
      SunriseContaminatedAid: 1
      FoodSoftdrinks: 1

# Партия брака на кухне: портится уже существующая еда.
- type: entity
  id: SunriseSpoiledFoodBatch
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    weight: 5
    duration: 1
    earliestStart: 15
    reoccurrenceDelay: 35
    minimumPlayers: 10
  - type: DiseaseFoodBatchRule
    diseases:
    - SunriseGastroenteritis
    - SunriseParasiticInfestation
    - SunriseBacterialFermentation
    minItems: 4
    maxItems: 8

# Заражённое зверьё: источник бегает по станции и кусается.
- type: entity
  id: SunriseInfectedVermin
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    weight: 4
    duration: null
    earliestStart: 20
    reoccurrenceDelay: 40
    minimumPlayers: 15
  - type: VentCrittersRule
    entries:
    - id: SunriseMobMouseInfected
      prob: 0.04
    - id: SunriseMobMouseInfectedGrey
      prob: 0.03
    specialEntries:
    - id: SunriseMobMouseInfectedBrown
      prob: 0.5
