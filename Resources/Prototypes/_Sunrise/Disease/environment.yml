# Редкие находки и локальные очаги. Один источник выпускает один штамм и только один раз.
- type: entity
  parent: CrateMedical
  id: SunriseCrateBiologicalSalvage
  name: abandoned biocontainer
  description: An old research container with a cracked seal and dried biological residue around the lid.
  components:
  - type: DiseaseCloudOnTrigger
    keysIn: [ biohazard ]
    diseases: [ SunriseXenoSpores ]
    releaseOnOpen: true
    singleUse: true
    samplePrototype: SunriseDiseaseStrainVial
    cloudPrototype: SunriseDiseaseSporeCloud
    clouds: 1
    spreadRange: 0
  # Засохший налёт на крышке заражает и касанием: тем же штаммом, что выпускает облако.
  # Перчатки защищают руки, но обычные уносят заразу на себе. Дезинфекция снимает и налёт, и облако.
  - type: DiseaseSource
    templates: [ SunriseXenoSpores ]
    routes: [ Contact ]
    contactChance: 0.15
    ingestionChance: 0
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:TriggerBehavior
        keyOut: biohazard
      - !type:DoActsBehavior
        acts: [ Destruction ]

- type: entity
  parent: SunriseDiseaseCloud
  id: SunriseDiseaseSporeCloud
  name: spore cloud
  description: A thin cloud of drifting green spores.
  categories: [ HideSpawnMenu ]
  components:
  - type: DiseaseCloud
    range: 1.5
    chance: 0.08
  - type: TimedDespawn
    lifetime: 6

# Нарост заражает тремя путями: рукой (контакт), ногой (шаг по нему) и облаком спор, если его разбить.
# Дезинфектант гасит все три разом.
- type: entity
  id: SunriseDiseaseSporeGrowth
  name: spore growth
  description: A cluster of swollen fungal sacs on a bed of purple mycelium. They pulse slowly, shedding fine green dust.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _Sunrise/Disease/spores.rsi
    state: growth
    drawdepth: SmallObjects
  - type: DiseaseSource
    templates: [ SunriseXenoSpores ]
    routes: [ Contact ]
    contactChance: 0.3
    stepChance: 0.15
  # Срабатывает и на обычном шаге, а не только на бегу.
  - type: StepTrigger
    requiredTriggeredSpeed: 1
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      spores:
        shape: !type:PhysShapeAabb
          bounds: "-0.3,-0.3,0.3,0.3"
        hard: false
        layer: [ LowImpassable ]
        mask: [ SmallMobMask ]
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
    damageContainer: StructuralBiological
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:TriggerBehavior
        keyOut: biohazard
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: DiseaseCloudOnTrigger
    keysIn: [ biohazard ]
    diseases: [ SunriseXenoSpores ]
    singleUse: true
    cloudPrototype: SunriseDiseaseSporeCloud
    clouds: 1
    spreadRange: 0

# Маркер исчезает при старте карты; в большинстве раундов на его месте ничего нет.
- type: entity
  parent: MarkerBase
  id: SunriseDiseaseSporeGrowthSpawner
  name: spore growth spawner
  suffix: 15%
  components:
  - type: Sprite
    layers:
    - state: green
    - sprite: _Sunrise/Disease/spores.rsi
      state: growth
  - type: RandomSpawner
    prototypes: [ SunriseDiseaseSporeGrowth ]
    chance: 0.15
    offset: 0

# Эти животные — скрытые резервуары: передают только укусом, сами не кашляют и не болеют.
- type: entity
  parent: MobCarpSalvage
  id: SunriseMobCarpSalvageInfected
  name: space carp
  description: It's a space carp.
  suffix: Salvage, infected bites
  components:
  - type: DiseaseHitSource
    diseases:
    - SunriseGastroenteritis
    chance: 0.1

- type: entity
  parent: MobSpiderSpaceSalvage
  id: SunriseMobSpiderSalvageInfected
  name: space spider
  description: A large spider adapted to the vacuum of space.
  suffix: Salvage, infected bites
  components:
  - type: DiseaseHitSource
    diseases:
    - SunriseXenoSpores
    chance: 0.1
