# Общий набор симптомов: болезни ссылаются на них из пулов стадий с собственными весами.
# severity — тяжесть для носителя: из неё и заразности считается сила болезни,
# а сила задаёт размер загадки с партиями вакцины.
# suppressClaim и unstableClaim — строки свойств пробных партий, по одной на симптом.

