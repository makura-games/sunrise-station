# Полезные: в природных болезнях не встречаются, выводятся только под микроскопом.
# Заготовка изредка кладёт один такой симптом на последнюю стадию, поэтому severity у них нулевая:
# бафф не должен делать загадку с вакциной сложнее. Каждый бафф чем-то расплачивается.
# Частота срабатывания считается от шага болезни в 5 секунд.
- type: diseaseSymptom
  id: SunriseSymptomRegeneration
  name: disease-symptom-regeneration
  suppressClaim: disease-claim-suppresses-regeneration
  unstableClaim: disease-claim-unstable-with-regeneration
  beneficial: true
  # Срабатывает каждый шаг: около 10 брута и 10 ожогов в минуту,
  # зато голод тратится примерно вдвое быстрее.
  probability: 1
  severity: 0
  onsetEffects:
  - !type:PopupMessage
    type: Local
    visualType: Medium
    messages: [ "disease-symptom-regeneration-onset" ]
  effects:
  - !type:HealthChange
    damage:
      groups:
        Brute: -0.85
        Burn: -0.85
  - !type:Satiate
    satiationType: Hunger
    factor: -0.15

- type: diseaseSymptom
  id: SunriseSymptomAdrenaline
  name: disease-symptom-adrenaline
  suppressClaim: disease-claim-suppresses-adrenaline
  unstableClaim: disease-claim-unstable-with-adrenaline
  beneficial: true
  # Ускорение на 15% примерно четверть времени, за каждый прилив — глоток воды.
  probability: 0.15
  severity: 0
  effects:
  - !type:PopupMessage
    type: Local
    visualType: Small
    messages: [ "disease-symptom-adrenaline-popup" ]
  - !type:MovementSpeedModifier
    walkSpeedModifier: 1.15
    sprintSpeedModifier: 1.15
    time: 6
    effectProto: SunriseDiseaseAdrenalineStatusEffect
  - !type:Satiate
    satiationType: Thirst
    factor: -2

- type: diseaseSymptom
  id: SunriseSymptomEfficientMetabolism
  name: disease-symptom-efficient-metabolism
  suppressClaim: disease-claim-suppresses-efficient-metabolism
  unstableClaim: disease-claim-unstable-with-efficient-metabolism
  beneficial: true
  # Возвращает примерно половину того, что тратится на голод и жажду: есть и пить всё равно нужно.
