- type: entity
  id: PartTajaran
  parent: OrganBase
  name: "tajaran body part"
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10
  - type: VisualOrganMarkings
    markingData:
      group: Tajaran

- type: entity
  id: TorsoTajaran
  name: "tajaran torso"
  parent: [PartTajaran, OrganBaseTorso]
  components:
  - type: Sprite
    sprite: _Sunrise/Mobs/Species/Tajaran/parts.rsi
    state: "torso_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20

- type: entity
  id: HeadTajaran
  name: "tajaran head"
  parent: [PartTajaran, OrganBaseHead]
  components:
  - type: Sprite
    sprite: _Sunrise/Mobs/Species/Tajaran/parts.rsi
    state: "head_m"
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.FacialHair
    - enum.HumanoidVisualLayers.Snout
    - enum.HumanoidVisualLayers.HeadTop
    - enum.HumanoidVisualLayers.HeadSide
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 5
      - ReagentId: Blood
        Quantity: 10

