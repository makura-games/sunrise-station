- type: entity
  id: PartIPC
  parent: OrganBase
  name: "IPC body part"
  abstract: true
  components:
  - type: Extractable
  - type: VisualOrganMarkings
    markingData:
      group: IPC

- type: entity
  id: TorsoIPC
  name: "IPC torso"
  parent: [PartIPC, OrganBaseTorso]
  components:
  - type: Sprite
    sprite: _Sunrise/Mobs/Species/IPC/parts.rsi
    state: "torso_m"
  - type: Extractable

- type: entity
  id: HeadIPC
  name: "IPC head"
  parent: [PartIPC, OrganBaseHead]
  components:
  - type: Sprite
    sprite: _Sunrise/Mobs/Species/IPC/parts.rsi
    state: "head_m"
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.FacialHair
    - enum.HumanoidVisualLayers.Snout
    - enum.HumanoidVisualLayers.HeadTop
    - enum.HumanoidVisualLayers.HeadSide
  - type: Extractable

