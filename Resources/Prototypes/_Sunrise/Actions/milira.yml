- type: entity
  parent: BaseToggleAction
  id: ActionToggleWings
  name: Spread Wings
  description: Spread or fold your wings.
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 5
    checkCanInteract: false

  - type: Sprite
    sprite: _Sunrise/Actions/milira.rsi
    layers:
    - state: toggle_wings
      map: ["enum.ActionVisuals.Icon"]
    - state: toggle_wings_active
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
- type: entity
  parent: BaseToggleAction
  id: ActionToggleFlight
  name: Take Flight
  description: Launch into flight, trading stamina for speed.
  components:
  - type: Action
    itemIconStyle: NoItem
    checkCanInteract: false
    useDelay: 1.5
  - type: Sprite
    sprite: _Sunrise/Actions/milira.rsi
    layers:
    - state: toggle_flight
      map: ["enum.ActionVisuals.Icon"]
    - state: toggle_flight_active
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
