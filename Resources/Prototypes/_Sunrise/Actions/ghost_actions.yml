    checkCanInteract: false
    itemIconStyle: NoItem
  - type: Sprite
    sprite: _Sunrise/Mobs/Ghosts/gold_ghost_human.rsi
    layers:
    - state: animated
  - type: InstantAction
    event: !type:GhostThemeActionEvent
