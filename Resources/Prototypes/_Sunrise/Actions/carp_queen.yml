- type: entity
  parent: BaseAction
  id: ActionCarpQueenSummon
  name: carp-queen-action-summon
  description: carp-queen-action-summon-desc
  components:
  - type: Action
    useDelay: 3
  - type: Sprite
    sprite: _Sunrise/Interface/Actions/actions_carp_queen.rsi
    layers:
    - state: carpQueenEgg
  - type: InstantAction
    event: !type:CarpQueenSummonActionEvent

- type: entity
  parent: BaseAction
  id: ActionCarpQueenOrderStay
  name: carp-queen-action-stay
  description: carp-queen-action-stay-desc
  components:
  - type: Action
    useDelay: 1
    priority: 5
  - type: Sprite
    sprite: _Sunrise/Interface/Actions/actions_carp_queen.rsi
    layers:
    - state: stayOff
      map: ["enum.ActionVisuals.Icon"]
    - state: stay
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:CarpQueenOrderActionEvent
      type: Stay

