- type: entity
  parent: BaseAction
  id: ZombieJump
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 15
    itemIconStyle: NoItem
  - type: Sprite
    sprite: _Sunrise/Actions/zombie.rsi
    layers:
    - state: jump
  - type: TargetAction
    range: 200
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:ZombieJumpActionEvent

- type: entity
  parent: BaseAction
  id: ZombieFlair
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 5
    itemIconStyle: NoItem
  - type: Sprite
    sprite: _Sunrise/Actions/zombie.rsi
    layers:
    - state: the_look
  - type: InstantAction
    event: !type:ZombieFlairActionEvent
