# Base abilities

- type: entity
  parent: BaseAction
  id: ActionVampireToggleFangs
  name: Extend Fangs
  description: Bare your fangs to feed on a blood-bearing creature with an empty hand. A covered mouth, movement, damage, changing hands or losing range interrupts feeding; vampires cannot be drained and faith may protect the target.
  components:
  - type: Action
    useDelay: 2
    itemIconStyle: NoItem
    priority: 1
    icon:
      sprite: _Sunrise/Vampire/actions_vampire.rsi
      state: fangs_retracted
    iconOn:
      sprite: _Sunrise/Vampire/actions_vampire.rsi
      state: fangs_extended
  - type: InstantAction
    event: !type:VampireToggleFangsActionEvent {}
  - type: VampireAction

- type: entity
  parent: BaseAction
  id: ActionVampireGlare
  name: Glare
  description: Drains the stamina of nearby creatures and paralyzes those in front for longer. Cannot be used while blind; flash protection such as sunglasses may weaken or block it.
  components:
  - type: Action
    useDelay: 12
    itemIconStyle: NoItem
    priority: 2
    icon:
      sprite: _Sunrise/Vampire/actions_vampire.rsi
      state: glare
  - type: InstantAction
    event: !type:VampireGlareActionEvent {}
  - type: LimitedCharges
    maxCharges: 1
  - type: AutoRecharge
    rechargeDuration: 55
  - type: VampireAction

- type: entity
  parent: BaseAction
  id: ActionVampireSleep
  name: Sleep
  description: Hypnotizes a humanoid after a short concentration. Movement, damage or losing proximity interrupts the attempt, while protected eyes, a guarded mind or faith may resist it.
  components:
  - type: Action
    useDelay: 15
    itemIconStyle: NoItem
    priority: 25
    icon:
      sprite: _Sunrise/Vampire/actions_vampire.rsi
      state: sleep_icon
  - type: TargetAction
    range: 2
    checkCanAccess: false
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - HumanoidAppearance
    event: !type:VampireSleepActionEvent
  - type: LimitedCharges
    maxCharges: 1
  - type: AutoRecharge
    rechargeDuration: 110
  - type: VampireAction
    bloodCost: 20

- type: entity
  parent: BaseAction
  id: ActionVampireRejuvenateI
  name: Rejuvenation
  description: Removes stuns and knockdown, even while incapacitated. Does not heal or purge chemicals.
  components:
  - type: Action
    useDelay: 8
    itemIconStyle: NoItem
    priority: 3
    checkCanInteract: false
    checkConsciousness: false
    icon:
      sprite: _Sunrise/Vampire/actions_vampire.rsi
      state: rejuvinate
  - type: InstantAction
    event: !type:VampireRejuvenateIActionEvent {}
  - type: LimitedCharges
    maxCharges: 1
  - type: AutoRecharge
    rechargeDuration: 75
  - type: VampireAction

- type: entity
  parent: BaseAction
  id: ActionVampireRejuvenateII
  name: Greater Rejuvenation
  description: Removes stuns, purges poisons and gradually heals common injuries. Cannot revive the dead.
  components:
  - type: Action
    useDelay: 7
    itemIconStyle: NoItem
    priority: 4
    checkCanInteract: false
    checkConsciousness: false
    icon:
      sprite: _Sunrise/Vampire/actions_vampire.rsi
      state: rejuvinate
  - type: InstantAction
    event: !type:VampireRejuvenateIIActionEvent {}
  - type: LimitedCharges
    maxCharges: 1
  - type: AutoRecharge
    rechargeDuration: 65
  - type: VampireAction
    requiredPowerLevel: Nightborn
