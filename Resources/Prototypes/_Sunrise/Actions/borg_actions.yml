- type: entity
  parent: BaseAction
  id: ActionToggleBorgMagboots
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
    priority: 12
  - type: Sprite
    sprite: Clothing/Shoes/Boots/magboots-advanced.rsi
    layers:
    - state: icon
      map: ["enum.ActionVisuals.Icon"]
    - state: icon-on
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:ToggleBorgMagbootsActionEvent

- type: entity
  parent: BaseAction
  id: BorgCuffed
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 9
    priority: 9
  - type: Sprite
    sprite: Objects/Misc/cablecuffs.rsi
    layers:
    - state: cuff
  - type: TargetAction
    range: 2
    checkCanAccess: true
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - Cuffable
    event: !type:BorgCuffedActionEvent

