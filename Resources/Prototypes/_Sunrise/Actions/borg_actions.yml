- type: entity
  parent: BaseAction
  id: ActionChangeBorgVoice
  name: Change Voice
  description: Change your TTS voice. Cyborgs can speak with any voice due to their speakers.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 0.5
    priority: 10
  - type: Sprite
    sprite: Interface/Actions/actions_borg.rsi
    layers:
    - state: select-type
  - type: InstantAction
    event: !type:SiliconVoiceChangeActionEvent
