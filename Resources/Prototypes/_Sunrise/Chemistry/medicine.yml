- type: reagent
  id: HemostaticPowder
  name: reagent-name-hemostatic-powder
  group: Medicine
  desc: reagent-desc-hemostatic-powder
  physicalDesc: reagent-physical-desc-grainy
  flavor: medicine
  color: "#8b0b47"
  metabolisms:
    Bloodstream:
      effects:
      - !type:ModifyBleed
        amount: -4
      - !type:EvenHealthChange
        damage:
          Brute: -2
      - !type:HealthChange
        damage:
          types:
            Mangleness: 0.1 # Sunrise-Edit # 15% of 2/3 brute healing (EvenHealthChange)
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: HemostaticPowder
          min: 11
        damage:
          types:
            Poison: 3

- type: reagent
  id: Retroindralyne
  name: reagent-name-retroindralyne
  group: Medicine
  desc: reagent-desc-retroindralyne
  physicalDesc: reagent-physical-desc-cloudy
  flavor: medicine
  color: "#bd020284"
  metabolisms:
    Bloodstream:
      effects:
        - !type:HealthChange
          damage:
            types:
              Radiation: -3
              Mangleness: 0.45 # Sunrise-Edit # 15% of 3 radiation healing
        - !type:ModifyStatusEffect
          effectProto: StatusEffectSeeingRainbow
          type: Update
          time: 4

- type: reagent
  id: BarozinePlus
  name: reagent-name-barozine-plus
  group: Medicine
  desc: reagent-desc-barozine-plus
  physicalDesc: reagent-physical-desc-viscous
  flavor: medicine
  color: "#ff867d"
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        probability: 0.3
        damage:
          types:
            Heat: 0.4
      - !type:HealthChange
        conditions:
          - !type:ReagentCondition
            reagent: BarozinePlus
            min: 50
        damage:
          types:
            Poison: 1
      - !type:Vomit
        probability: 0.1
        conditions:
          - !type:ReagentCondition
            reagent: BarozinePlus
            min: 30
      - !type:GenericStatusEffect
        key: PressureImmunity
        component: PressureImmunity
      - !type:GenericStatusEffect
        key: Stutter
        component: StutteringAccent
      - !type:Jitter
      - !type:Emote
        emote: Scream
        probability: 0.1
      - !type:PopupMessage
        type: Local
        visualType: Large
        messages: [ "barozine-effect-skin-burning", "barozine-effect-muscle-contract" ]
        probability: 0.1
