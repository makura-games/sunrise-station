# region LMGs
- type: entity
  parent: BaseWeaponLightMachineGun
  id: WeaponLightMachineGunPirateCannon
  description: Kaboom!
  components:
    - type: Sprite
      sprite: _Sunrise/Objects/Weapons/Guns/LMGs/piratecannon.rsi
      layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-3
        map: ["enum.GunVisualLayers.Mag"]
        type: ContainerContainer
    - type: Clothing
      sprite: _Sunrise/Objects/Weapons/Guns/LMGs/piratecannon.rsi
    - type: Item
      size: Huge
      shape:
      - 0,0,4,3
      sprite: _Sunrise/Objects/Weapons/Guns/LMGs/piratecannon_inhands_64x.rsi
      storedSprite:
        state: storage
        sprite: _Sunrise/Objects/Weapons/Guns/LMGs/piratecannon_storage_64x.rsi
    - type: Gun
      fireRate: 6.5
      soundGunshot:
        path: /Audio/Weapons/Guns/Gunshots/mateba.ogg
        params:
          volume: -1
          pitch: 1.2
      projectileSpeed: 20
      bigTrigger: true
      selectedMode: FullAuto
      availableModes:
        - FullAuto
    - type: GunRequiresWield
    - type: ChamberMagazineAmmoProvider
      soundRack:
        path: /Audio/Weapons/Guns/Gunshots/grenade_launcher.ogg
        params:
          volume: -10
          pitch: 0.8
      soundAutoEject:
        path: /Audio/Weapons/Guns/MagOut/lmg_magout.ogg
      autoEject: true
    - type: ItemSlots
      slots:
        gun_magazine:
          name: Magazine
          startingItem: MagazineCannonBallMini
          insertSound: /Audio/_Sunrise/Weapons/Guns/LMGs/reload.ogg
          ejectSound: /Audio/_Sunrise/Weapons/Guns/LMGs/unload.ogg
          priority: 2
          whitelist:
            tags:
            - MagazineCannonBallMini
        gun_chamber:
          name: Chamber
          startingItem: CannonBallMini
          priority: 1
          whitelist:
            tags:
            - CannonBallMini
    - type: SpeedModifiedOnWield
      walkModifier: 0.75
      sprintModifier: 0.75
    - type: Appearance
    - type: MagazineVisuals
      magState: mag
      steps: 6
      zeroVisible: true
    - type: StaticPrice
      price: 4000
    - type: KnockbackByUserTag
      doestContain:
        Resomi:
          knockback: 2
          staminaMultiplier: 15
        Felinid:
          knockback: 1 #half of what resomi take
          staminaMultiplier: 15

- type: entity
  id: WeaponMachineGunLCG
  name: light chain gun
  parent: BaseWeaponLightMachineGun
  description: Light machine gun with a high rate of fire and low recoil. Effective for firing on the move and suppressing advancing squads. The high rate of fire and heat reduce accuracy, and prolonged firing increases the chance of jamming.
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Guns/LMGs/light_chaingun/big.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Sunrise/Objects/Weapons/Guns/LMGs/light_chaingun/tiny.rsi
  - type: Item
    size: Ginormous
    sprite: _Sunrise/Objects/Weapons/Guns/LMGs/light_chaingun/tiny.rsi
  - type: GunWieldBonus
    minAngle: 0
    maxAngle: 0
  - type: Gun
    minAngle: 1
    maxAngle: 45
    angleIncrease: 1
    angleDecay: 25
    fireRate: 15
    soundGunshot:
      collection: L6
      params:
        volume: -6
        pitch: 1.03
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineChainGunImprovised
        insertSound: /Audio/_Sunrise/Weapons/Guns/LMGs/reload.ogg
        ejectSound: /Audio/_Sunrise/Weapons/Guns/LMGs/unload.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineChainGun
      gun_chamber:
        name: Chamber
        startingItem: null
        priority: 1
        whitelist:
          tags:
          - CartridgeHeavyRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 6
    zeroVisible: true
  - type: Appearance
  - type: Wieldable
  - type: UseDelay
    delay: 0.75
  - type: GunRequiresWield
  - type: ChamberMagazineAmmoProvider
    boltClosed: null
    soundRack:
      path: /Audio/_Sunrise/Weapons/Guns/LMGs/cocked.ogg
  - type: SpeedModifiedOnWield
    walkModifier: 1
    sprintModifier: 0.95
  - type: HeldSpeedModifier
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 3
    pvsIncrease: 0.3
  - type: WeaponDismantleOnShoot
    dismantleChance: 0.002 # 50% chance per 300 shots
    dismantleDistance: 1
    items:
      - id: WeaponMachineGunLCGEmpty
        launchAngle: 0
        prob: 1
      - id: MagazineChainGunRandomSpawner
        launchAngle: 90
        prob: 1
      - id: MagazineChainGunLooseAmmoSpawner
        launchAngle: -90
        prob: 1

- type: entity
  id: WeaponMachineGunLCGEmpty
  name: light chain gun
  parent: WeaponMachineGunLCG
  suffix: Empty
  categories: [HideSpawnMenu]
  components:
    - type: ItemSlots
      slots:
        gun_magazine:
          name: Magazine
          startingItem: null
          insertSound: /Audio/_Sunrise/Weapons/Guns/LMGs/reload.ogg
          ejectSound: /Audio/_Sunrise/Weapons/Guns/LMGs/unload.ogg
          priority: 2
          whitelist:
            tags:
            - MagazineChainGun
        gun_chamber:
          name: Chamber
          startingItem: null
          priority: 1
          whitelist:
            tags:
            - CartridgeHeavyRifle

# region Magazines
- type: entity
  id: MagazineCannonBallMini
  name: cannonball suitcase
  description: A suitcase for neatly storing cannonballs for the pirate’s belt-fed cannon.
  parent: BaseItem
  components:
  - type: Tag
    tags:
    - MagazineCannonBallMini
  - type: BallisticAmmoProvider
    mayTransfer: false
    proto: CannonBallMini
    whitelist:
      tags:
      - CannonBallMini
    capacity: 50
  - type: Item
    size: Normal
    shape:
    - 0,0,2,1
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Guns/Ammunition/Magazines/cannonball_belt.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-5
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 6
    zeroVisible: false
  - type: Appearance

- type: entity
  id: MagazineCannonBallGrapeshotMini
  name: grapeshot suitcase
  parent: MagazineCannonBallMini
  suffix: Admeme
  components:
  - type: BallisticAmmoProvider
    mayTransfer: false
    proto: CannonBallGrapeshotMini
    whitelist:
      tags:
      - CannonBallMini
    capacity: 50

- type: entity
  id: MagazineChainGun
  name: chaingun ammo drum
