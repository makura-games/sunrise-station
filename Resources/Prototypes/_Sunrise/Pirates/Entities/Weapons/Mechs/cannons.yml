- type: entity
  id: WeaponMechCombatPirateCannon
  name: Mounted PirateCannon
  description: An ancient heavy gun given new life as a mech-mounted gun
  suffix: Mech Weapon, Gun, Combat, Pirate
  parent: [ BaseMechWeaponRange, CombatMechEquipment ]
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Specific/Mech/mecha_piratecannon.rsi
    state: mecha_piratecannon
  - type: Item
    sprite: _Sunrise/Objects/Weapons/Guns/LMGs/piratecannon_inhands_64x.rsi
    storedSprite:
      state: storage
      sprite: _Sunrise/Objects/Weapons/Guns/LMGs/piratecannon_storage_64x.rsi
  - type: Gun
    minAngle: -10
    maxAngle: 15
    fireRate: 0.25
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mateba.ogg
  - type: BatteryAmmoProvider
    proto: CannonBall
    fireCost: 150
  - type: Appearance
  - type: AmmoCounter
  - type: StaticPrice
    price: 3000

- type: entity
  id: WeaponMechCombatChaingun
  name: Mounted Chaingun
  suffix: Mech Weapon, Gun, Combat
  parent: [ BaseMechWeaponRange, CombatMechEquipment ]
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Specific/Mech/mecha_chaingun.rsi
    state: mecha_chaingun
  - type: Gun
    minAngle: 1
    maxAngle: 45
    angleIncrease: 0.5
    angleDecay: 30
    fireRate: 15
    selectedMode: FullAuto
    availableModes:
      - FullAuto
    soundGunshot:
      collection: L6
      params:
        volume: -5
        pitch: 1.03
  - type: BatteryAmmoProvider
    proto: CartridgeMinigun
    fireCost: 1
  - type: Appearance
  - type: AmmoCounter
  - type: StaticPrice
    price: 20000

- type: entity
  id: WeaponMechCombatChaingunImprovised
  parent: WeaponMechCombatChaingun
  components:
  - type: BatteryAmmoProvider
    proto: CartridgeRifleImprovised
    fireCost: 4

