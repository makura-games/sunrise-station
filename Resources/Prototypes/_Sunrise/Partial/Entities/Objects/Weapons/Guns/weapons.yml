# region Magazines
# Стандартные магазины используют SP-патроны на Sunrise без отдельных *SP ID.

- type: !PartialOnly entity
  id: BaseMagazineRifle
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Guns/Ammunition/Magazines/rifle_mag.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false

- type: !PartialOnly entity
  id: MagazinePistol
  components:
  - type: BallisticAmmoProvider
    proto: CartridgePistolSP
  - type: Sprite
    layers: !Clear
    - !Index:0
      state: sp
      map: ["enum.GunVisualLayers.Base"]
    - !Index:0
      state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left: !Clear
      - !Index:0
        state: inhand-left-mag
      - !Index:0
        state: inhand-left-stripe
        color: "#575EF5"
      right: !Clear
      - !Index:0
        state: inhand-right-mag
      - !Index:0
        state: inhand-right-stripe
        color: "#575EF5"

- type: !PartialOnly entity
  id: MagazinePistolHighCapacity
