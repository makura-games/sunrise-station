# region Shotguns
- type: !PartialOnly entity
  id: WeaponShotgunEnforcer
  components:
  - type: Gun
    projectileSpeed: 30
    soundGunshot:
      collection: xm1014
  - type: ContainerInteractionAnimationVisuals
  - type: Appearance
  - type: WeaponStorageColor
    useStorage: true
    fullItemTag: SpeedLoaderShotgun
    fullItemState: fill-speedloader
  - type: Storage
    grid:
    - 0,0,5,0
    maxItemSize: Normal
    clickInsert: false
    whitelist:
      tags:
      - ShellShotgun
      - SpeedLoaderShotgun
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: ShellShotgun
        amount: 6
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Guns/Shotguns/enforcer/big.rsi
    layers: !Clear
    - state: icon
      map: [ "enum.GunVisualLayers.Base" ]
    - { state: fill-1, map: [ storage-fill ], visible: false }
    - { state: fill-1-tip, map: [ storage-tip ], visible: false }

- type: !PartialOnly entity
  id: WeaponShotgunEnforcerRubber
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: ShellShotgunBeanbag
        amount: 6

- type: !PartialOnly entity
  id: WeaponShotgunDoubleBarreledRubber
  components:
  - !Remove type: BallisticAmmoProvider
  - type: RevolverAmmoProvider
    proto: ShellShotgunBeanbag

- type: !PartialOnly entity
  id: WeaponShotgunSawnEmpty
  components:
  - !Remove type: BallisticAmmoProvider
  - type: RevolverAmmoProvider
    whitelist:
      tags:
      - ShellShotgun
    proto: null
    capacity: 2
    chambers: [ null, null ]
    ammoSlots: [ null, null ]
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/shotgun_insert.ogg

- type: !PartialOnly entity
  id: WeaponShotgunHandmade
  components:
  - type: Gun
    projectileSpeed: 30
    soundGunshot:
      collection: m3

- type: !PartialOnly entity
  id: WeaponShotgunBlunderbuss
  components:
  - type: Gun
    projectileSpeed: 30
  - type: BallisticAmmoProvider
    proto: CannonBallGrapeshotMini
    whitelist:
      tags:
      - ShellShotgun
      - CannonBallMini

- type: !PartialOnly entity
  id: WeaponShotgunImprovised
  components:
  - type: Gun
    projectileSpeed: 30
    soundGunshot:
      collection: m3
    bigTrigger: true

- type: !PartialOnly entity
  id: WeaponShotgunHushpup
  components:
  - type: Gun
    projectileSpeed: 30
