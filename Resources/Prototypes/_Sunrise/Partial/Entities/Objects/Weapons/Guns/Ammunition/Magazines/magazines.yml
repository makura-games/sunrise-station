- type: !PartialOnly entity
  id: MagazinePistolSubMachineGunTopMounted
  name: WT550 magazine (.35 auto top-mounted)
  components:
  - type: BallisticAmmoProvider
    proto: CartridgePistolSP
  - type: Sprite
    layers: !Clear
    - !Index:0
      state: base
      map: ["enum.GunVisualLayers.Base"]
    - !Index:0
      state: mag-unshaded-1
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
    - !Index:0
      state: stripe
      color: "#575EF5"
  - type: Item
    storedRotation: -90
    inhandVisuals:
      left: !Clear
      - !Index:0
        state: inhand-left
      - !Index:0
        state: inhand-left-stripe
        color: "#575EF5"
      right: !Clear
      - !Index:0
        state: inhand-right
      - !Index:0
        state: inhand-right-stripe
        color: "#575EF5"

