# Базовые определения этих актуальных ванильных ID временно добавлены в
# _Sunrise/Entities/Objects/Weapons/Guns/Ammunition/Magazines/vanilla.yml.
- type: !PartialOnly entity
  id: MagazineLightRifle
  name: "magazine (.30 rifle)"
  parent: BaseMagazineLightRifle
  description: Curved 30-round double stack magazine for combat rifles. Intended to hold general-purpose kinetic ammunition.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeLightRifleSP
  - type: Sprite
    layers: !Clear
    - !Index:0
      state: base
      map: ["enum.GunVisualLayers.Base"]
    - !Index:0
      state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - !Index:0
      state: stripe
      color: "#575EF5"
  - type: Item
    inhandVisuals:
      left: !Clear
      - !Index:0
        state: inhand-left-mag
      - !Index:0
        state: inhand-left-stripe
        color: "#575EF5"
      right: !Clear
      - !Index:0
        state: inhand-right-mag
      - !Index:0
        state: inhand-right-stripe
        color: "#575EF5"

- type: !PartialOnly entity
  id: MagazineLightRifleBox
  name: "L6 SAW magazine box (.20 rifle)"
  parent: [ BaseNonCycleableAmmoProvider, BaseMagazineRifle ]
  description: Box containing a 200-round belt of linked .20 rifle rounds, used by light machine guns such as the L6. Intended to hold general-purpose kinetic ammunition.
  components:
  - type: Tag
    tags:
    - MagazineLightRifleBox
  - type: BallisticAmmoProvider
    proto: CartridgeRifleSP
    capacity: 200
  - type: Item
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/LightRifle/light_rifle_box.rsi
    layers: !Clear
    - !Index:0
      state: uranium
      color: "#575EF5"
      map: ["enum.GunVisualLayers.Base"]
    - !Index:0
      state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 8
    zeroVisible: false
  - type: Appearance

