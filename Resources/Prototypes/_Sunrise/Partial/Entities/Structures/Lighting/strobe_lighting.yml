# Частичные прототипы сохраняют прежние визуалы настенного стробоскопа.

- type: !PartialOnly entity
  id: AlwaysPoweredStrobeLight
  components:
  - type: Sprite
    sprite: _Sunrise/Structures/Wallmounts/lighting/strobe_light.rsi
    offset: 0, 0
  - type: PointLight
    offset: 0, 0.35

- type: !PartialOnly entity
  id: PoweredStrobeLightEmpty
  components:
  - type: Sprite
    sprite: _Sunrise/Structures/Wallmounts/lighting/strobe_light.rsi
