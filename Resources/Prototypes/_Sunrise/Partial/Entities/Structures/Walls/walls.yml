# Совместимость механики стен Sunrise с обновлёнными прототипами Wizden.

- type: !PartialOnly entity
  id: BaseStructureWall
  components:
  - type: Ricochetable
    chance: 0.4

- type: !PartialOnly entity
  id: WallDiagonalBase
  components:
  - type: Tag
    tags:
    - ForceNoTileWalls

- type: !PartialOnly entity
  id: WallBrick
  components:
  - type: Pierceable
    level: Metal
  - type: Ricochetable
    chance: 0.2

- type: !PartialOnly entity
  id: WallDebug
  categories: [Debug]

- type: !PartialOnly entity
  id: WallPlastitaniumIndestructible
  components:
  - type: Ricochetable
    chance: 1

- type: !PartialOnly entity
  id: WallPlastitaniumDiagonalIndestructible
  parent: WallDiagonalBaseSunrise

- type: !PartialOnly entity
  id: WallReinforced
  components:
  - type: Pierceable
    level: HardenedMetal
  - type: Ricochetable
    chance: 0.75

- type: !PartialOnly entity
  id: WallReinforcedDiagonal
  parent: WallDiagonalBaseSunrise

- type: !PartialOnly entity
  id: WallShuttleDiagonal
  components:
  - !Remove type: Reflect
  - type: Physics
    bodyType: Static
  - type: Ricochetable
    chance: 1
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
          vertices: !Clear
          - "0.5,-0.5"
          - "-0.5,-0.5"
          - "-0.5,0.1"
          - "0.5,0.5"

- type: !PartialOnly entity
  id: WallShuttle
  components:
  - type: Reflect
    reflects: Energy
    reflectProb: 1
  - type: Ricochetable
    chance: 1

- type: !PartialOnly entity
  id: WallSolid
  parent: [BaseWall, BaseDeltaPressurePlasma, StructureHealthWall]

- type: !PartialOnly entity
  id: WallSolidDiagonal
  parent: [WallDiagonalBaseSunrise, StructureHealthWall]
  components:
  - type: Ricochetable
    chance: 0.4

- type: !PartialOnly entity
  id: WallSolidChitin
  components:
  - type: Ricochetable
    chance: 0.1

- type: !PartialOnly entity
  id: WallXenoborgDiagonal
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          Girder:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [Destruction]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam

- type: !PartialOnly entity
  id: WallUranium
  components:
  - type: Ricochetable
    chance: 1

- type: !PartialOnly entity
  id: WallWood
  description: The traditional assistant defense.
  components:
  - type: Ricochetable
    chance: 0

- type: !PartialOnly entity
  id: WallWeb
  description: Keeps the spiders in and the assistants out.
  components:
  - type: Ricochetable
    chance: 0
  - type: Clickable

- type: !PartialOnly entity
  id: WallMiningDiagonal
  parent: WallDiagonalBaseSunrise
