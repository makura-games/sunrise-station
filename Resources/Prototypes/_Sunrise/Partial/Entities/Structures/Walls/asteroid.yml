# Частичные прототипы возвращают прежние визуалы всех AsteroidRock и наследующихся от них MeteorRock.

- type: !PartialOnly entity
  id: BaseAsteroidRock
  components:
  - !Remove type: IconSmooth
  - type: SmoothEdge

# Железная порода использует старое сглаживание, поэтому ей нужны именованные слои краёв.
- type: !PartialOnly entity
  id: BaseIronRockVisuals
  components:
  - type: Icon
    sprite: _Sunrise/Structures/Walls/rock.rsi
    state: ironrock
  - type: Sprite
    sprite: _Sunrise/Structures/Walls/rock.rsi
    layers: !Clear
    - state: ironrock
    - map: ["enum.EdgeLayer.South"]
      state: ironrock_south
    - map: ["enum.EdgeLayer.East"]
      state: ironrock_east
    - map: ["enum.EdgeLayer.North"]
      state: ironrock_north
    - map: ["enum.EdgeLayer.West"]
      state: ironrock_west

