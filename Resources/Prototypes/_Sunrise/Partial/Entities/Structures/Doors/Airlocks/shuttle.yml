- type: !PartialOnly entity
  id: AirlockShuttle
  components:
  - type: Sprite
    sprite: _Sunrise/Structures/Doors/Airlocks/Standard/shuttle.rsi
    snapCardinals: false
    layers: !Clear
    - !Index:0
      state: closed
      map: ["enum.DoorVisualLayers.Base"]
    - !Index:0
      state: closed_unlit
      shader: unshaded
      map: ["enum.DoorVisualLayers.BaseUnlit"]
      visible: true
    - !Index:0
      state: welded
      map: ["enum.WeldableLayers.BaseWelded"]
    - !Index:0
      state: bolted_unlit
      shader: unshaded
      map: ["enum.DoorVisualLayers.BaseBolted"]
    - !Index:0
      state: emergency_unlit
      map: ["enum.DoorVisualLayers.BaseEmergencyAccess"]
      shader: unshaded
    - !Index:0
      state: panel_open
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - !Index:0
      state: electrified_ai
      sprite: Interface/Misc/ai_hud.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.HUD"]
    - !Index:0
      state: electrified
      sprite: Effects/electricity.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.Sparks"]

- type: !PartialOnly entity
  id: AirlockGlassShuttle
  components:
  - type: Sprite
    layers: !Remove
    sprite: _Sunrise/Structures/Doors/Airlocks/Glass/shuttle.rsi

- type: !PartialOnly entity
  id: AirlockShuttleAssembly
  components:
  - type: Sprite
    layers: !Remove
    sprite: _Sunrise/Structures/Doors/Airlocks/Glass/shuttle.rsi
    state: closed
    snapCardinals: false

- type: !PartialOnly entity
  id: AirlockGlassShuttleSyndicate
  components:
  - type: Sprite
    layers: !Remove
    sprite: _Sunrise/Structures/Doors/Airlocks/Glass/shuttle_syndicate.rsi

- type: !PartialOnly entity
  id: AirlockShuttleSyndicate
  components:
  - type: Sprite
    layers: !Remove
    sprite: _Sunrise/Structures/Doors/Airlocks/Standard/shuttle_syndicate.rsi

- type: !PartialOnly entity
  id: AirlockShuttleXenoborg
  components:
  - type: Sprite
    layers: !Remove
    sprite: _Sunrise/Structures/Doors/Airlocks/Standard/shuttle_xenoborg.rsi
