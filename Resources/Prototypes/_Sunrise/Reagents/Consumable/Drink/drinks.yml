- type: reagent
  id: Kvass
  name: reagent-name-kvass
  parent: BaseDrink
  desc: reagent-desc-kvass
  physicalDesc: reagent-physical-desc-bubbly
  flavor: bread
  color: "#381600"
  metamorphicSprite:
    sprite: _Sunrise/Objects/Consumable/Drinks/kvass.rsi
    state: icon_empty
  metamorphicMaxFillLevels: 4
  metamorphicFillBaseName: fill-
  metamorphicChangeColor: false

- type: reagent
  id: ChamomileTincture
  name: reagent-name-chamomile-tincture
  parent: BaseDrink
  desc: reagent-desc-chamomile-tincture
  physicalDesc: reagent-physical-desc-strong-smell
  flavor: chamomile_tincture
  metamorphicSprite:
    sprite: _Sunrise/Objects/Consumable/Drinks/chamomile_tincture.rsi
    state: icon_empty
  metamorphicMaxFillLevels: 4
  metamorphicFillBaseName: fill-
  metamorphicChangeColor: false
  metabolisms:
    Digestion:
      effects:
      - !type:SatiateThirst
        factor: 4
    Bloodstream:
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: -2
      - !type:CleanBloodstream
        excluded: ChamomileTincture
        cleanseRate: 1

- type: reagent
  id: Grcoffee
  name: reagent-name-grcoffee
  parent: BaseDrink
  desc: reagent-desc-grcoffee
  physicalDesc: reagent-physical-desc-aromatic
  flavor: coffee
  color: "#664300"
  recognizable: true
  metabolisms:
    Digestion:
      effects:
      - !type:SatiateThirst
        factor: 2
      - !type:GenericStatusEffect
        key: Drowsiness
        time: 2.0
        type: Remove
      - !type:AdjustReagent
        reagent: Theobromine
        amount: 0.05

- type: reagent
  id: Butterbeer
  name: reagent-name-butterbeer
  parent: BaseAlcohol
  desc: reagent-desc-butterbeer
  physicalDesc: reagent-physical-desc-creamy
  flavor: butterscotch
  color: "#FFF8DC"
  recognizable: true
  metamorphicSprite:
    sprite: Objects/Consumable/Drinks/beerglass.rsi
    state: icon_empty
  metamorphicMaxFillLevels: 6
  metamorphicFillBaseName: fill-
  metamorphicChangeColor: true
  fizziness: 0.3
  metabolisms:
    Digestion:
      effects:
      - !type:SatiateThirst
        factor: 3
      - !type:AdjustReagent
        reagent: Ethanol
        amount: 0.03
      - !type:PopupMessage
        type: Local
        messages: [ "butterbeer-effect-taste" ]
        probability: 1.0
