          reagent: Nocturine
          min: 1
        reagent: Nocturine
        amount: -10
      - !type:AdjustReagent
        conditions:
        - !type:ReagentCondition
          reagent: ChloralHydrate
          min: 1
        reagent: ChloralHydrate
        amount: -10
      - !type:Emote
        emote: Laugh
        showInChat: true
        probability: 0.025
        conditions:
        - !type:ReagentCondition
          reagent: RedRum
          max: 5
      - !type:Emote
        emote: Whistle
        showInChat: true
        probability: 0.025
