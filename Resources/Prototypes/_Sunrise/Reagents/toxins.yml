- type: reagent
  id: StableMutagen
  name: reagent-name-stable-mutagen
  group: Toxins
  desc: reagent-desc-stable-mutagen
  physicalDesc: reagent-physical-desc-translucent
  flavor: bitter
  color: "#61b440"
  plantMetabolism:
  - !type:PlantAdjustMutationLevel
    amount: 0.3
  metabolisms:
    Bloodstream:
      metabolismRate: 0.25
      effects:
      - !type:HealthChange
        damage:
          types:
            Radiation: 0.05
            Poison: 0.05
            Caustic: 0.05
            Mangleness: 0.05
      - !type:PopupMessage
        type: Local
        visualType: Large
        messages: [ "generic-reagent-effect-burning-insides" ]
        probability: 0.15
      - !type:Emote
        emote: Scream
        probability: 0.2

- type: reagent
  id: MuteToxinAbductor
  name: reagent-name-mute-toxin
  group: Narcotics
  desc: reagent-desc-mute-toxin
  physicalDesc: reagent-physical-desc-syrupy
  color: "#000000"
  boilingPoint: 255.0
  meltingPoint: 36.0
  metabolisms:
    Bloodstream:
      effects:
      - !type:GenericStatusEffect
        key: Muted
        component: Muted
        type: Add
        time: 30

- type: reagent
  id: NocturineAbductor
  name: reagent-name-nocturine-abductor
  group: Narcotics
  desc: reagent-desc-nocturine
  physicalDesc: reagent-physical-desc-powdery
  color: "#128e80"
  boilingPoint: 444.0
  meltingPoint: 128.0
  metabolisms:
    Bloodstream:
      effects: # It would be nice to have speech slurred or mumbly, but accents are a bit iffy atm. Same for distortion effects.
      - !type:MovementSpeedModifier
        walkSpeedModifier: 0.65
        sprintSpeedModifier: 0.65
      - !type:ModifyStatusEffect
        conditions:
        - !type:ReagentCondition
          reagent: NocturineAbductor
          min: 8
        effectProto: StatusEffectForcedSleeping
        time: 12
        delay: 4
