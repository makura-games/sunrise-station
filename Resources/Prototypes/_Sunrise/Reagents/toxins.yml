- type: reagent
  id: FluorosulfuricAcidHumanoidXeno
  name: reagent-name-fluorosulfuric-acid
  group: Toxins
  desc: reagent-desc-fluorosulfuric-acid
  physicalDesc: reagent-physical-desc-strong-smelling
  flavor: acid
  color: "#44944A"
  boilingPoint: 78.2
  meltingPoint: -19.4
  reactiveEffects:
    Acidic:
      methods: [ Touch ]
      effects:
      - !type:HealthChange
        conditions:
        - !type:TagCondition
          tag: "HumanoidXeno"
          inverted: true
        scaling: true
        ignoreResistances: false
        damage:
          types:
            Caustic: 1
      - !type:Emote
        conditions:
        - !type:TagCondition
          tag: "HumanoidXeno"
          inverted: true
        emote: Scream
        probability: 0.2
  metabolisms:
    Bloodstream:
      metabolismRate: 3.00 # High damage, high metabolism rate. You need a lot of units to crit. Simulates acid burning through you fast.
      effects:
      - !type:HealthChange
        conditions:
        - !type:TagCondition
          tag: "HumanoidXeno"
          inverted: true
        damage:
          types:
            Caustic: 7
      - !type:PopupMessage
        conditions:
        - !type:TagCondition
          tag: "HumanoidXeno"
          inverted: true
        type: Local
        visualType: Large
        messages: [ "generic-reagent-effect-burning-insides" ]
        probability: 0.33
      - !type:Emote
        conditions:
        - !type:TagCondition
          tag: "HumanoidXeno"
          inverted: true
        emote: Scream
        probability: 0.25

