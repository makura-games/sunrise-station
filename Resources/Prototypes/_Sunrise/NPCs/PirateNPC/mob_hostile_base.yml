#region Movement
- type: entity
  id: MobEnhancedMovement
  abstract: true
  components:
  #- type: MovementAlwaysTouching
  #- type: MovementIgnoreGravity
  - type: ProtectedFromStepTriggers
  - type: Climbing
  - type: Tool
    speedModifier: 1.5
    qualities:
      - Prying
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 1.5
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: Access
    groups:
    - AllAccess

- type: entity # For reference 4.5 is the speed of unencumbered humans
  id: MobMovementSpeedModifierMelee
  abstract: true
  components:
  - type: MovementSpeedModifier
    baseWalkSpeed : 4.2 # ~10% slowdown
    baseSprintSpeed : 4.2 # ~10% slowdown

- type: entity
  id: MobMovementSpeedModifierEVAMelee
