# Туториал вирусологии: цепочка от больного до вакцины.
# Машины здесь — учебные копии с укороченными таймерами, а учебный штамм не передаётся,
# поэтому игрок не заболеет посреди урока и не будет ждать настоящие минуты роста культуры.

- type: tutorialSequence
  id: VirologyTutorial
  duration: 900
  estimatedDuration:
    minimum: 420
    maximum: 780
  priority: 0
  name: virology-tutorial-name
  tooltip: virology-tutorial-tooltip
  grid: /Maps/_Sunrise/Tutorials/virology_tutorial.yml
  playerEntity: VirologyTutorialPlayer
  steps:
  - VirologyTutWelcome
  - VirologyTutEquipMask
  - VirologyTutEquipGloves
  - VirologyTutExamineGloves
  - VirologyTutEquipVisor
  - VirologyTutReachWard
  - VirologyTutExaminePatient
  - VirologyTutTakeSwab
  - VirologyTutSwabPatient
  - VirologyTutSwabWait
  - VirologyTutSpotSource
  - VirologyTutTakeSprayer
  - VirologyTutDisinfect
  - VirologyTutReachLab
  - VirologyTutSeedDish
  - VirologyTutGrowWait
  - VirologyTutTakeDish
  - VirologyTutInsertDiagnoser
  - VirologyTutReadReport
  - VirologyTutOpenDatabase
  - VirologyTutExplainDatabase
  - VirologyTutInsertVaccinator
  - VirologyTutOpenVaccinator
  - VirologyTutExplainBatches
  - VirologyTutProduceVaccine
  - VirologyTutInjectPatient
  - VirologyTutFinish
  - TutorialMHelp

