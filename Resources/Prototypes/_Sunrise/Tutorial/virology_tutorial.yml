  parent: TutorialGoalMarker

- type: entity
  name: virology tutorial lab marker
  id: VirologyTutMarkerLab
  parent: TutorialGoalMarker

# --- Игрок ---

# КПК выдаётся ради карты доступа: без неё не открыть консоль базы вирусов.
- type: startingGear
  id: VirologyTutorialPlayerGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitVirology
    shoes: ClothingShoesColorWhite
    back: ClothingBackpackVirology
    id: VirologistPDA
    ears: ClothingHeadsetMedical

- type: entity
  parent: BaseTutorialPlayer
  id: VirologyTutorialPlayer
  components:
  - type: Loadout
    prototypes: [VirologyTutorialPlayerGear]
  - type: Godmode
  - type: TutorialAttackSoftLock
  - type: TutorialInteractSoftLock
    targets:
    - Poweredlight

# --- Учебный штамм и пациент ---

# Учебная простуда: без путей передачи, поэтому от пациента никто не заразится.
# Набор симптомов задан руками, чтобы отчёт и партии вакцинатора выглядели одинаково у всех.
- type: disease
  id: SunriseTutorialCold
  name: disease-tutorial-cold-name
  description: disease-tutorial-cold-description
  syndrome: disease-syndrome-respiratory
  classification: Viral
  routes: [ None ]
  rollStrain: false
  treatmentHints:
  - disease-hint-rest
  - disease-hint-mask
  blacklist:
    tags:
    - SiliconEmotes
  immunity:
    type: Temporary
    duration: 900
  regression:
    minDuration: 60
    chance: 0.1
    maxDuration: 180
  stages:
  - advance:
      minDuration: 600
      chance: 0.05
      maxDuration: 900
    minSymptoms: 3
    maxSymptoms: 3
    symptomPool:
    - symptom: SymptomCough
    - symptom: SymptomSoreThroat
    - symptom: SymptomHeadache

- type: entity
  parent: MobHuman
  id: VirologyTutorialPatient
  name: virology tutorial patient
  suffix: Training
  components:
  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: DiseaseStartInfected
    diseases:
    - SunriseTutorialCold
  - type: PassiveDamage
    damage: {}

- type: entity
  parent: MarkerBase
  id: VirologyTutorialPatientSpawner
  name: virology tutorial patient spawner
  components:
  - type: ConditionalSpawner
    prototypes:
    - VirologyTutorialPatient

# --- Учебные предметы и машины ---

# Поднос с учебным штаммом: светится в визоре, но никого не заражает.
- type: entity
  parent: FoodPlateTin
  id: VirologyTutorialTray
  name: contaminated tray
  suffix: Training
  description: A used tray from the ward. Something dried on it.
  components:
  - type: DiseaseSource
    templates: [ SunriseTutorialCold ]
    routes: [ Contact ]
    contactChance: 0
    ingestionChance: 0

- type: entity
  parent: SunrisePetriDish
  id: VirologyTutorialDish
  suffix: Training
  components:
  - type: DiseaseCulture
    growTime: 10

- type: entity
  parent: SunriseDiseaseDiagnoser
  id: VirologyTutorialDiagnoser
  suffix: Training
  components:
  - type: DiseaseDiagnoser
    printDelay: 4

# Учебному вакцинатору не нужна биомасса, а промывка после промаха занимает секунды.
- type: entity
  parent: SunriseVaccinator
  id: VirologyTutorialVaccinator
  suffix: Training
  components:
  - type: Vaccinator
    synthesisDelay: 4
    trialCost: 0
    productionCost: 0
    failureCooldown: 5
