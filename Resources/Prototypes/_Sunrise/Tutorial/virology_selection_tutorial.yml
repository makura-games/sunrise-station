# --- Игрок и машины ---

- type: entity
  parent: BaseTutorialPlayer
  id: VirologySelectionTutorialPlayer
  components:
  - type: Loadout
    prototypes: [VirologyTutorialPlayerGear]
  - type: Godmode
  - type: TutorialAttackSoftLock
  - type: TutorialInteractSoftLock
    targets:
    - Poweredlight

# Учебному микроскопу хватает реагентов на всю партию, доливать по ходу урока не нужно.
- type: entity
  parent: SunriseDiseaseMicroscope
  id: VirologyTutorialMicroscope
  suffix: Training
  components:
  - type: Solution
    id: microscope
    solution:
      maxVol: 200
      reagents:
      - ReagentId: EZNutrient
        Quantity: 100
      - ReagentId: Phenol
        Quantity: 100
