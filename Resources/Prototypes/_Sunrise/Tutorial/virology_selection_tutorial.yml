# Туториал селекции: от заготовки до выведенного штамма и сосуда для исследования.
# Микроскоп здесь учебный: резервуар полный, а заготовка всегда слабая, поэтому партия выигрывается
# с первого раза и урок укладывается в несколько минут.

- type: tutorialSequence
  id: VirologySelectionTutorial
  duration: 900
  estimatedDuration:
    minimum: 360
    maximum: 660
  priority: 1
  name: virology-selection-tutorial-name
  tooltip: virology-selection-tutorial-tooltip
  grid: /Maps/_Sunrise/Tutorials/virology_selection_tutorial.yml
  playerEntity: VirologySelectionTutorialPlayer
  steps:
  - SelectionTutWelcome
  - SelectionTutTakeBlank
  - SelectionTutInsertBlank
  - SelectionTutOpenMicroscope
  - SelectionTutExplainSample
  - SelectionTutExplainReservoir
  - SelectionTutExplainSelector
  - SelectionTutPrepare
  - SelectionTutExplainField
  - SelectionTutNutrient
  - SelectionTutExplainRival
  - SelectionTutInhibitor
  - SelectionTutForecast
  - SelectionTutExplainGauge
  - SelectionTutFinishMatch
  - SelectionTutExplainGenome
  - SelectionTutAdvance
  - SelectionTutProduce
  - SelectionTutTakeStrain
  - SelectionTutInsertVessel
  - SelectionTutExplainVessel
  - SelectionTutFinish
  - TutorialMHelp

- type: tutorialStep
  id: SelectionTutWelcome
  parent: BaseTutorialStepBase
  bubble:
    text: selection-tut-welcome-bubble
  chatMessage: selection-tut-welcome-chat
  ttsMessage: selection-tut-welcome-tts
  effects:
  - !type:TutorialComponentEffect
    components:
    - type: TutorialPickupSoftLock
      blockAll: true
  conditions:
  - !type:StepDelayCondition
    delay: 10

- type: tutorialStep
  id: SelectionTutTakeBlank
  parent: BaseTutorialStepBase
  target: SunriseDiseaseBlankSampleWeak
  bubble:
    text: selection-tut-take-blank-bubble
    attachToTarget: true
  chatMessage: selection-tut-take-blank-chat
  ttsMessage: selection-tut-take-blank-tts
  observeRange: 14
  uiHighlight:
  - !type:UiByEntityPrototype
    prototype: SunriseDiseaseBlankSampleWeak
  effects:
  - !type:TutorialComponentEffect
    components:
    - type: TutorialPickupSoftLock
      allowedItems:
      - SunriseDiseaseBlankSampleWeak
  conditions:
  - !type:PickupListenedCondition
    target: SunriseDiseaseBlankSampleWeak

- type: tutorialStep
  id: SelectionTutInsertBlank
  parent: BaseTutorialStepBase
  target: VirologyTutorialMicroscope
  bubble:
    text: selection-tut-insert-blank-bubble
    attachToTarget: true
  chatMessage: selection-tut-insert-blank-chat
  ttsMessage: selection-tut-insert-blank-tts
  observeRange: 14
  uiHighlight:
  - !type:UiByEntityPrototype
    prototype: VirologyTutorialMicroscope
  effects:
  - !type:TutorialComponentEffect
    components:
    - type: TutorialPickupSoftLock
      allowedItems:
      - SunriseDiseaseBlankSampleWeak
  conditions:
  - !type:ItemInsertedListenedCondition
    item: SunriseDiseaseBlankSampleWeak
    target: VirologyTutorialMicroscope

- type: tutorialStep
  id: SelectionTutOpenMicroscope
  parent: BaseTutorialStepBase
  target: VirologyTutorialMicroscope
  bubble:
    text: selection-tut-open-microscope-bubble
    attachToTarget: true
  chatMessage: selection-tut-open-microscope-chat
  ttsMessage: selection-tut-open-microscope-tts
  observeRange: 14
  uiHighlight:
  - !type:UiByEntityPrototype
    prototype: VirologyTutorialMicroscope
  effects:
  - !type:TutorialComponentEffect
    components:
    - type: TutorialPickupSoftLock
      blockAll: true
  conditions:
  - !type:BuiOpenListenedCondition
    target: VirologyTutorialMicroscope

