# Root abstract base for all tutorial steps.
- type: tutorialStep
  id: BaseTutorialStepBase
  abstract: true
  sender: base-tutorial-sender

# Общий финальный шаг с напоминанием о помощи наставников.
- type: tutorialStep
  id: TutorialMHelp
  parent: BaseTutorialStepBase
  bubble:
    text: tutorial-mhelp-bubble
  chatMessage: tutorial-mhelp-chat
  ttsMessage: tutorial-mhelp-tts
  uiHighlight:
  - !type:UiByName
    name: TopBar
  - !type:UiByName
    name: MHelpButton
  completion:
    all:
    - !type:ElapsedTimeObjectiveCondition
      delay: 9

# Steps where the player moves/walks.
- type: tutorialStep
  id: BaseTutorialMovementStepBase
  parent: BaseTutorialStepBase
  abstract: true
  chatMessage: tutorial-base-walk-chat
  ttsMessage: tutorial-base-walk-tts
  completion:
    all:
    - !type:TravelDistanceObjectiveCondition
      distance: 10

# Steps where the player picks up an item from the world.
- type: tutorialStep
  id: BaseTutorialPickupStepBase
  parent: BaseTutorialStepBase
  abstract: true
  chatMessage: tutorial-base-step-pickup-chat
  ttsMessage: tutorial-base-step-pickup-tts
  completion:
    all:
    - !type:PickupObjectiveCondition

