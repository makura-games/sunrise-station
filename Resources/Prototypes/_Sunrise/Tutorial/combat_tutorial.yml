- type: tutorialSequence
  id: CombatTutorial
  duration: 720
  estimatedDuration:
    minimum: 300
    maximum: 600
  priority: 7
  name: combat-tutorial-name
  tooltip: combat-tutorial-tooltip
  grid: /Maps/_Sunrise/Tutorials/combat_tutorial.yml
  texture: /Textures/_Sunrise/Tutorial/combat_tutorial.png
  playerEntity: CombatTutorialPlayer
  steps:
  - CombatTutWelcome
  - CombatTutActionBar
  - CombatTutEnableCombatMode
  - CombatTutUnarmedAttack
  - CombatTutExplainStamina
  - CombatTutExplainAttackTypes
  - CombatTutDisarm
  - CombatTutTakeMelee
  - CombatTutMeleeAttack
  - CombatTutWideAttack
  - CombatTutReturnMelee
  - CombatTutTakePistol
  - CombatTutShootTarget
  - CombatTutReturnPistol
  - CombatTutTakeCarbine
  - CombatTutShootCarbineUnwielded
  - CombatTutWieldCarbine
  - CombatTutShootCarbineWielded
  - CombatTutDisableCombatMode
  - CombatTutChargeCarbine
  - CombatTutForceEscalation
  - CombatTutFinish
  - TutorialMHelp

- type: tutorialStep
  id: CombatTutWelcome
  parent: BaseTutorialStepBase
  bubble:
    text: combat-tut-welcome-bubble
  chatMessage: combat-tut-welcome-chat
  ttsMessage: combat-tut-welcome-tts
  effects:
  - !type:TutorialComponentEffect
    components:
    - type: TutorialPickupSoftLock
      blockAll: true
      popup: combat-tut-softlock-follow-step
    - type: TutorialAttackSoftLock
      popup: combat-tut-softlock-follow-step
  conditions:
  - !type:StepDelayCondition
    delay: 11

- type: tutorialStep
  id: CombatTutActionBar
  parent: BaseTutorialStepBase
  bubble:
    text: combat-tut-action-bar-bubble
  chatMessage: combat-tut-action-bar-chat
  ttsMessage: combat-tut-action-bar-tts
  blockUiInteraction: true
  uiHighlight:
  - !type:UiByName
    name: Actions
  - !type:UiByName
    name: ActionsContainer
  effects:
  - !type:TutorialComponentEffect
    components:
    - type: TutorialPickupSoftLock
      blockAll: true
      popup: combat-tut-softlock-follow-step
    - type: TutorialAttackSoftLock
      popup: combat-tut-softlock-follow-step
  conditions:
  - !type:StepDelayCondition
    delay: 11

- type: tutorialStep
  id: CombatTutEnableCombatMode
  parent: BaseTutorialStepBase
  bubble:
    text: combat-tut-enable-combat-mode-bubble
  chatMessage: combat-tut-enable-combat-mode-chat
  ttsMessage: combat-tut-enable-combat-mode-tts
  uiHighlight:
  - !type:UiByEntityPrototype
    prototype: ActionCombatModeToggle
  effects:
  - !type:TutorialComponentEffect
    components:
    - type: TutorialPickupSoftLock
      blockAll: true
      popup: combat-tut-softlock-follow-step
    - type: TutorialDropSoftLock
      popup: combat-tut-softlock-follow-step
    - type: TutorialStorageInsertSoftLock
      items:
      - SurvivalKnife
      - CombatTutorialWeaponDisablerPractice
      - WeaponLaserCarbinePractice
      popup: combat-tut-softlock-keep-weapon
    - type: TutorialEquipBlockedSoftLock
      items:
      - SurvivalKnife
      - CombatTutorialWeaponDisablerPractice
      - WeaponLaserCarbinePractice
      blockAllSlots: true
      popup: combat-tut-softlock-keep-weapon
    - type: TutorialAttackSoftLock
      popup: combat-tut-softlock-follow-step
  conditions:
  - !type:CombatModeCondition

- type: tutorialStep
  id: CombatTutUnarmedAttack
  parent: BaseTutorialStepBase
  target: CombatTutorialTargetHuman
  bubble:
    text: combat-tut-unarmed-attack-bubble
    attachToTarget: true
  chatMessage: combat-tut-unarmed-attack-chat
  ttsMessage: combat-tut-unarmed-attack-tts
  observeRange: 14
  effects:
  - !type:TutorialComponentEffect
    components:
    - type: TutorialPickupSoftLock
      blockAll: true
      popup: combat-tut-softlock-follow-step
    - type: TutorialAttackSoftLock
      allowedTargets:
      - CombatTutorialTargetHuman
      allowUnarmed: true
      popup: combat-tut-softlock-attack-target
  failures:
  - conditions:
    - !type:CombatModeCondition
      enabled: false
    repairStep: CombatTutEnableCombatMode
  conditions:
  - !type:MeleeHitListenedCondition
    target: CombatTutorialPlayer
    hitTarget: CombatTutorialTargetHuman

- type: tutorialStep
  id: CombatTutExplainStamina
  parent: BaseTutorialStepBase
  bubble:
    text: combat-tut-explain-stamina-bubble
  chatMessage: combat-tut-explain-stamina-chat
  ttsMessage: combat-tut-explain-stamina-tts
  uiHighlight:
  - !type:UiByName
    name: AlertContainer
  - !type:UiByAlertPrototype
    prototype: Stamina
  effects:
  - !type:TutorialComponentEffect
    components:
    - type: TutorialPickupSoftLock
      blockAll: true
      popup: combat-tut-softlock-follow-step
    - type: TutorialAttackSoftLock
      silent: true
      popup: combat-tut-softlock-follow-step
    - type: TutorialSimulatedAlert
      alert: Stamina
      severity: 4
  conditions:
  - !type:StepDelayCondition
    delay: 12

