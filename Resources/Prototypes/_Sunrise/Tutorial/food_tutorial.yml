- type: startingGear
  id: FoodTutorialPlayerGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitColorGrey
    shoes: ClothingShoesColorBlack

- type: entity
  parent: BaseTutorialPlayer
  id: FoodTutorialPlayer
  name: bar visitor
  suffix: Tutorial
  components:
  - type: Loadout
    prototypes: [FoodTutorialPlayerGear]
  - type: Hunger
    baseDecayRate: 0
    thresholds:
      Overfed: 200
      Okay: 111
      Peckish: 100
      Starving: 50
      Dead: 0
  - type: Thirst
    baseDecayRate: 0
    startingThirst: 295
  - type: Godmode

- type: entity
  parent: TutorialGoalMarker
  id: FoodTutorialBarMarker
  name: bar marker
  suffix: Tutorial

- type: entity
  parent: TutorialGoalMarker
  id: FoodTutorialDishReturnMarker
  name: dish return marker
  suffix: Tutorial
