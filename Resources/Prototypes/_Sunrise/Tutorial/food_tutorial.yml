- type: tutorialSequence
  id: FoodTutorial
  duration: 600
  estimatedDuration:
    minimum: 240
    maximum: 480
  priority: 6
  name: food-tutorial-name
  tooltip: food-tutorial-tooltip
  grid: /Maps/_Sunrise/Tutorials/food_tutorial.yml
  texture: /Textures/_Sunrise/Tutorial/food_tutorial.png
  playerEntity: FoodTutorialPlayer
  steps:
  - FoodTutWelcome
  - FoodTutReachBar
  - FoodTutExplainHunger
  - FoodTutExplainThirst
  - FoodTutTakeDrink
  - FoodTutDrink
  - FoodTutPutDrinkDown
  - FoodTutTakeMeal
  - FoodTutEatMeal
  - FoodTutReturnDish
  - FoodTutReagentWarning
  - FoodTutExamineSuspiciousDrink
  - FoodTutUnsafeItems
  - FoodTutFinish
  - TutorialMHelp

- type: tutorialStep
  id: FoodTutWelcome
  parent: BaseTutorialStepBase
  bubble:
    text: food-tut-welcome-bubble
  chatMessage: food-tut-welcome-chat
  ttsMessage: food-tut-welcome-tts
  effects:
  - !type:TutorialEntityEffect
    effects:
    - !type:SatiateHunger
      factor: -15
  - !type:TutorialComponentEffect
    components:
    - type: TutorialPickupSoftLock
      blockAll: true
  conditions:
  - !type:StepDelayCondition
    delay: 10

- type: tutorialStep
  id: FoodTutReachBar
  parent: BaseTutorialStepBase
  target: FoodTutorialBarMarker
  bubble:
    text: food-tut-reach-bar-bubble
  chatMessage: food-tut-reach-bar-chat
  ttsMessage: food-tut-reach-bar-tts
  effects:
  - !type:TutorialComponentEffect
    components:
    - type: TutorialPickupSoftLock
      blockAll: true
  conditions:
  - !type:ReachMarkerCondition
    marker: FoodTutorialBarMarker

- type: tutorialStep
  id: FoodTutExplainHunger
  parent: BaseTutorialStepBase
  bubble:
    text: food-tut-explain-hunger-bubble
  chatMessage: food-tut-explain-hunger-chat
  ttsMessage: food-tut-explain-hunger-tts
  uiHighlight:
  - !type:UiByName
    name: AlertContainer
  - !type:UiByAlertPrototype
    prototype: Peckish
  effects:
  - !type:TutorialComponentEffect
    components:
    - type: TutorialPickupSoftLock
      blockAll: true
  conditions:
  - !type:StepDelayCondition
    delay: 10

- type: tutorialStep
  id: FoodTutExplainThirst
  parent: BaseTutorialStepBase
  bubble:
    text: food-tut-explain-thirst-bubble
  chatMessage: food-tut-explain-thirst-chat
  ttsMessage: food-tut-explain-thirst-tts
  uiHighlight:
  - !type:UiByName
    name: AlertContainer
  - !type:UiByAlertPrototype
    prototype: Thirsty
  effects:
  - !type:TutorialComponentEffect
    components:
    - type: TutorialPickupSoftLock
      blockAll: true
  conditions:
  - !type:StepDelayCondition
    delay: 10

- type: tutorialStep
  id: FoodTutTakeDrink
  parent: BaseTutorialStepBase
  target: DrinkLemonadeGlass
  bubble:
    text: food-tut-take-drink-bubble
    attachToTarget: true
  chatMessage: food-tut-take-drink-chat
  ttsMessage: food-tut-take-drink-tts
  observeRange: 14
  uiHighlight:
  - !type:UiByEntityPrototype
    prototype: DrinkLemonadeGlass
  effects:
  - !type:TutorialComponentEffect
    components:
    - type: TutorialPickupSoftLock
      allowedItems:
      - DrinkLemonadeGlass
      popup: food-tut-softlock-pickup-highlighted
    - type: TutorialIngestSoftLock
      targets:
      - DrinkLemonadeGlass
      popup: food-tut-softlock-ingest-blocked
  conditions:
  - !type:PickupListenedCondition
    target: DrinkLemonadeGlass

- type: tutorialStep
  id: FoodTutDrink
  parent: BaseTutorialStepBase
  bubble:
    text: food-tut-drink-bubble
  chatMessage: food-tut-drink-chat
  ttsMessage: food-tut-drink-tts
  uiHighlight:
  - !type:UiByEntityPrototype
    prototype: DrinkLemonadeGlass
  effects:
  - !type:TutorialComponentEffect
    components:
    - type: TutorialPickupSoftLock
      blockAll: true
    - type: TutorialDropSoftLock
      popup: food-tut-softlock-keep-drink
    - type: TutorialStorageInsertSoftLock
      items:
      - DrinkLemonadeGlass
      popup: food-tut-softlock-keep-drink
    - type: TutorialEquipBlockedSoftLock
      items:
      - DrinkLemonadeGlass
      blockAllSlots: true
      popup: food-tut-softlock-keep-drink
  preconditions:
  - !type:HoldInHandsCondition
    item: DrinkLemonadeGlass
  preconditionFailStep: FoodTutTakeDrink
  failures:
  - conditions:
    - !type:HoldInHandsCondition
      item: DrinkLemonadeGlass
      inverted: true
    - !type:ConsumeListenedCondition
      target: DrinkLemonadeGlass
      inverted: true
    repairStep: FoodTutTakeDrink
  conditions:
  - !type:ConsumeListenedCondition
    target: DrinkLemonadeGlass

- type: tutorialStep
  id: FoodTutPutDrinkDown
  parent: BaseTutorialStepBase
  target: FoodTutorialDishReturnMarker
  bubble:
    text: food-tut-put-drink-down-bubble
    attachToTarget: true
  chatMessage: food-tut-put-drink-down-chat
  ttsMessage: food-tut-put-drink-down-tts
  observeRange: 14
  effects:
  - !type:TutorialComponentEffect
    components:
    - type: TutorialPickupSoftLock
      allowedItems:
      - DrinkLemonadeGlass
      popup: food-tut-softlock-put-drink-down
    - type: TutorialStorageInsertSoftLock
      items:
      - DrinkLemonadeGlass
      popup: food-tut-softlock-put-drink-down
    - type: TutorialEquipBlockedSoftLock
      items:
      - DrinkLemonadeGlass
      blockAllSlots: true
      popup: food-tut-softlock-put-drink-down
  conditions:
  - !type:ItemPlacedNearMarkerCondition
    target: DrinkLemonadeGlass
    marker: FoodTutorialDishReturnMarker
    distance: 1

- type: tutorialStep
  id: FoodTutTakeMeal
  parent: BaseTutorialStepBase
