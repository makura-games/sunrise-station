  effects:
  - !type:TutorialComponentEffect
    components:
    - type: TutorialPickupSoftLock
      allowedItems:
      - FoodMealNachos
      popup: food-tut-softlock-pickup-highlighted
    - type: TutorialIngestSoftLock
      targets:
      - FoodMealNachos
      popup: food-tut-softlock-ingest-blocked
    - type: TutorialDropSoftLock
      popup: food-tut-softlock-keep-dishes
    - type: TutorialStorageInsertSoftLock
      items:
      - DrinkLemonadeGlass
      - FoodMealNachos
      popup: food-tut-softlock-keep-dishes
    - type: TutorialEquipBlockedSoftLock
      items:
      - DrinkLemonadeGlass
      - FoodMealNachos
      blockAllSlots: true
      popup: food-tut-softlock-keep-dishes
  conditions:
  - !type:PickupListenedCondition
    target: FoodMealNachos

- type: tutorialStep
  id: FoodTutEatMeal
  parent: BaseTutorialStepBase
  bubble:
    text: food-tut-eat-meal-bubble
  chatMessage: food-tut-eat-meal-chat
  ttsMessage: food-tut-eat-meal-tts
  uiHighlight:
  - !type:UiByEntityPrototype
    prototype: FoodMealNachos
  effects:
  - !type:TutorialComponentEffect
    components:
    - type: TutorialPickupSoftLock
      allowedItems:
      - FoodPlateSmall
      popup: food-tut-softlock-keep-meal
    - type: TutorialDropSoftLock
      popup: food-tut-softlock-keep-meal
    - type: TutorialStorageInsertSoftLock
      items:
      - DrinkLemonadeGlass
      - FoodMealNachos
      - FoodPlateSmall
      popup: food-tut-softlock-keep-meal
    - type: TutorialEquipBlockedSoftLock
      items:
      - DrinkLemonadeGlass
      - FoodMealNachos
      - FoodPlateSmall
      blockAllSlots: true
      popup: food-tut-softlock-keep-meal
  failures:
  - conditions:
    - !type:HoldInHandsCondition
      item: FoodMealNachos
      inverted: true
    - !type:ConsumeListenedCondition
      target: FoodMealNachos
      inverted: true
    repairStep: FoodTutTakeMeal
  conditions:
  - !type:HoldInHandsCondition
    item: FoodPlateSmall

