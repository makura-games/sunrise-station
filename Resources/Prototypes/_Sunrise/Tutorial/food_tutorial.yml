  bubble:
    text: food-tut-take-meal-bubble
    attachToTarget: true
  chatMessage: food-tut-take-meal-chat
  ttsMessage: food-tut-take-meal-tts
  observeRange: 14
  uiHighlight:
  - !type:UiByEntityPrototype
