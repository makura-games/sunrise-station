- type: entity
  id: BloodBoil
  parent: BaseBullet
  name: Blood Boil
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Sunrise/BloodCult/Weapons/projectiles.rsi
    layers:
    - state: bullet
  - type: Projectile
    damage:
      types:
        Heat: 2.5
        Shock: 2.5
        Cold: 2.5
        Caustic: 2.5
        Blunt: 3.33
        Slash: 3.33
        Piercing: 3.34
  - type: PointLight
    enabled: true
    color: "#ff4300"
    radius: 2.0
    energy: 7.0
  - type: BloodBoilProjectile
  - type: TimedDespawn
    lifetime: 50

- type: entity
  id: BloodBolt
  parent: BaseBullet
  name: Blood
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Sunrise/BloodCult/Weapons/projectiles.rsi
    layers:
    - state: blood_bolt
  - type: Projectile
    damage:
      types:
        Heat: 0
        Shock: 0
        Cold: 0
        Caustic: 0
  - type: BloodBolt
    damage:
      types:
        Blunt: 8.33
        Slash: 8.33
        Piercing: 8.34
    healConstruct:
      types:
        Blunt: -10
        Slash: -10
        Piercing: -10
        Heat: -7.5
        Shock: -7.5
        Cold: -7.5
        Caustic: -7.5
        Poison: -15
        Radiation: -15
    unholyVolume: 8
  - type: PointLight
    enabled: true
    color: "#ff0000"
    radius: 3.0
    energy: 3.0
  - type: TimedDespawn
    lifetime: 10
