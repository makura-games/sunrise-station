- type: entity
  parent: BaseAction
  id: ActionCultTwistedConstruction
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    temporary: true
    useDelay: 5
    itemIconStyle: NoItem
  - type: Sprite
    sprite: /Textures/_Sunrise/BloodCult/actions_cult.rsi
    layers:
    - state: transmute
  - type: TargetAction
    range: 2
    checkCanAccess: true
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:CultTwistedConstructionActionEvent

- type: entity
  parent: BaseAction
  id: InstantActionBloodMagic
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    temporary: false # Удаляется BloodCultRuleSystem, чтобы клиент не предсказывал удаление при полном сбросе состояния.
    useDelay: 3
    itemIconStyle: NoItem
  - type: Sprite
    sprite: /Textures/_Sunrise/BloodCult/actions_cult.rsi
    layers:
    - state: carve
  - type: InstantAction
    event: !type:CultBloodMagicInstantActionEvent

