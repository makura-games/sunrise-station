- type: entity
  parent: BaseAction
  id: ActionCultStun
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    temporary: true
    useDelay: 5
    itemIconStyle: NoItem
  - type: Sprite
    sprite: /Textures/_Sunrise/BloodCult/actions_cult.rsi
    layers:
    - state: stun
  - type: TargetAction
    range: 2
    checkCanAccess: true
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - HumanoidProfile
      - BorgChassis
    event: !type:CultStunTargetActionEvent
  - type: LimitedCharges
    maxCharges: 1
  - type: DeleteWithoutCharges

