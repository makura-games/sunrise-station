- type: entity
  parent: BaseAction
  id: ArtificerCreateSoulStone
  categories: [ HideSpawnMenu ]
  components:
    - type: Action
      useDelay: 300
      sound: /Audio/_Sunrise/BloodCult/curse.ogg
    - type: Sprite
      sprite: /Textures/_Sunrise/BloodCult/actions_cult.rsi
      layers:
      - state: phaseshift
    - type: InstantAction
      event: !type:ArtificerCreateSoulStoneActionEvent

