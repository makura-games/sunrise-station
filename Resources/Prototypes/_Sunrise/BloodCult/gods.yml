- type: entity
  abstract: true
  id: BaseBloodCultGod
  name: Nar'si
  components:
  - type: RandomWalk
    minSpeed: 10
    maxSpeed: 15
    minStepCooldown: 1
    maxStepCooldown: 2
  - type: Appearance
  - type: Narsie
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      Penis:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        restitution: 0.8
        density: 1
        mask:
          - None
        layer:
          - None
  - type: Clickable
  - type: MovementIgnoreGravity
  - type: GravityAffected
  - type: Pylon
    tileConvertCooldown: 0.1
    convertEverything: true
    tilesConvertRange: 15
    healingAuraRange: 100
    healingAuraDamage:
      types:
        Blunt: -1.67
        Slash: -1.67
        Piercing: -1.66
        Heat: -1.25
        Shock: -1.25
        Cold: -1.25
        Caustic: -1.25
        Poison: -1.5
        Radiation: -1.5
        Cellular: -0.5
        Mangleness: -0.5
    burnDamageOnInteract:
      types:
        Heat: 1.25
        Shock: 1.25
        Cold: 1.25
        Caustic: 1.25

- type: entity
  id: Narsie
  parent: BaseBloodCultGod
  name: Nar'Si
  components:
  - type: Sprite
    sprite: Mobs/Demons/narsie.rsi
    drawdepth: Ghosts
    scale: 1.0,1.0
    layers:
    - state: narsie
      shader: unshaded

- type: entity
  id: Narbee
  parent: BaseBloodCultGod
  name: Pir'Kus
  components:
  - type: Sprite
    sprite: _Sunrise/Mobs/Aliens/narbee.rsi
    drawdepth: Ghosts
    scale: 1.0,1.0
    layers:
    - state: narbee
      shader: unshaded

- type: entity
  id: Reaper
  parent: BaseBloodCultGod
  name: Reaper
  components:
  - type: Sprite
    sprite: _Sunrise/Mobs/Aliens/reaper.rsi
    drawdepth: Ghosts
    scale: 1.0,1.0
    layers:
    - state: reaper
      shader: unshaded
