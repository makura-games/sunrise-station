- type: entity
  id: PetMobClownGoblin
  parent: [SimpleMobBase, BasePet]
  components:
  - type: UserInterface
    interfaces:
      enum.PetControlUiKey.Key:
        type: PetControlBoundUserInterface
        interactionRange: -1
  - type: HTN
    rootTask:
      task: PetCompound
    blackboard:
      IdleRange: !type:Single
        2.0
      FollowCloseRange: !type:Single
        1.0
      FollowRange: !type:Single
        1.5
  - type: TTS
    voice: meepo_dota_2
  - type: VentCrawler
  - type: ComplexInteraction
  - type: Speech
    speechSounds: BikeHorn
  - type: Sprite
    drawdepth: Mobs
    sprite: _Sunrise/Mobs/Aliens/clown_goblin.rsi
    state: goblin
  - type: MobThresholds
    thresholds:
      0: Alive
      170: Dead
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 170
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          ClothingShoesClown:
            min: 1
            max: 1
      - !type:SpawnEntitiesBehavior
        spawn:
          ClothingMaskClown:
            min: 1
            max: 1
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 100
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 5
  - type: Appearance
  - type: Tag
    tags:
    - CannotSuicide
    - FootstepSound
    - DoorBumpOpener
  - type: Respirator
    damage:
      types:
        Asphyxiation: 0.25
    damageRecovery:
      types:
        Asphyxiation: -0.25
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.1
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Honk
        Quantity: 50
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepClown
  - type: CombatMode
  - type: MeleeWeapon
    attackRate: 2
    damage:
      types:
        Blunt: 0.5
    soundHit:
      collection: BikeHorn
    animation: WeaponArcFist
  - type: StaminaDamageOnHit
    damage: 1
  - type: Vocal
    sounds:
      Male: ClownGoblin
      Female: ClownGoblin
      Unsexed: ClownGoblin
  - type: Eye
  - type: Puller
    needsHands: false
  - type: PressureImmunity
  - type: NoSlip
  - type: MovementAlwaysTouching
  - type: SleepEmitSound
    snore: /Audio/Voice/Misc/silly_snore.ogg
    interval: 10

