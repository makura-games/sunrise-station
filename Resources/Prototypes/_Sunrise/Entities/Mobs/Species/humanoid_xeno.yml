- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceHumanoidXeno
  name: humanoid xeno appearance
  components:
  - type: InitialBody
    organs:
      Torso: TorsoHumanoidXeno
      Head: HeadHumanoidXeno
      ArmLeft: LeftArmHumanoidXeno
      ArmRight: RightArmHumanoidXeno
      HandRight: RightHandHumanoidXeno
      HandLeft: LeftHandHumanoidXeno
      LegLeft: LeftLegHumanoidXeno
      LegRight: RightLegHumanoidXeno
      FootLeft: LeftFootHumanoidXeno
      FootRight: RightFootHumanoidXeno
      Brain: OrganHumanoidXenoBrain
      Eyes: OrganHumanoidXenoEyes
      Tongue: OrganHumanTongue
      Heart: OrganHumanoidXenoHeart
      Lungs: OrganHumanoidXenoLungs
      Stomach: OrganHumanoidXenoStomach
      Liver: OrganHumanoidXenoLiver
      Kidneys: OrganHumanoidXenoKidneys

- type: entity
  parent:
  - AppearanceHumanoidXeno
  - BaseSpeciesMobOrganic
  id: BaseMobHumanoidXeno
  name: Urist McXeno
  abstract: true
  components:
  - type: Interactions
  - type: Respirator
    damage:
      types:
        Asphyxiation: 0.2
    damageRecovery:
      types:
        Asphyxiation: -1.0
    maxSaturation: 50
    minSaturation: 40
  - type: Vocal
    sounds:
      Male: XenoHumanoid
      Female: XenoHumanoid
      Unsexed: XenoHumanoid
  - type: PressureImmunity
  - type: TypingIndicator
    proto: alien
  - type: Temperature
    currentTemperature: 310.15
  - type: TemperatureDamage
    coldDamage:
      types:
        Cold: 0
    heatDamage:
      types:
        Heat: 3
  - type: Speech
    speechVerb: LargeMob
    allowedEmotes: [ 'Hisses', 'Roars', 'Rumbles', 'Growl' ]
  - type: MeleeWeapon
    hidden: true
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    attackRate: 1
    damage:
      types:
        Blunt: 2
        Slash: 3
        Caustic: 1
  - type: LizardAccent
  - type: VulpaAccent
  - type: TajaranAccent
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: FluorosulfuricAcidHumanoidXeno
        Quantity: 300
  - type: BloodSource
    kind: Acid
    value: 0
  - type: ProtectedFromStepTriggers
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Xenomorph
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 4
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#44944A"
  - type: Stamina
    baseCritThreshold: 125
  - type: Sprite
    layers:
    - map: [ "enum.HumanoidVisualLayers.Chest" ]
    - map: [ "enum.HumanoidVisualLayers.Head" ]
    - map: [ "enum.HumanoidVisualLayers.Snout" ]
    - map: [ "enum.HumanoidVisualLayers.Eyes" ]
    - map: [ "enum.HumanoidVisualLayers.RArm" ]
    - map: [ "enum.HumanoidVisualLayers.LArm" ]
    - map: [ "enum.HumanoidVisualLayers.RLeg" ]
    - map: [ "enum.HumanoidVisualLayers.LLeg" ]
    - shader: StencilClear
      sprite: _Sunrise/Mobs/Species/HumanoidXeno/parts.rsi
      state:
    - map: ["enum.HumanoidVisualLayers.LFoot"]
    - map: ["enum.HumanoidVisualLayers.RFoot"]
    - map: ["bra"]
    - map: ["pants"]
    - map: ["socks"]
    - map: ["jumpsuit"]
    - map: ["enum.HumanoidVisualLayers.LHand"]
    - map: ["enum.HumanoidVisualLayers.RHand"]
    - map: [ "gloves" ]
