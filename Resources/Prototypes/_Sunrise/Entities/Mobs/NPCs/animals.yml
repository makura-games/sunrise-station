- type: entity
  parent: [SolutionWeapon, SolutionTiny]
  id: SolutionVenomClownSpider
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Laughter
        Quantity: 50

- type: entity
  name: inferior vulpkanin
  id: MobBaseInferiorVulpkanin
  parent: MobBaseAncestor
  abstract: true
  components:
  - type: NameIdentifier
    group: InferiorVulpkanin
  - type: LizardAccent
  - type: ReplacementAccent
    accent: dog
  - type: Speech
    speechSounds: Vulpkanin
    speechVerb: Vulpkanin
    allowedEmotes: ['Growl', 'Bark', 'Howl', 'Whines']
  - type: Vocal
    sounds:
      Male: MaleVulpkanin
      Female: FemaleVulpkanin
      Unsexed: MaleVulpkanin
  - type: BodyEmotes
    soundsId: ReptilianBodyEmotes
  - type: TypingIndicator
    proto: lizard
  - type: InteractionPopup
    successChance: 0.9
    interactSuccessString: petting-success-monkey
    interactFailureString: petting-failure-monkey
    interactSuccessSpawn: EffectHearts
    interactFailureSound:
      path: /Audio/Items/wirecutter.ogg
  - type: MobThresholds
    thresholds:
      0: Alive
      60: Critical
      125: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 5
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
        Piercing: 4
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: inferior_vulpkanin
      sprite: _Sunrise/Mobs/Animals/inferior_vulpkanin.rsi
    - map: [ "jumpsuit" ]
    - map: [ "enum.HumanoidVisualLayers.Handcuffs" ]
      color: "#ffffff"
      sprite: Objects/Misc/handcuffs.rsi
      state: body-overlay-2
      visible: false
    - map: [ "ears" ]
    - map: [ "outerClothing" ]
    - map: [ "id" ]
    - map: [ "mask" ]
    - map: [ "head" ]
    - map: [ "clownedon" ]
      sprite: "Effects/creampie.rsi"
      state: "creampie_human"
      visible: false
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeat
      amount: 2
  - type: AlwaysRevolutionaryConvertible
  - type: Body
  - type: EntityTableContainerFill
    containers:
      body_organs: !type:AllSelector
        children:
        - id: OrganAnimalLungs
        - id: OrganAnimalStomach
        - id: OrganAnimalLiver
        - id: OrganInferiorVulpkaninHeart
        - id: OrganAnimalKidneys

- type: entity
  name: inferior vulpkanin
  id: MobInferiorVulpkanin
  parent: MobBaseInferiorVulpkanin
  components:
  - type: Clumsy
    gunShootFailDamage:
      types:
        Blunt: 2
        Piercing: 7
        Heat: 0.75
        Shock: 0.75
        Cold: 0.75
        Caustic: 0.75
    clumsySound:
      path: /Audio/Voice/Reptilian/reptilian_scream.ogg

- type: entity
  id: MobBaseSyndicateInferiorVulpkanin
  parent: MobBaseInferiorVulpkanin
  suffix: syndicate base
  abstract: true
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      200: Dead
  - type: NpcFactionMember
    factions:
    - Syndicate
  - type: Loadout
    prototypes: [SyndicateOperativeGearMonkey]

- type: entity
  id: MobInferiorVulpkaninSyndicateAgent
  parent: MobBaseSyndicateInferiorVulpkanin
  suffix: syndicate agent
  components:
    # make the player a traitor once its taken
  - type: AutoTraitor
    profile: TraitorReinforcement

- type: entity
  id: MobInferiorVulpkaninSyndicateAgentNukeops # Reinforcement exclusive to nukeops uplink
  parent: MobBaseSyndicateInferiorVulpkanin
  suffix: NukeOps
  components:
  - type: NukeOperative
