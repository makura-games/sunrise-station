- type: entity
  id: SunriseMechReactorPaladin
  name: paladin-class reactor
  description: An antique reactor whose casing contains an integrated energy shield generator. The shield is activated using a signal transmitter.
  parent: BaseSunriseMechReactor
  components:
  - type: Sprite
    layers:
    - map: [ "enum.PowerCellVisualLayers.Base" ]
      state: paladin
