    maxCharge: 1200
    startingCharge: 1200
  - type: BatterySelfRecharger
    autoRechargeRate: 40
    autoRechargePauseTime: 1
  - type: EnergyDomeGenerator
    damageEnergyDraw: 2
    domePrototype: EnergyDomeSmallPink
    canInteractUse: false
    canDeviceNetworkUse: true
