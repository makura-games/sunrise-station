  components:
  - type: Sprite
    layers:
    - map: [ "enum.PowerCellVisualLayers.Base" ]
      state: high
    - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
      state: o2
      shader: unshaded
      visible: false
  - type: Battery
    maxCharge: 1080
    startingCharge: 1080
  - type: BatterySelfRecharger
    autoRechargeRate: 8
    autoRechargePauseTime: 15

- type: entity
