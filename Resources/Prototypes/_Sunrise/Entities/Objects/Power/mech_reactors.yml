- type: entity
  id: BaseSunriseMechReactor
  name: standard mech reactor
  description: A miniaturized reactor core built for installation in a mech chassis.
  parent: [BaseItem, MachineComponentSounds]
  abstract: true
  components:
  - type: Item
    size: Ginormous
  - type: MultiHandedItem
  - type: Sprite
    sprite: _Sunrise/Objects/Power/mech_reactors.rsi
    layers:
    - map: [ "enum.PowerCellVisualLayers.Base" ]
      state: medium
    - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
      state: o2
      shader: unshaded
      visible: false
  - type: Appearance
  - type: BatteryVisuals
  - type: GenericVisualizer
    visuals:
      enum.BatteryVisuals.State:
        enum.PowerCellVisualLayers.Unshaded:
          Full: { visible: false }
          Neither: { visible: true, state: o1 }
          Empty: { visible: true, state: o2 }
  - type: Battery
    maxCharge: 720
    startingCharge: 720
    pricePerJoule: 0.15
  - type: Tag
    tags:
    - MechReactor

- type: entity
  id: SunriseMechReactorStandard
  name: standard mech reactor
  description: A compact reactor with modest cooling and a long recovery cycle.
  parent: BaseSunriseMechReactor
  components:
  - type: BatterySelfRecharger
    autoRechargeRate: 8
    autoRechargePauseTime: 15

- type: entity
  id: SunriseMechReactorWorkhorse
  name: workhorse-class reactor
  description: A reinforced reactor with additional heat capacity, designed for sustained operation.
