- type: entity
  id: RCDAdvancedSunrise
  parent: RCD
  name: advanced RCD
  suffix: CE
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Tools/advanced_rcd.rsi
    layers:
    - state: icon
    - state: icon-ANM-Full
      shader: unshaded
  - type: Clothing
    sprite: _Sunrise/Objects/Tools/advanced_rcd.rsi
  - type: AutoRecharge
    rechargeDuration: 15

- type: entity
  name: abductor's wirecutter
  parent: BaseItem
  id: WirecutterAbductor
  components:
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/wirecutter_drop.ogg
  - type: Tag
    tags:
    - Wirecutter
  - type: BotanySampleTaker
  - type: Sprite
    sprite: Objects/Tools/wirecutters.rsi
    layers:
    - state: abductor
  - type: Tool
    speedModifier: 2
    qualities:
      - Cutting
    useSound:
      path: /Audio/Items/wirecutter.ogg
  - type: MeleeWeapon
    wideAnimationRotation: -90
    damage:
      types:
        Piercing: 2
    attackRate: 2 #open and close that shit on their arm like hell! because you sure aren't doing any damage with this
    soundHit:
      path: "/Audio/Items/wirecutter.ogg"
  - type: Item
    sprite: Objects/Tools/wirecutters.rsi
    storedRotation: -90
  - type: ToolTileCompatible
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
  - type: StaticPrice
    price: 30

- type: entity
  name: abductor's screwdriver
  parent: BaseItem
  id: ScrewdriverAbductor
  components:
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/screwdriver_drop.ogg
  - type: Tag
    tags:
    - Screwdriver
  - type: Sprite
    sprite: Objects/Tools/screwdriver.rsi
    layers:
    - state: abductor
  - type: Tool
    speedModifier: 2
    qualities:
      - Screwing
    useSound:
      collection: Screwdriver
  - type: Item
    sprite: Objects/Tools/screwdriver.rsi
    storedOffset: 2, 0
    storedRotation: 90
  - type: MeleeWeapon
    wideAnimationRotation: -90
    attackRate: 1
    damage:
      types:
        Piercing: 6
    soundHit:
      path: "/Audio/Weapons/bladeslice.ogg"
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
  - type: StaticPrice
    price: 30

- type: entity
  name: abductor's wrench
  parent: Wrench
  id: WrenchAbductor
  components:
  - type: Sprite
    sprite: Objects/Tools/wrench.rsi
    state: abductor
  - type: Item
    sprite: Objects/Tools/wrench.rsi
    storedRotation: 45
    storedSprite:
      sprite: Objects/Tools/wrench.rsi
      state: abductor
  - type: Tool
    speedModifier: 2
    qualities:
      - Anchoring
    useSound:
      path: /Audio/Items/ratchet.ogg

- type: entity
  name: abductor's multitool
  parent: Multitool
  id: MultitoolAbductor
  components:
  - type: Sprite
    sprite: _Sunrise/Abductor/Objects/Tools/multitool.rsi
  - type: Tag
    tags:
      - Multitool
      - DoorElectronicsConfigurator
      - ShowWires

- type: entity
  name: golden crowbar-wrench
  parent: Wrench
  id: GoldenCrowbarWrench
  description: 'A common tool for assembly and disassembly.'
  components:
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/crowbar_drop.ogg
  - type: Sprite
    sprite: _Sunrise/Objects/Tools/golden_wrench.rsi
    state: wrench
  - type: Item
    sprite: _Sunrise/Objects/Tools/golden_wrench.rsi
    storedSprite:
      sprite: _Sunrise/Objects/Tools/golden_wrench.rsi
      state: storage
  - type: Prying
    enabled: false
  - type: ToolTileCompatible
  - type: Tool
    qualities:
      - Anchoring
    useSound:
      path: /Audio/Items/ratchet.ogg
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 9
  - type: MultipleTool
    statusShowBehavior: true
    entries:
      - behavior: [ Anchoring ]
        sprite:
          sprite: _Sunrise/Objects/Tools/golden_wrench.rsi
          state: wrench
        useSound:
          path: /Audio/Items/ratchet.ogg
      - behavior: [ Prying ]
        sprite:
          sprite: _Sunrise/Objects/Tools/golden_wrench.rsi
          state: crowbar
        useSound:
          path: /Audio/Items/crowbar.ogg
  - type: Tag
    tags:
      - Crowbar
      - Wrench

- type: entity
  parent: [ HandHeldMassScannerBorg, BaseHighlyIllegalContraband ]
  id: HandHeldMassScannerPirate
  name: holographic pirate map
  description: A hand-held mass scanner.
  components:
  - type: Item
    sprite: _Sunrise/Objects/Tools/holo_pirate_map.rsi
  - type: Sprite
    sprite: _Sunrise/Objects/Tools/holo_pirate_map.rsi
    layers:
    - state: icon
