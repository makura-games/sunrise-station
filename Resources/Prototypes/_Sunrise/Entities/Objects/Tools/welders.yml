- type: entity
  parent: [SolutionWelder, SolutionToolGinormous]
  id: SunriseSolutionToolWelderIndustrialAdvanced
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    solution:
      maxVol: 500
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 500

- type: entity
  parent: SunriseSolutionToolWelderIndustrialAdvanced
  id: SunriseSolutionToolWelderExperimental
  categories: [ HideSpawnMenu ]
  components:
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 1

- type: entity
  parent: [SolutionWelder, SolutionToolGinormous]
  id: SunriseSolutionToolWelderAbductor
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    solution:
      maxVol: 1000
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 1000
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 1

- type: entity
  name: abductor's welding tool
  parent: [Welder, SunriseSolutionToolWelderAbductor]
  id: WelderAbductor
  description: "An experimental welder capable of self-fuel generation and less harmful to the eyes."
  components:
  - type: Sprite
    sprite: _Sunrise/Abductor/Objects/Tools/welder_abductor.rsi
  - type: Item
    sprite: _Sunrise/Abductor/Objects/Tools/welder_abductor.rsi
  - type: PointLight
    enabled: false
    radius: 1.5
    color: lightblue
  - type: Tool
    speedModifier: 2.0
    useSound:
      collection: Welder
    qualities: Welding
