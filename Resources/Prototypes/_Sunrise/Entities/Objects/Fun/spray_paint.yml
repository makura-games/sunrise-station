- type: entity
  parent: PaintBase
  id: SprayPaint
  name: configurable spray paint
  description: A spray paint can with an adjustable color.
  components:
  - type: Paint
    color: "#f2f2f2"
  - type: UserInterface
    interfaces:
      enum.PaintUiKey.Key:
        type: PaintBoundUserInterface
  - type: Sprite
    sprite: Objects/Fun/spraycans.rsi
    layers:
      - state: spray
        map: ["Base"]
      - state: spray_cap_colors
        map: ["enum.OpenableVisuals.Layer"]
        color: "#f2f2f2"
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          True: {state: "spray_colors", color: "#f2f2f2"}
          False: {state: "spray_cap_colors", color: "#f2f2f2"}
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 100
        reagents:
        - ReagentId: SpaceGlue
          Quantity: 100
