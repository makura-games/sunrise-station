- type: entity
  parent: [BaseClothingBeltSounds, ClothingBeltStorageBase]
  id: Pouch
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Sunrise/Clothing/Pouches/large_explosive.rsi
    layers:
    - map: [ base ]
      state: icon
  - type: Appearance
  - type: Item
    size: Large
    shape: null
  - type: Clothing
    quickEquip: false
    slots:
    - pocket

#Explosives
- type: entity
  parent: [Pouch, ContentsExplosionResistanceBase]
  id: PouchExplosive
  name: explosive pouch
  description: It can carry grenades, plastic explosives, mine boxes, and other explosives.
  components:
  - type: Sprite
    sprite: _Sunrise/Clothing/Pouches/large_explosive.rsi
    layers:
    - map: [ closed ]
      state: closed
    - map: [ open ]
      state: open
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        open:
          True: { visible: false }
          False: { visible: true }
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,5,1
    whitelist:
      tags:
      - HandGrenade
      - Grenade
      - HandGrenadeAmmo
      components:
      - ProjectileGrenade
      - FlashOnTrigger
      - ExplodeOnTrigger
  - type: ExplosionResistance
    damageCoefficient: 0.01
    worn: false

- type: entity
  parent: PouchExplosive
  id: PouchExplosiveFilled
  suffix: Filled Grenade
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: GrenadeIncendiary
          amount: 1
        - id: GrenadeShrapnel
          amount: 1
        - id: GrenadeStinger
          amount: 1
        - id: GrenadeFlashBang
          amount: 1
        - id: SmokeGrenade
          amount: 2

- type: entity
  parent: PouchExplosive
  id: PouchExplosiveGrenadeFragTimerFilled
  suffix: Filled frag-timed
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: GrenadeFragTimer
          amount: 6

- type: entity
  parent: PouchExplosive
  id: PouchExplosiveGrenadeFragContactFilled
  suffix: Filled frag-contact
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: GrenadeFrag
          amount: 6
#Ammo
- type: entity
  parent: [Pouch]
  id: PouchAmmo
  name: ammo pouch
  description: It can carry ammo boxes and magazines.
  components:
  - type: Sprite
    sprite: _Sunrise/Clothing/Pouches/medium_ammo_mag.rsi
    layers:
    - map: [ closed ]
      state: closed
    - map: [ open ]
      state: open
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        open:
          True: { visible: false }
          False: { visible: true }
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,2,1
    whitelist:
      components:
      - BallisticAmmoProvider

