- type: entity
  parent: [BaseClothingBeltSounds, ClothingBeltStorageBase]
  id: Pouch
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Pouches/large_explosive.rsi
    layers:
    - state: icon
  - type: Appearance
  - type: Item
    size: Huge
  - type: Clothing
    quickEquip: false
    slots:
    - pocket

#Explosives
- type: entity
  parent: [Pouch, ContentsExplosionResistanceBase]
  id: PouchExplosive
  name: explosive pouch
  description: It can carry grenades, plastic explosives, mine boxes, and other explosives.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Pouches/large_explosive.rsi
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,5,1
    whitelist:
      tags:
      - HandGrenade
      - Grenade
      - HandGrenadeAmmo
      components:
      - ProjectileGrenade
      - FlashOnTrigger
      - ExplodeOnTrigger
  - type: ExplosionResistance
    damageCoefficient: 0.01
    worn: false

- type: entity
  parent: PouchExplosive
  id: PouchExplosiveFilled
  suffix: Filled Grenade
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: GrenadeIncendiary
          amount: 1
        - id: GrenadeShrapnel
          amount: 1
        - id: GrenadeStinger
          amount: 1
        - id: GrenadeFlashBang
          amount: 1
        - id: SmokeGrenade
          amount: 2

#Ammo
- type: entity
  parent: [Pouch]
  id: PouchAmmo
  name: ammo pouch
  description: It can carry ammo boxes and magazines.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Pouches/large_ammo_mag.rsi
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,3,1
    whitelist:
      components:
      - BallisticAmmoProvider

- type: entity
  parent: PouchAmmo
  id: PouchAmmoFilledSMG
  suffix: Filled SMG
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: MagazinePistolSubMachineGun
          amount: 4

- type: entity
  parent: PouchAmmo
  id: PouchAmmoFilledPistol40
  suffix: Filled pistol .40
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: MagazinePistol40SP
          amount: 2
        - id: MagazinePistol40FMJ
          amount: 1
        - id: MagazinePistol40HP
          amount: 1

- type: entity
  parent: PouchAmmo
  id: PouchAmmoFilledLightRifle
  suffix: Filled, light rifle
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: MagazineLightRifleFMJ
          amount: 2
        - id: MagazineLightRifleSP
          amount: 1
        - id: MagazineLightRifleHP
          amount: 1

- type: entity
  parent: ClothingBeltStorageBase
  id: PouchCivil
  abstract: true
  components:
  - type: Sprite
    layers:
      - map: [ base ]
        state: icon
  - type: Appearance
  - type: Item
    size: Huge
  - type: Clothing
    equipSound:
      path: /Audio/Items/belt_equip.ogg
    quickEquip: false
    slots:
    - pocket
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        base:
          True: { state: icon-open }
          False: { state: icon }

- type: entity
  parent: PouchCivil
  id: PouchMedical
  name: medicine pouch
  description: It can carry different medical stuff.
  components:
  - type: Sprite
    sprite: _Sunrise/Clothing/Pouches/medicine_pouch.rsi
    state: icon
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,2,1
    whitelist:
      tags:
      - Bottle
      - Spray
      - AutoMender
      - GlassBeaker
      - ChemDispensable
      components:
      - Injector
      - FitsInDispenser
  - type: Tag
    tags:
    - PouchMedical
  - type: ExplosionResistance
    damageCoefficient: 0.2
