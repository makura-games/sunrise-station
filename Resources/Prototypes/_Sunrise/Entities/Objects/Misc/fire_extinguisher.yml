- type: entity
  name: bluespace fire extinguisher
  parent: FireExtinguisher
  id: FireExtinguisherBluespace
  description: An experimental fire extinguisher that uses bluespace technology to gradually refill itself. The faint blue glow is only slightly disconcerting.
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Misc/fire_extinguisher_bluespace.rsi
    layers:
    - state: fire_extinguisher_closed
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Item
    sprite: _Sunrise/Objects/Misc/fire_extinguisher_bluespace.rsi
  - type: Solution
    id: spray
    solution:
      maxVol: 200
      reagents:
      - ReagentId: Water
        Quantity: 200
  - type: PhysicalComposition
    materialComposition:
      Steel: 80
      Uranium: 20
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: Water
        Quantity: 10
    duration: 10
