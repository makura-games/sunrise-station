- type: entity
  parent: BaseItem
  id: GlockBox
  name: glock box
  description: It contains a pistol and a magazine for it. Did you want something else?
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Storage/glockbox.rsi
    layers:
    - state: icon
  - type: Item
    sprite: _Sunrise/Objects/Storage/glockbox.rsi
    heldPrefix: glockb
    size: Huge
    shape:
    - 0,0,2,1
    storedSprite:
      state: icon
      sprite: _Sunrise/Objects/Storage/glockbox.rsi
  - type: SpawnItemsOnUse
    items:
    - id: MagazinePistolRubber
    - id: WeaponPistolEnforcer
    sound:
      path: /Audio/Effects/unwrap.ogg

- type: entity
  parent: GlockBox
  id: MK58Box
