- type: entity
  parent: BaseBola
  id: EnergyBola
  name: energy bola
  description: An improved bola designed to restrain dangerous targets.
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Throwable/bola/bola_security.rsi
    state: icon
  - type: DamageOnLand
    damage:
      types:
        Blunt: 0
  - type: Ensnaring
    freeTime: 2.5
    breakoutTime: 4.0
    walkSpeed: 0.6
    sprintSpeed: 0.6
    staminaDamage: 10
    destroyOnRemove: true
    canThrowTrigger: true
    canMoveBreakout: true
    maxEnsnares: 1
  - type: Tag
    tags:
    - BolaSecurity
    - SecBeltEquip

- type: entity
  name: syndicate bola
  parent: [Bola, BaseSyndicateContraband]
  id: BolaSyndicate
  description: Linked together with some spare cuffs and metal.
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Throwable/bola/bola_syndicate.rsi
    state: icon
  - type: Ensnaring
    freeTime: 2.5
    breakoutTime: 5.5
    walkSpeed: 0.60
    sprintSpeed: 0.60
    staminaDamage: 30
  - type: Tag
    tags:
    - BolaSecurity
    - SecBeltEquip

- type: entity
  parent: BolaSyndicate
  id: BolaSyndicateDespawn
  components:
  - type: TimedDespawn
    lifetime: 60
