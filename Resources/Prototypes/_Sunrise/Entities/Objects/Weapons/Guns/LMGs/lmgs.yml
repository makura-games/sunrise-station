- type: entity
  name: L6 MAX
  id: WeaponLightMachineGunL6Max
  parent: WeaponLightMachineGunL6
  description: Developed by Waffle Corporation, the L6 MAX is a heavily reinforced modification of the L6 machine gun that has gained popularity among the elite of the Gorlex Marauders. Its reinforced barrel and powerful .308 caliber allow it not only to suppress enemies with a hail of fire, but also to tear their cover to splinters. Feeds from .308 ammunition belts.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/LMGs/l6.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-3
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: true
  - type: Appearance
  - type: StaticPrice
    price: 10000
  - type: Item
    sprite: _Starlight/Objects/Weapons/Guns/LMGs/l6.rsi
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Guns/LMGs/l6.rsi
    quickEquip: false
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/m41_cock.ogg
    soundBoltClosed:
      path: /Audio/Weapons/Guns/Bolt/lmg_bolt_closed.ogg
    soundBoltOpened:
      path: /Audio/Weapons/Guns/Cock/shotgun_open.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: RifleHeavyMagazineSP
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineMachineGunMG42
          - MagazineMachineGunHeavyRifle
      gun_chamber:
        name: Chamber
        startingItem: CartridgeRifleHeavySP
        priority: 1
        whitelist:
          tags:
            - CartridgeHeavyRifle
  - type: SpeedModifiedOnWield
    walkModifier: 0.85
    sprintModifier: 0.85
  - type: GunRequiresWield
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 0.90
  - type: HeldSpeedModifier
  - type: GunWieldBonus
    minAngle: -23
    maxAngle: -22
  - type: Gun
    minAngle: 24
    maxAngle: 35
    angleIncrease: 4
    angleDecay: 18
    fireRate: 6
    soundGunshot:
      collection: m249 # Sunrise-Edit
      params:
        volume: 10
        pitch: 1.1
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 2
    pvsIncrease: 0.2
  - type: KnockbackByUserTag
    doestContain:
      Resomi:
        knockback: 2
        staminaMultiplier: 15
      Felinid:
        knockback: 1 #half of what resomi take
        staminaMultiplier: 15
