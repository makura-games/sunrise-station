- type: entity
  name: Kammerer Trench
  parent: [BaseWeaponShotgunPump, GunMedium, BaseSecurityContraband]
  id: WeaponShotgunTrenchgun4034
  description: An improved variant of the Kammerer, featuring an ergonomic pump fore-end for faster cycling, a ventilated barrel shroud for improved heat dissipation, and an integrated bayonet for close-quarters combat. Uses .50 shotgun shells.
  components:
  - type: Sprite
    scale: 0.9, 0.9
    sprite: _Sunrise/Objects/Weapons/Guns/Shotguns/trenchgun_l_4034/big.rsi
  - type: Item
    size: Large
    shape:
    - 0,0,5,0
    sprite: _Sunrise/Objects/Weapons/Guns/Shotguns/trenchgun_l_4034/trench_inhands_64x.rsi
  - type: Clothing
    sprite: _Sunrise/Objects/Weapons/Guns/Shotguns/trenchgun_l_4034/tiny.rsi
  - type: Tag
    tags:
    - WeaponShotgunKammerer
  - type: Wieldable
  - type: GunRequiresWield
  - type: Gun
    spread: 22
    pump: true
    fireRate: 2.75
    projectileSpeed: 35
  - type: GunSpreadModifier
    spread: 1.2
  - type: MeleeWeapon # TODO: Add ability to add reagents
    range: 2.2
    wideAnimationRotation: -90
    damage:
      types:
        Piercing: 12
        Bloodloss: 1
    angle: 0
    animation: WeaponArcThrust
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Construction
    graph: KammererUpgrade
    node: trench
    deconstructionTarget: null

