- type: entity
  name: Kammerer Sawn-off
  parent: [BaseWeaponShotgunPump, BaseSecurityContraband]
  id: WeaponShotgunTrenchgun4034Sawn
  description: A shortened variant of the Kammerer, designed for easier handling in confined spaces. Features an integrated shell holder for carrying additional ammunition. Uses .50 shotgun shells.
  components:
  - type: Sprite
    scale: 0.9, 0.9
    sprite: _Sunrise/Objects/Weapons/Guns/Shotguns/pump_sawn.rsi
    layers:
    - state: icon
    - map: ["enum.StorageFillLayers.Fill"]
      visible: false
  - type: ContainerInteractionAnimationVisuals
  - type: Storage
    grid:
    - 0,0,4,0
    maxItemSize: Tiny
    clickInsert: false
    whitelist:
      tags:
      - ShellShotgun
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
      storagebase: !type:Container
        ents: []
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: ShellShotgun
        amount: 5
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.StorageUsed:
        enum.StorageFillLayers.Fill:
          "0":
            visible: false
          "1":
            state: fill-1
            visible: true
          "2":
            state: fill-2
            visible: true
          "3":
            state: fill-3
            visible: true
          "4":
            state: fill-4
            visible: true
          "5":
            state: fill-5
            visible: true
  - type: Item
    size: Normal
    shape:
    - 0,0,3,0
    sprite: _Sunrise/Objects/Weapons/Guns/Shotguns/pump_sawn_inhands_64x.rsi
  - type: Clothing
    sprite: _Sunrise/Objects/Weapons/Guns/Shotguns/pump_sawn.rsi
  - type: Gun
    pump: true
    fireRate: 1.95
    projectileSpeed: 35
    useKey: true
    selectedMode: SemiAuto
  - type: GunSpreadModifier
    spread: 1.2
  - type: MeleeWeapon
    angle: 60
    range: 1
    damage:
      types:
        Blunt: 8
    bluntStaminaDamageFactor: 2.0
    attackRate: 1
    autoAttack: false
  - type: AltFireMelee
    attackType: Light
  - type: BallisticAmmoProvider
    capacity: 5
  - type: UseDelay
    delay: 0.1
  - type: SpeedModifiedOnWield
    walkModifier: 0.95
    sprintModifier: 0.95
  - type: Construction
    graph: KammererUpgrade
    node: sawn
    deconstructionTarget: null

- type: entity
  name: Kammerer Sawn-off
  parent: WeaponShotgunTrenchgun4034Sawn
