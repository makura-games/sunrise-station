- type: entity
  name: BaseWeaponShotgun
  parent: [BaseItem, GunMedium, BaseGunShotgunSound] # Sunrise edit - shotgun handling sounds
  id: BaseWeaponShotgunAny
  description: A rooty tooty point and shooty.
  abstract: true
  components:
  - type: Sprite
    layers:
    - state: icon
      map: [ "enum.GunVisualLayers.Base" ]
  - type: Item
    size: Large
    shape:
    - 0,0,4,0
  - type: Clothing
    sprite: Objects/Weapons/Guns/Shotguns/db_shotgun.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: Gun
    fireRate: 2
    projectileSpeed: 30 # Sunrise-Edit
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      collection: xm1014 # Sunrise-Edit
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
  - type: StaticPrice
    price: 500
  - type: CustomSpriteAmmoCounter
    loadedAmmoSprite: Interface/ItemStatus/Shotgun_Shells/not_spent.png
    spentAmmoSprite: Interface/ItemStatus/Shotgun_Shells/spent.png
  - type: RestrictByUserTag
    doestContain:
    - Abductor
    messages:
    - abductor-gun-restricted-1
  - type: KnockbackByUserTag
    doestContain:
      Resomi:
        knockback: 3
        staminaMultiplier: 20
      Felinid:
        knockback: 1.5 #half of what resomi take
        staminaMultiplier: 20

- type: entity
  parent: [BaseWeaponShotgunAny, GunLight]
  id: BaseWeaponShotgunPump
  abstract: true
  components:
  - type: Gun
    fireRate: 1.5
    projectileSpeed: 37 # Sunrise-Edit
    pump: true
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - ShellShotgun
    capacity: 7
    proto: ShellShotgun
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/shotgun_insert.ogg
    soundRack:
      collection: SunriseShotgunPump

