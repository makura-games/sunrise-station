# Sidearm for detectives.
- type: entity
  parent: BaseWeaponRevolver
  id: WeaponRevolverSpearhead
  name: Spearhead autorevolver
  description: A bulky revolver, occasionally carried by assault troops and officers in SWAT, as well as civilian law enforcement. Fires .45 Magnum rounds. #Fires .357 Magnum rounds.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Pistols/spearhead.rsi
    layers:
    - state: icon
      map: [ "enum.GunVisualLayers.Base" ]
  - type: RandomSprite
    available:
    - enum.GunVisualLayers.Base:
        icon: ""
        icon_black: ""
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Pistols/spearhead.rsi
  - type: Item
    size: Normal
    shape:
    - 0,0,1,0
    - 0,1,0,1
  - type: Wieldable
    unwieldOnUse: false
  - type: GunWieldBonus
    minAngle: -2.7
    maxAngle: -10
  - type: Gun
    selectedMode: FullAuto
    minAngle: 5
    maxAngle: 18
    angleIncrease: 5
    angleDecay: 2.75
    fireRate: 2.5
    availableModes:
    - FullAuto
    useKey: true
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_cmb_1.ogg
    soundEmpty:
      path: /Audio/_RMC14/Weapons/Guns/gun_cmb_click1.ogg
  - type: SpeedModifiedOnWield
    walkModifier: 0.97
    sprintModifier: 0.97
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 2.5
    pvsIncrease: 0.25
  - type: StealTarget
    stealGroup: OfficerHandgun

