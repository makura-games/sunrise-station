- type: entity
  id: BaseWeaponAutoPowerCell
  parent: BaseItem
  abstract: true
  components:
  - type: Clothing
    sprite: Objects/Weapons/Guns/Battery/laser_retro.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Sprite
  - type: Item
    size: Huge
  - type: AmmoCounter
  - type: Gun
    fireRate: 4
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_Sunrise/Weapons/Guns/Lasers/EG_R.ogg
  - type: BatteryAmmoProvider
    proto: RedLightLaser
    fireCost: 60
  - type: ItemSlots
    slots:
      cell_slot:
        name: Magazine
        startingItem: PowerCellHigh
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          tags:
            - PowerCell
            - PowerCellHigh
            - PowerCellSmall
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: Appearance
  - type: StaticPrice
    price: 500
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: EmitSoundOnPickup
    sound:
      collection: LasersPickUp
  - type: EmitSoundOnDrop
    sound:
      collection: LasersDrop
  - type: EmitSoundOnLand
    sound:
      collection: LasersDrop

- type: entity
  name: LNT620 "Spark"
  parent: [ BaseWeaponAutoPowerCell, BaseSecurityContraband ]
  id: WeaponLaserLNT620
  description: Automatic Laser NanoTrasen LNT620.
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Guns/Battery/smg_laser.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Gun
    fireRate: 5
    minAngle: 1
    maxAngle: 18
    angleIncrease: 0.6
    angleDecay: 10
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    bigTrigger: true
  - type: Clothing
    sprite: _Sunrise/Objects/Weapons/Guns/Battery/smg_laser.rsi
  - type: Item
    size: Large
    shape:
    - 0,0,2,1
    sprite: _Sunrise/Objects/Weapons/Guns/Battery/smg_laser.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: CanDualWield
    dualWieldInaccuracyPenalty: 0.9
    dualWieldFireRatePenalty: 0.35
    dualWieldRecoilPenalty: 0.9

- type: entity
  parent: WeaponLaserLNT620
  id: SunriseWeaponLaserLNT620Empty
  categories: [ HideSpawnMenu ]
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: Magazine
        startingItem: null
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          tags:
          - PowerCell
          - PowerCellHigh
          - PowerCellSmall

- type: entity
  name: battery-powered laser carbine
  parent: [ BaseWeaponPowerCell, BaseGunWieldable, BaseSecurityContraband ]
  id: SunriseWeaponLaserCarbineBattery
  description: A battery-powered version of the standard NanoTrasen Security laser carbine.
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Guns/Battery/batterylaser_carbine.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-unshaded-4
      map: [ "enum.GunVisualLayers.MagUnshaded" ]
      shader: unshaded
  - type: Item
    size: Large
    shape:
    - 0,0,2,1
    sprite: _Sunrise/Objects/Weapons/Guns/Battery/batterylaser_carbine.rsi
  - type: Clothing
    sprite: _Sunrise/Objects/Weapons/Guns/Battery/batterylaser_carbine.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Gun
    fireRate: 3
  - type: BatteryAmmoProvider
    proto: RedLaser
    fireCost: 50
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: StaticPrice
    price: 420
  - type: Tag
    tags:
    - LaserWeapon

- type: entity
  name: miniature energy gun
  parent: [ BaseWeaponBatterySmall, BaseSecurityContraband ]
  id: WeaponMiniEnergyGun
  description: An energy gun capable of switching between lethal and debilitating lasers. Its built-in two-charge contact flash can blind an opponent.
  components:
  - type: Item
    storedOffset: 0,-5
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Battery/mini.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: base-overlay
      shader: unshaded
      visible: false
      map: [ "light" ]
    - state: mag-unshaded-0
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: BatteryAmmoProvider
    proto: BulletDisabler
    fireCost: 100
  - type: BatteryWeaponFireModes
    fireModes:
    - proto: BulletDisabler
      fireCost: 100
      pacifismAllowedMode: true
    - proto: BulletLaserWindowPiercingMagnum
      fireCost: 175
      conditions:
      - !type:AlertLevelCondition
        alertLevels:
        - Blue
        - Violet
        - Yellow
        - Red
        - Gamma
        - DeltaNuke
        - Epsilon
  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: true
  - type: StealTarget
    stealGroup: OfficerHandgun
  - type: Flash
    flashOnUse: false
  - type: LimitedCharges
    maxCharges: 2
  - type: AutoRecharge
    rechargeDuration: 60
  - type: MeleeWeapon
    wideAnimationRotation: 0
    angle: 10
    damage:
      types:
        Blunt: 0
  - type: AltFireMelee
    attackType: Light
  - type: UseDelay
    delay: 1
  - type: UseDelayOnMeleeHit
  - type: Appearance

- type: entity
  name: Judge energy pistol
  parent: BaseWeaponBatterySmall
  id: WeaponEnergyGunPistol
  description: A military grade sidearm, used by many militia forces throughout the local sector.
  components:
  - type: Item
    size: Small
    heldPrefix: disabler
    shape:
    - 0,0,1,1
    storedOffset: 0,-5
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Guns/Battery/pdw9_pistol.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: disable
      map: ["enum.FireModesLayers.FireMode"]
      shader: unshaded
    - state: mag-unshaded-6
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: _Sunrise/Objects/Weapons/Guns/Battery/pdw9_pistol.rsi
  - type: Gun
    bigTrigger: true
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: BatteryAmmoProvider
    proto: BulletDisabler
    fireCost: 75
  - type: BatteryWeaponFireModes
    fireModes:
    - proto: BulletDisabler
      fireCost: 75
      name: energy-gun-disable
      visualState: disable
      heldPrefix: disabler
      pacifismAllowedMode: true
    - proto: BulletTaser
      fireCost: 150
      #magState: taser
      visualState: taser
      heldPrefix: taser
      pacifismAllowedMode: true
    - proto: BulletLaserWindowPiercingMagnum
      fireCost: 100
      #magState: lethal
      visualState: lethal
      heldPrefix: lethal
  - type: Appearance
  - type: Battery
    maxCharge: 1500
    startingCharge: 1500
  - type: MagazineVisuals
    magState: mag
    steps: 7
    zeroVisible: true
  - type: Tag
    tags:
    - Sidearm
  - type: StaticPrice
    price: 750

