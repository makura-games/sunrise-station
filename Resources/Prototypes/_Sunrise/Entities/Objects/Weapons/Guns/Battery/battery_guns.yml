- type: entity
  id: BaseWeaponAutoPowerCell
  parent: BaseItem
  abstract: true
  components:
  - type: Clothing
    sprite: Objects/Weapons/Guns/Battery/laser_retro.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Sprite
  - type: Item
    size: Huge
  - type: AmmoCounter
  - type: Gun
    fireRate: 4
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_Sunrise/Weapons/Guns/Lasers/EG_R.ogg
  - type: BatteryAmmoProvider
    proto: RedLightLaser
    fireCost: 50
  - type: ItemSlots
    slots:
      cell_slot:
        name: Magazine
        startingItem: PowerCellHigh
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          tags:
            - PowerCell
            - PowerCellHigh
            - PowerCellSmall
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: Appearance
  - type: StaticPrice
    price: 500
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: EmitSoundOnPickup
    sound:
      collection: LasersPickUp
  - type: EmitSoundOnDrop
    sound:
      collection: LasersDrop
  - type: EmitSoundOnLand
    sound:
      collection: LasersDrop

- type: entity
  name: LNT620 "Spark"
  parent: [ BaseWeaponAutoPowerCell, BaseSecurityContraband ]
  id: WeaponLaserLNT620
  description: Automatic Laser NanoTrasen LNT620.
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Guns/Battery/smg_laser.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Gun
    fireRate: 6
    minAngle: 1
    maxAngle: 15
    angleIncrease: 0.75
    angleDecay: 10
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    bigTrigger: true # Sunrise-Edit
  - type: Clothing
    sprite: _Sunrise/Objects/Weapons/Guns/Battery/smg_laser.rsi
  - type: Item
    size: Large
    shape:
    - 0,0,2,1
    sprite: _Sunrise/Objects/Weapons/Guns/Battery/smg_laser.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: CanDualWield
    dualWieldInaccuracyPenalty: 0.9
    dualWieldFireRatePenalty: 0.35
    dualWieldRecoilPenalty: 0.9

- type: entity
  parent: WeaponLaserLNT620
  id: SunriseWeaponLaserLNT620Empty
  categories: [ HideSpawnMenu ]
  components:
  - type: ItemSlots
    slots:
