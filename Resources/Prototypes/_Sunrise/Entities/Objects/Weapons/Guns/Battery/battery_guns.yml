- type: entity
  name: miniature energy gun
  parent: [ BaseWeaponBatterySmall, BaseSecurityContraband ]
  id: WeaponMiniEnergyGun
  description: An energy gun capable of switching between lethal and debilitating lasers. Its built-in two-charge contact flash can blind an opponent.
  components:
  - type: Item
    storedOffset: 0,-5
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Battery/mini.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: base-overlay
      shader: unshaded
      visible: false
      map: [ "light" ]
    - state: mag-unshaded-0
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: BatteryAmmoProvider
    proto: BulletDisabler
    fireCost: 100
  - type: BatteryWeaponFireModes
    fireModes:
    - proto: BulletDisabler
      fireCost: 100
      pacifismAllowedMode: true
    - proto: BulletLaserWindowPiercingMagnum
      fireCost: 175
      conditions:
      - !type:AlertLevelCondition
        alertLevels:
        - blue
        - violet
        - yellow
        - red
        - gamma
        - delta
        - epsilon
  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: true
  - type: StealTarget
    stealGroup: OfficerHandgun
  - type: Flash
    flashOnUse: false
  - type: LimitedCharges
    maxCharges: 2
  - type: AutoRecharge
    rechargeDuration: 60
  - type: MeleeWeapon
    wideAnimationRotation: 0
    angle: 10
    damage:
      types:
        Blunt: 0
  - type: AltFireMelee
    attackType: Light
  - type: UseDelay
    delay: 1
  - type: UseDelayOnMeleeHit
  - type: Appearance

- type: entity
  name: Judge energy pistol
  parent: BaseWeaponBatterySmall
  id: WeaponEnergyGunPistol
  description: A military grade sidearm, used by many militia forces throughout the local sector.
  components:
  - type: Item
    size: Small
    heldPrefix: disabler
    shape:
    - 0,0,1,1
    storedOffset: 0,-5
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Guns/Battery/pdw9_pistol.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: disable
      map: ["enum.FireModesLayers.FireMode"]
      shader: unshaded
    - state: mag-unshaded-6
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: _Sunrise/Objects/Weapons/Guns/Battery/pdw9_pistol.rsi
  - type: Gun
    bigTrigger: true
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: BatteryAmmoProvider
    proto: BulletDisabler
    fireCost: 75
  - type: BatteryWeaponFireModes
    fireModes:
    - proto: BulletDisabler
      fireCost: 75
      name: energy-gun-disable
      visualState: disable
      heldPrefix: disabler
      pacifismAllowedMode: true
    - proto: BulletTaser
      fireCost: 150
      #magState: taser
      visualState: taser
      heldPrefix: taser
      pacifismAllowedMode: true
    - proto: BulletLaserWindowPiercingMagnum
      fireCost: 100
      #magState: lethal
      visualState: lethal
      heldPrefix: lethal
  - type: Appearance
  - type: Battery
    maxCharge: 1500
    startingCharge: 1500
  - type: MagazineVisuals
    magState: mag
    steps: 7
    zeroVisible: true
  - type: Tag
    tags:
    - Sidearm
  - type: StaticPrice
    price: 750

