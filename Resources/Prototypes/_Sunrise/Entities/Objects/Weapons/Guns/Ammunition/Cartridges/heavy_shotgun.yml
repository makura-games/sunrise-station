- type: entity
  id: ShellShotgunHeavy
  parent: [BaseShellShotgun, BaseSecurityContraband]
  name: heavy shotgun shell (buckshot)
  components:
  - type: Tag
    tags:
    - ShellShotgunHeavy
  - type: Sprite
    scale: 1,1
    sprite: _Sunrise/Objects/Weapons/Guns/Ammunition/Casings/heavy_shotgun_shell.rsi
    layers: !Clear
    - !Index:0
      state: base
      map: ["enum.AmmoVisualLayers.Base"]
    - !Index:0
      state: tip
      map: ["enum.AmmoVisualLayers.Tip"]
      color: "#F4001F"
  - type: CartridgeAmmo
    proto: PelletGrapeshotHeavySpread

