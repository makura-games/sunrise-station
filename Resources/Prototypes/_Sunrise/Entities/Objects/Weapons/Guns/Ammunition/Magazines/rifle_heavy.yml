- type: entity
  id: BaseMagazineRifleHeavy
  name: "magazine (.308)"
  parent: [ BaseItem, BaseSecurityContraband ]
  abstract: true
  components:
  - type: Tag
    tags:
      - MagazineHeavyRifle
  - type: Item
    size: Small
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - CartridgeHeavyRifle
    capacity: 20
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Guns/Ammunition/Magazines/rifle_heavy_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

- type: entity
  id: MagazineGarand
  name: "M1 Garand clip (.308 FMJ)"
  description: An eight-round en-bloc clip for the M1 Garand, loaded with .308 FMJ cartridges.
  parent: BaseItem
  components:
  - type: PhysicalComposition
    materialComposition:
      Steel: 30
  - type: Tag
    tags:
    - MagazineGarand
  - type: Item
    size: Small
  - type: BallisticAmmoProvider
    mayTransfer: true
    cycleable: true
    fillDelay: 0.1
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
    whitelist:
      tags:
      - CartridgeHeavyRifle
    capacity: 8
    proto: CartridgeRifleHeavyFMJ
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/SpeedLoaders/LightRifle/light_rifle_speed_loader.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-5
      map: ["enum.GunVisualLayers.Mag"]
      color: "#49392D"
  - type: MagazineVisuals
    magState: mag
    steps: 6
    zeroVisible: false
  - type: Appearance
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []

- type: entity
  id: MagazineRifleHeavyEmpty
  name: "magazine (.308 any)"
  suffix: empty
  parent: BaseMagazineRifleHeavy
  components:
  - type: BallisticAmmoProvider
    proto: null
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag

- type: entity
  id: MagazineRifleHeavySP
  name: "magazine (.308 SP)"
  parent: BaseMagazineRifleHeavy
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeRifleHeavySP
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: stripe
      color: "#575EF5"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      - state: inhand-left-stripe
        color: "#575EF5"
      right:
      - state: inhand-right-mag
      - state: inhand-right-stripe
        color: "#575EF5"

