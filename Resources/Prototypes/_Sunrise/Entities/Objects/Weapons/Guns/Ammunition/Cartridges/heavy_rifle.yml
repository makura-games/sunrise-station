# region base cartridges

- type: entity
  id: BaseCartridgeRifleHeavy
  name: cartridge (.308)
  parent: [ BaseCartridge, BaseSecurityContraband ]
  abstract: true
  components:
  - type: Tag
    tags:
      - CartridgeHeavyRifle
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Guns/Ammunition/Casings/7.62x51.rsi
    scale: 0.60, 0.60
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: StaticPrice
    price: 2
  - type: PhysicalComposition
    materialComposition:
      Steel: 10

