# region speedloaders
- type: entity
  id: BaseSpeedLoaderHeavyRifleR
  parent: [ BaseItem, BaseMinorContraband ]
  abstract: true
  components:
  - type: Tag
    tags:
      - SpeedLoaderRifle
  - type: SpeedLoader
  - type: BallisticAmmoProvider
    mayTransfer: true
    fillDelay: 0.1
    whitelist:
      tags:
        - CartridgeHeavyRifleR
    capacity: 5
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Guns/Ammunition/SpeedLoaders/heavy_rifle_speed_loader.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-5
      map: ["enum.GunVisualLayers.Mag"]
    - state: mag-tip-5
      map: [ "enum.GunVisualLayers.Tip" ]
      color: "#C7B458"
  - type: MagazineVisuals
    magState: mag
    steps: 6
    zeroVisible: false
  - type: Appearance
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      - state: inhand-left-stripe
        color: "#C7B458"
      right:
      - state: inhand-right
      - state: inhand-right-stripe
        color: "#C7B458"

- type: entity
  id: SpeedLoaderHeavyRifleRFMJ
  name: "speed loader (7.62mmR FMJ)"
  parent: BaseSpeedLoaderHeavyRifleR
  components:
  - type: SpeedLoader
  - type: BallisticAmmoProvider
    proto: CartridgeHeavyRifleRFMJ

- type: entity
