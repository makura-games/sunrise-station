- type: entity
  id: ShellShotgunCoin
  name: improvised shell (coin slug)
  description: A homemade shotgun slug that shoots a cylinder of coins. The stack has a tendency to break apart in the blast, limiting its effective range.
  parent: [BaseShellShotgun, BaseMinorContraband ]
  components:
  - type: Tag
    tags:
    - Cartridge
    - ShellShotgun
    - ShotgunSlug
    - ShellShotgunLight
  - type: Sprite
    layers:
      - state: coinshot
        map: [ "enum.AmmoVisualLayers.Base" ]
  - type: Construction
    graph: CoinShotgunShellGraph
    node: shell
  - type: CartridgeAmmo
    soundEject:
      collection: ShellEject
    proto: PelletShotgunCoinSpread
  - type: SpentAmmoVisuals
    state: "coinshot"
    revealSpent: false
    tip: false

- type: entity
  id: ShellShotgunBooze
  name: shell (.50 beanbag)
  parent: [ BaseShellShotgun, BaseSecurityBartenderContraband ]
  components:
  - type: Tag
    tags:
    - Cartridge
    - ShellShotgun
    - ShellShotgunLight
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#149A1E"
  - type: CartridgeAmmo
    proto: PelletShotgunBooze
  - type: ChemicalAmmo
  - type: Solution
    id: ammo
    solution:
      reagents:
      - ReagentId: Nocturine
        Quantity: 15
      - ReagentId: BacchusBlessing
        Quantity: 8
      - ReagentId: THC
        Quantity: 10
      - ReagentId: MuteToxin
        Quantity: 2
  - type: SolutionTransfer
    maxTransferAmount: 35

- type: entity
  id: ShellShotgunHoly
  name: shell (.50 holy)
  parent: [ BaseShellShotgun, BaseSecurityContraband]
  components:
  - type: Sprite
    layers:
      - state: slug
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip-long
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#e4e4e4"
      - state: holy
  - type: CartridgeAmmo
    proto: PelletShotgunHoly
  - type: ChemicalAmmo
  - type: Solution
    id: ammo
    solution:
      reagents:
      - ReagentId: Holywater
        Quantity: 4
  - type: SolutionTransfer
    maxTransferAmount: 4
  - type: Tag
    tags:
    - Cartridge
    - ShellShotgun
    - ShellShotgunLight

