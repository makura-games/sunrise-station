# Снаряды из wiz-station-14 для сравнения баланса в игре.

- type: entity
  id: SunriseVanillaBulletAntiMateriel
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 75
        Structural: 100
    penetrationThreshold: 601
    penetrationDamageTypeRequirement:
    - Structural
  - type: StaminaDamageOnCollide
    damage: 60

- type: entity
  id: SunriseVanillaPelletShotgun
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 10
        Structural: 8

- type: entity
  id: SunriseVanillaPelletShotgunSpread
  parent: SunriseVanillaPelletShotgun
  categories: [ HideSpawnMenu ]
  components:
  - type: ProjectileSpread
    proto: SunriseVanillaPelletShotgun
    count: 6
    spread: 15

- type: entity
  id: SunriseVanillaPelletShotgunSlug
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    state: slug
  - type: Projectile
    damage:
      types:
        Piercing: 45
        Structural: 30

- type: entity
  id: SunriseVanillaPelletShotgunBeanbag
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
    - state: bullet
  - type: Projectile
    damage:
      types:
        Blunt: 10
  - type: StaminaDamageOnCollide
    damage: 40

