
- type: entity
  parent: [BaseGrenade, BaseSecurityContraband]
  id: GrenadeEMPlauncher
  name: EMP grenade
  description: An electromagnetic pulse grenade round for the Peacekeeper.
  components:
  - type: CartridgeAmmo
    proto: BulletGrenadePeacekeeperEMP
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Guns/Ammunition/Explosives/peacekeeper.rsi
    layers:
    - state: emp
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: spent
    suffix: false
  - type: Tag
    tags:
    - GrenadeLessLethal

- type: entity
  parent: BulletGrenadeEMP
  id: BulletGrenadePeacekeeperEMP
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Guns/Ammunition/Explosives/peacekeeper.rsi
    layers:
    - state: armedemp

- type: entity
  id: GrenadeFlarelauncher
  name: flare grenade round
  description: A grenade round that scatters illuminating pellets on impact.
  parent: [BaseGrenade, BaseSecurityContraband]
  components:
  - type: CartridgeAmmo
    proto: BulletGrenadePeacekeeperFlare
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Guns/Ammunition/Explosives/peacekeeper.rsi
    layers:
    - state: flash
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: blast
    suffix: false
  - type: Tag
    tags:
    - GrenadeLessLethal

- type: entity
  id: BulletGrenadePeacekeeperFlare
  name: flare grenade
  parent: BaseBulletTrigger
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
    - state: grenade
  - type: ContainerContainer
    containers:
      cluster-payload: !type:Container
  - type: ProjectileGrenade
    triggerKey: trigger
    fillPrototype: PelletShotgunFlare
    capacity: 6
  - type: DeleteOnTrigger

