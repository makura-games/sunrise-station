- type: entity
  parent: BaseBullet
  id: PelletClusterLesserRubber
  categories: [ HideSpawnMenu ]
  name: pellet (ball, rubber)
  components:
  - type: Projectile
    deleteOnCollide: false
    damage:
      types:
       Piercing: 0
       Blunt: 1
  - type: StaminaDamageOnCollide
    damage: 20
  - type: TimedDespawn
    lifetime: 0.25

- type: entity
  id: Grenade20mmStinger
  parent: ProjectileGrenadeBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Guns/Ammunition/Explosives/peacekeeper.rsi
    layers:
    - state: armedstinger
  - type: GenericVisualizer
    visuals: {}
  - type: TriggerOnSpawn
  - type: TimerTrigger
    beepSound:
      path: /Audio/Effects/beep1.ogg
      params:
        volume: 5
    initialBeepDelay: 0
    beepInterval: 0.5
    delay: 1.5

  - type: ProjectileGrenade
    triggerKey: timer
    fillPrototype: PelletClusterLesserRubber
    capacity: 30
  - type: EmitSoundOnTrigger
    keysIn:
    - timer
    sound:
      path: /Audio/Effects/flash_bang.ogg
  - type: DeleteOnTrigger
    keysIn:
    - timer

- type: entity
  id: Grenade20mmGas
  parent: ProjectileGrenadeBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Guns/Ammunition/Explosives/peacekeeper.rsi
    layers:
    - state: armedgas
  - type: GenericVisualizer
    visuals: {}
  - type: TriggerOnSpawn
  - type: TimerTrigger
    delay: 1.5
  - type: SmokeOnTrigger
    keysIn:
    - timer
    duration: 10
    spreadAmount: 15
    smokePrototype: TearGasSmokeWhite
    solution:
      reagents:
      - ReagentId: TearGas
        Quantity: 20
  - type: DeleteOnTrigger
    keysIn:
    - timer
