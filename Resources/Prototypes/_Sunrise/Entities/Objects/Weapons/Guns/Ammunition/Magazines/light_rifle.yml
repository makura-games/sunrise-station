# region Light Rifle
- type: entity
  id: MagazineLightRifleSP
  name: "magazine (.30 rifle SP)"
  parent: BaseMagazineLightRifle
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeLightRifleSP
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: stripe
      color: "#575EF5"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      - state: inhand-left-stripe
        color: "#575EF5"
      right:
      - state: inhand-right-mag
      - state: inhand-right-stripe
        color: "#575EF5"

- type: entity
  id: MagazineLightRifleFMJ
  name: "magazine (.30 rifle FMJ)"
  parent: BaseMagazineLightRifle
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeLightRifleFMJ

- type: entity
  id: MagazineLightRifleAP
  name: "magazine (.30 rifle AP)"
  parent: BaseMagazineLightRifle
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeLightRifleAP
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: stripe
      color: "#540000"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      - state: inhand-left-stripe
        color: "#540000"
      right:
      - state: inhand-right-mag
      - state: inhand-right-stripe
        color: "#540000"

- type: entity
  id: MagazineLightRifleImprovised
  name: "magazine (.30 rifle improvised)"
  parent: BaseMagazineLightRifle
  description: Curved 20-round double stack magazine for combat rifles. Intended to hold improvised ammunition.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeLightRifleImprovised
    capacity: 20
  - type: Sprite
    scale: 1, 0.8
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: stripe
      color: "#000000a3"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      - state: inhand-left-stripe
        color: "#000000a3"
      right:
      - state: inhand-right-mag
      - state: inhand-right-stripe
        color: "#000000a3"
  - type: Tag
    tags:
    - MagazineLightRifleImprovised

- type: entity
  id: MagazineLightRifleImprovisedEmpty
  parent: MagazineLightRifleImprovised
  suffix: Empty
  components:
  - type: BallisticAmmoProvider
    proto: null
  - type: Construction
    graph: ImprovisedMagazineLightRifleGraph
    node: shell

# region Heavy LMG
- type: entity
  id: MagazineMachineGunMG42
  name: MG42 magazine
  parent: BaseItem
  components:
  - type: Tag
    tags:
    - MagazineMachineGunMG42
  - type: BallisticAmmoProvider
    mayTransfer: true
    proto: CartridgeRifleHeavySP
    whitelist:
      tags:
      - CartridgeHeavyRifle
    capacity: 50
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Guns/Ammunition/Magazines/mg42.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance
- type: entity
  id: MagazineLightMachineGunMG60
  name: MG60 magazine
  parent: BaseNonCycleableAmmoItem
  components:
  - type: Tag
    tags:
    - MagazineLightMachineGunMG60
  - type: BallisticAmmoProvider
    mayTransfer: true
    proto: CartridgeHeavyRifleRSP  # 762x54
    whitelist:
      tags:
      - CartridgeHeavyRifleR  # 762x54
    capacity: 100
  - type: Item
    size: Normal
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Guns/Ammunition/Magazines/mg60.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

# region Other
