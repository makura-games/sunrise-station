- type: entity
  name: P-90
  parent: BaseWeaponSubMachineGun
  id: WeaponSubMachineGunP90
  components:
  - type: Item
    size: Large
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Guns/SMGs/p90.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: GunWieldBonus
    minAngle: -19
    maxAngle: -16
  - type: Gun
    minAngle: 21
    maxAngle: 32
    fireRate: 9
    soundGunshot:
      path: /Audio/_Sunrise/Weapons/Guns/SMGs/p90_shot.ogg
      params:
        volume: -1
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineP90
        insertSound: /Audio/_Sunrise/Weapons/Guns/SMGs/p90_reload.ogg
        ejectSound: /Audio/_Sunrise/Weapons/Guns/SMGs/p90_unload.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineP90
      gun_chamber:
        name: Chamber
        startingItem: CartridgePistolSP
        priority: 1
        whitelist:
          tags:
          - CartridgePistol
  - type: MagazineVisuals
    magState: mag
    steps: 6
    zeroVisible: true
  - type: Appearance
  - type: Wieldable
    unwieldOnUse: false
  - type: UseDelay
    delay: 0.5
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/_Sunrise/Weapons/Guns/SMGs/p90_cocked.ogg

