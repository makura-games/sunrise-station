- type: entity
  name: Drozd Mk2
  parent: [WeaponSubMachineGunDrozd]
  id: WeaponSubMachineGunDrozdMk2
  description: An improved variant of the Drozd submachine gun developed by NanoTrasen’s Small Arms Division. It features an exceptional rate of fire in burst mode, making it effective for holding defensive positions or engaging targets at medium to long ranges. Equipped with an automatic magazine release for faster reloads. Uses .35 SMG magazines.
  components:
    - type: Sprite
      sprite: _Sunrise/Objects/Weapons/Guns/SMGs/drozd.rsi
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-0
          map: ["enum.GunVisualLayers.Mag"]
    - type: Clothing
      sprite: _Sunrise/Objects/Weapons/Guns/SMGs/drozd.rsi
    - type: Wieldable
      unwieldOnUse: false
    - type: GunWieldBonus
      minAngle: -19
      maxAngle: -20
    - type: Gun
      minAngle: 21
      maxAngle: 32
      fireRate: 6
      burstFireRate: 20
      soundGunshot:
        collection: famas # Sunrise-Edit
        params:
          volume: 10
      selectedMode: Burst
      availableModes:
      - Burst
      - FullAuto
      shotsPerBurst: 3
      burstCooldown: 0.325
    - type: MagazineVisuals
      magState: mag
      steps: 5
      zeroVisible: true
    - type: ChamberMagazineAmmoProvider
      autoEject: true
    - type: Appearance
    - type: SpeedModifiedOnWield
      walkModifier: 0.97
      sprintModifier: 0.97
    - type: ClothingSpeedModifier
      walkModifier: 0.99
      sprintModifier: 0.99
    - type: Contraband
      allowedDepartments: [ CentralCommand, Security ]

