# Клиент предсказывает выстрелы меха и создаёт локальную hitscan-сущность.
# Технические варианты не дают этим сущностям накапливаться после стрельбы.
- type: entity
  id: BaseSunriseMechHitscan
  abstract: true
  components:
  - type: TimedDespawn
    lifetime: 0.1

- type: entity
  id: SunriseMechHitscanPulse
  parent: [ Pulse, BaseSunriseMechHitscan ]
  categories: [ HideSpawnMenu ]

- type: entity
  id: SunriseMechHitscanIgnitionRedLaser
  parent: [ IgnitionRedLaser, BaseSunriseMechHitscan ]
  categories: [ HideSpawnMenu ]

- type: entity
  id: SunriseMechHitscanRedHeavyLaser
  parent: [ RedHeavyLaser, BaseSunriseMechHitscan ]
  categories: [ HideSpawnMenu ]

- type: entity
  id: SunriseMechHitscanRedLaser
  parent: [ RedLaser, BaseSunriseMechHitscan ]
  categories: [ HideSpawnMenu ]

- type: entity
  id: SunriseMechHitscanRedLaserBeam
  parent: [ RedLaserBeam, BaseSunriseMechHitscan ]
  categories: [ HideSpawnMenu ]

- type: entity
  id: SunriseMechHitscanRedMediumLaser
  parent: [ RedMediumLaser, BaseSunriseMechHitscan ]
  categories: [ HideSpawnMenu ]

- type: entity
  id: RedShuttleMediumLaser
  parent: BasicHitscan
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicRaycast
    maxDistance: 45.0
  - type: Projectile
    damage:
      types:
        Heat: 10
        Structural: 10
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: muzzle_laser
    travelFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: beam
    impactFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: impact_laser

# region Heavy Rifle
- type: entity
  id: BulletRifleTraceHeavySP
  parent: BulletTrace
  categories: [ HideSpawnMenu ]
  components:
