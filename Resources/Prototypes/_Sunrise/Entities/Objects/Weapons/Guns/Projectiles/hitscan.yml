    color: "#FF6A6A"
    scale: 0.3
    shape: Triangle
    requireInSpace: true
  - type: Projectile
    armorPenetration: -0.1
    damage:
      types:
        Piercing: 25
        Structural: 3
  - type: StaminaDamageOnCollide
    damage: 15
  - type: ProjectilePierce
    chance: 0.40
    deviation: 0.05
    pierceLevel: Metal
  - type: ProjectileRicochet
    chance: 0.30
