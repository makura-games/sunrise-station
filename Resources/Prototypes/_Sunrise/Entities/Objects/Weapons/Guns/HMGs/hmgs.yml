
- type: entity
  name: MG-100 Vindicator Minigun
  parent: BaseItem
  id: WeaponMinigunMG100
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Guns/HMGs/minigun/big.rsi
    state: icon
  - type: Item
    sprite: _Sunrise/Objects/Weapons/Guns/HMGs/minigun/tiny.rsi
    size: Ginormous
  - type: Gun
    minAngle: 8
    maxAngle: 60
    angleIncrease: 1 # Примерно 3 секунды стрельбы до максимального разброса.
    angleDecay: 40
    fireRate: 11
    projectileSpeed: 30
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_Sunrise/Weapons/Guns/HMGs/minigun_shot.ogg
  - type: ClothingSlotAmmoProvider
  - type: SlotBasedConnectedContainer
    targetSlot: SuitStorage
    containerWhitelist:
      tags:
      - PowerpackMinigunMG100
  - type: Appearance
  - type: Wieldable
  - type: UseDelay
    delay: 2
  - type: GunRequiresWield

- type: entity
  id: PowerpackMinigunMG100
  parent: BasePowerpackMG100
  name: MG-100 powerpack
  description: A heavy ammunition pack with a mount for a minigun.
  components:
  - type: Item
    size: Ginormous
  - type: BallisticAmmoProvider
    mayTransfer: True
    proto: CartridgeRifleSP
  - type: ItemSlots
    slots:
      weapon_slot:
        ejectOnInteract: true
        whitelist:
          components:
          - ClothingSlotAmmoProvider
  - type: ContainerFill
    containers:
      weapon_slot:
      - WeaponMinigunMG100

- type: entity
  id: PowerpackMinigunMG100Incendiary
  parent: PowerpackMinigunMG100
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeRifleIncendiary

- type: entity
  id: PowerpackMinigunMG100Improvised
  parent: PowerpackMinigunMG100
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeRifleImprovised

- type: entity
  id: BasePowerpackMG100
  parent: BaseItem
  abstract: true
  components:
  - type: Tag
    tags:
    - PowerpackMinigunMG100
  - type: Clothing
    slots: SuitStorage
    sprite: _Sunrise/Objects/Weapons/Guns/Powerpacks/Powerpacks/backpack.rsi
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - CartridgeLightRifle
    capacity: 1200
  - type: ClothingSpeedModifier
    walkModifier: 0.5
    sprintModifier: 0.5
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
      weapon_slot: !type:ContainerSlot
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Guns/Powerpacks/Powerpacks/backpack.rsi
    layers:
    - state: mag-0
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-3
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: false
  - type: Appearance

