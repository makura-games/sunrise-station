- type: entity
  name: M1 Garand
  parent: BaseItem
  id: WeaponSniperGarand
  components:
  - type: Sprite
    scale: 0.8,0.8
    sprite: _Sunrise/Objects/Weapons/Guns/Snipers/garand/big.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    sprite: _Sunrise/Objects/Weapons/Guns/Snipers/garand/tiny.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Item
    size: Huge
    shape:
    - 0,0,4,0
    sprite: _Sunrise/Objects/Weapons/Guns/Snipers/garand/tiny.rsi
  - type: AmmoCounter
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    fireRate: 2.25
    soundGunshot:
      path: /Audio/_Sunrise/Weapons/Guns/Snipers/garand/garand.ogg
      params:
        volume: 12
    soundEmpty:
      path: /Audio/_Sunrise/Weapons/Guns/Snipers/garand/garand_empty.ogg
  - type: ChamberMagazineAmmoProvider
    autoEject: true
    boltClosed: null
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
    soundAutoEject:
      collection: ChurchBell
      params:
        variation: 0.03
        pitch: 1.5
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineGarand
        priority: 2
        disableEject: true
        swap: false
        whitelist:
          tags:
          - MagazineGarand
        whitelistFailPopup: gun-magazine-whitelist-fail
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/_Sunrise/Weapons/Guns/Snipers/garand/garand_empty.ogg
      gun_chamber:
        name: Chamber
        startingItem: CartridgeRifleHeavyFMJ
        priority: 1
        whitelist:
          tags:
          - CartridgeHeavyRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: StaticPrice
    price: 500
  - type: EmitSoundOnPickup
    sound:
      collection: SnipersPickUp
  - type: EmitSoundOnDrop
    sound:
      collection: SnipersDrop
  - type: EmitSoundOnLand
    sound:
      collection: SnipersDrop
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 2
    pvsIncrease: 0.2
  - type: KnockbackByUserTag
    doestContain:
      Resomi:
        knockback: 4
        staminaMultiplier: 15
      Felinid:
        knockback: 2
        staminaMultiplier: 15
  - type: Wieldable
  - type: UseDelay
    delay: 0.5
  - type: GunRequiresWield

- type: entity
  name: N2524 Repeater
  parent: [ BaseWeaponSniper, BaseGunWieldable, BaseMinorContraband ]
  id: WeaponSniperRepeater
  description: A civilian grade lever action firearm, favored by space cowboys for its reliability and stopping power. Uses .45 magnum ammo.
  components:
  - type: Item
    size: Normal
    shape:
    - 0,0,3,1
    sprite: _Sunrise/Objects/Weapons/Guns/Snipers/n2524/repeater_inhands_64x.rsi
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Guns/Snipers/n2524/repeater.rsi
  - type: Clothing
    sprite: _Sunrise/Objects/Weapons/Guns/Snipers/n2524/repeater.rsi
  - type: StaticPrice
    price: 850
  - type: Gun
    pump: true
    fireRate: 3
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      collection: m3
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - CartridgeMagnum
    capacity: 7
    proto: CartridgeMagnumFMJ
  - type: Wieldable
  - type: UseDelay
    delay: 0.5

# Смазанная винтовка для ящика винтовок
- type: entity
  name: Kardashev-Mosin
  parent: [WeaponSniperMosin, BaseGunWieldable, BaseMajorContraband]
  id: WeaponSniperMosinLubed
  description: A relic Kardashev-Mosin rifle that has survived countless wars, and it's still deadly. Freshly unsealed, heavily greased — ready for the next war! Uses .30 caliber rounds.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Snipers/bolt_gun_wood.rsi
  - type: GunRequiresWield
  - type: Item
    size: Huge
    shape:
    - 0,0,4,1
  - type: BallisticAmmoProvider
    capacity: 5
    proto: null
    whitelist:
      tags:
      - CartridgeHeavyRifleR
  - type: Lubed
    slipStrength: 3
    slipsLeft: 3
  - type: NameModifier
    baseName: Kardashev-Mosin
  - type: Tag
    tags:
      - WrappedWeapon

