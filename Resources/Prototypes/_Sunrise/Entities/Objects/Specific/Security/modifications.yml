- type: entity
  id: BaseSecurityUpgrade
  parent: BaseItem
  abstract: true
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Misc/upgrades.rsi
    scale: 0.85, 0.85
    state: closed
  - type: Item
    sprite: _Sunrise/Objects/Misc/upgrades.rsi
    size: Large
    shape:
    - 0,0,2,1

- type: entity
  id: DrozdHeavyUpgradeKit
  name: Drozd Heavy upgrade kit
  description: A kit for converting a Drozd into a Deryaba.
  parent: BaseSecurityUpgrade
  components:
  - type: Construction
    graph: DrozdSecurity
    node: drozdHeavyKit
    defaultTarget: drozdHeavy
    deconstructionTarget: null

- type: entity
  id: SecurityGrenadeLauncherRevolverUpgrade
