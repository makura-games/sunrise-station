- type: entity
  name: Combat medi-injector
  parent: [BaseHypospray, BaseCentcommContraband]
  description: A sterile injector for 4-use. Containing chemicals that regenerate most types of damage.
  id: MedipenCombatInjector
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Specific/Medical/hypospray.rsi
    state: combat_minihypo
  - type: Item
    sprite: Objects/Specific/Medical/hypospray.rsi
    size: Small
  - type: Solution
    solution:
      maxVol: 80
      reagents:
      - ReagentId: Epinephrine
        Quantity: 15
      - ReagentId: Omnizine
        Quantity: 15
      - ReagentId: Saline
        Quantity: 15
      - ReagentId: Rororium
        Quantity: 20
      - ReagentId: Dermaline
        Quantity: 15
  - type: Injector
    solutionName: hypospray
    activeModeProtoId: HyposprayInjectMode
    allowedModes:
    - HyposprayInjectMode
    currentTransferAmount: 20
  - type: UseDelay
    delay: 45
  - type: Appearance
  - type: Tag
    tags:
    - Trash
  - type: PhysicalComposition
    materialComposition:
      Plastic: 300
  - type: SpaceGarbage
  - type: StaticPrice
    price: 750
  - type: TrashOnSolutionEmpty
    solution: hypospray

# Medipens
- type: entity
  name: ephedrine injector
  parent: [ChemicalMedipen, BaseSecurityContraband ]
  id: StimpackNT
  description: Contains enough ephedrine for you to have the chemical's effect for 30 seconds. Use it when you're sure you're ready to throw down.
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: base-needle-inhand-left
      - state: base-colorA-inhand-left
        color: "#04319a"
      - state: base-colorB-inhand-left
        color: "#04319a"
      right:
      - state: base-needle-inhand-right
      - state: base-colorA-inhand-right
        color: "#13049a"
      - state: base-colorB-inhand-right
        color: "#04319a"
  - type: Sprite
    sprite: _Sunrise/Objects/Specific/Medical/medipen.rsi
    layers:
    - state: stimpen
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: Solution
    solution:
      maxVol: 35
      reagents:
      - ReagentId: Ephedrine
        Quantity: 15
      - ReagentId: Epinephrine
        Quantity: 10
      - ReagentId: Tricordrazine
        Quantity: 10
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: stimpen_empty
  - type: Injector
    solutionName: hypospray
    currentTransferAmount: 35
    activeModeProtoId: HyposprayInjectMode
    allowedModes:
    - HyposprayInjectMode
    ignoreClosed: false
  - type: StaticPrice
    price: 950

