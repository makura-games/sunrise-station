- type: entity
  name: Bottle case
  description: A small and explosionproof case for bottles.
  parent: BaseStorageItem
  id: BottleCaseBase
  abstract: true
  components:
  - type: Sprite
    layers:
      - map: [ base ]
        state: icon
  - type: Storage
    whitelist:
      tags:
      - Bottle
    grid:
    - 0,0,3,1
  - type: Item
    size: Normal
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        base:
          True: { state: icon-open }
          False: { state: icon }
  - type: Appearance
  - type: ExplosionResistance
    damageCoefficient: 0.5

- type: entity
  name: bottle case
  description: A small and explosionproof case for bottles.
  parent: BottleCaseBase
  id: BottleCase
  components:
  - type: Sprite
    sprite: _Sunrise/Clothing/Pouches/medicine_pouch.rsi
    state: icon
  - type: Item
    sprite: _Sunrise/Clothing/Pouches/medicine_pouch.rsi
