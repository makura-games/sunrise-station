# region Modules
- type: entity
  id: MechEquipmentGrabberSmallMining
  parent: MechEquipmentGrabberSmall
  components:
  - type: ContainerFill
    containers:
      item-container:
      - OreBox
      - OreBox

# region Base Mechs
- type: entity
  id: BaseMechPod
  save: false
  abstract: true
  components:
  - type: RadarBlip
    color: "#FFD700FF"
    scale: 1.1
    shape: Triangle
    requireInSpace: false
  - type: NoSlip
  - type: CanMoveInAir
  - type: Reactive
  - type: MobMover
  - type: NpcFactionMember
    factions:
    - NanoTrasen
  - type: Mech
    entryDelay: 1
  - type: MechVulnerableToEMP
  - type: MechAir
  - type: GravityAffected
  - type: AirFilter
    # everything except oxygen and nitrogen
    gases:
    - CarbonDioxide
    - Plasma
    - Tritium
    - WaterVapor
    - Ammonia
    - NitrousOxide
    - Frezon
    #- Helium3 TODO: fusion
    # remove everything except oxygen to maintain oxygen ratio
    overflowGases:
    - Nitrogen
    - CarbonDioxide
    - Plasma
    - Tritium
    - WaterVapor
    - Ammonia
    - NitrousOxide
    - Frezon
    #- Helium3 TODO: fusion
  - type: AirIntake
  # for intake and filter to work
  - type: AtmosDevice
    requireAnchored: false
    joinSystem: true
  - type: DoAfter
  - type: Repairable
    doAfterDelay: 1
    damage:
      types:
        Blunt: -25
        Slash: -25
        Piercing: -25
        Caustic: -25
        Structural: -25
        Mangleness: 2
  - type: UserInterface
    interfaces:
      enum.MechUiKey.Key:
        type: MechBoundUserInterface
      enum.MechEquipmentSelectUiKey.Key:
        type: MechEquipmentSelectBoundUserInterface
  - type: Puller
    needsHands: false
  - type: InputMover
  - type: InteractionOutline
  - type: MovementSpeedModifier
    baseWalkSpeed: 1
    baseSprintSpeed: 4
    baseWeightlessModifier: 2
  - type: MovementAlwaysTouching
  - type: Pullable
  - type: Clickable
  - type: WiresPanel
  - type: Physics
    bodyType: KinematicController #Dynamic
  - type: MobState
    allowedStates:
    - Alive
    - Critical
  - type: MobThresholds
    currentThresholdState : Alive
    thresholds:
      0: Alive
      300: Critical
    showOverlays: false
    allowRevives: true
  - type: ZombieImmune
  - type: HealthExaminable
    examinableTypes:
      - Blunt
      - Slash
      - Piercing
      - Heat
      - Shock
      - Mangleness
    locPrefix: mech
  - type: Appearance
  - type: ContainerContainer
    containers:
      mech-pilot-slot: !type:ContainerSlot
      mech-equipment-container: !type:Container
      mech-battery-slot: !type:ContainerSlot
  - type: Inventory
    templateId: mechArmor
  - type: InventorySlots
  - type: Loadout
    prototypes: [ MechArmorLightLoadout ]
  - type: Damageable
  - type: Injurable
    damageContainer: Mech
  - type: GuideHelp
    guides:
    - Robotics
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 900
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: start
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StatusIcon
    bounds: "-0.6,-0.6, 0.6, 0.6"
  - type: PointLight
    enabled: false
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    radius: 35
    energy: 4
    offset: "0.28, 0.75"
    netsync: false
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound

# region Mech Pod
- type: entity
  id: MechSecPod
  parent: [ BaseMechPod, BaseSecurityContraband ]
  name: Security Pod
  description: Despite its size, the Security Pod has incredible mobility in space thanks to its engines.
  suffix: Filled
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Sunrise/Objects/Specific/Mech/sec_pod.rsi
    scale: 1.08, 1.08
    layers:
    - state: sec_pod
      map: ["enum.MechVisualLayers.Base"]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.1,-1.1,1.1,1"
        density: 100
        mask:
          - FlyingMobMask
        layer:
          - FlyingMobLayer
  - type: AmbientSound
    range: 4
    volume: -4
    sound:
      path: /Audio/Effects/shuttle_thruster.ogg
  - type: Mech
    baseState: sec_pod
    openState: sec_pod_open
    brokenState: sec_pod_broken
    mechToPilotDamageMultiplier: 0.0
    maxEquipmentAmount: 2
    airtight: true
    pilotWhitelist:
      components:
        - HumanoidProfile
    equipmentWhitelist:
      tags:
      - CombatMech
      - PaddyMech
    startingEquipment:
      - WeaponMechCombatSolarisLaser
  - type: Reflect
    reflectProb: 0.05
    spread: 180
    soundOnReflect: /Audio/Weapons/block_metal1.ogg
    reflects:
    - NonEnergy
  - type: MobThresholds
    currentThresholdState: Alive
    thresholds:
      0: Alive
      225: Critical
    showOverlays: false
    allowRevives: true
  - type: ContainerFill
    containers:
      mech-battery-slot:
      - PowerCageMedium
  - type: AccessReader
    access: [["Security"]]
  - type: RadarBlip
    color: "#ff1500"
    scale: 1.25
    shape: Triangle
    requireInSpace: false

- type: entity
  id: MechMiningPod
  parent: [ BaseMechPod, BaseSalvageContraband ]
  name: Mining Pod
  description: Despite its size, the Mining Pod has incredible survability in space.
  suffix: Filled
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Sunrise/Objects/Specific/Mech/mining_pod.rsi
    scale: 1.08, 1.08
    layers:
    - state: mining_pod
      map: ["enum.MechVisualLayers.Base"]
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 5
    baseWeightlessModifier: 2
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.80
        density: 100
        mask:
          - FlyingMobMask
        layer:
          - FlyingMobLayer
  - type: AmbientSound
    range: 4
    volume: -4
    sound:
      path: /Audio/Effects/shuttle_thruster.ogg
  - type: Mech
    baseState: mining_pod
    openState: mining_pod_open
    brokenState: mining_pod_broken
    mechToPilotDamageMultiplier: 0.0
    maxEquipmentAmount: 4
    airtight: true
    pilotWhitelist:
      components:
        - HumanoidProfile
    equipmentWhitelist:
      tags:
      - IndustrialMech
    startingEquipment:
      - WeaponMechIndustrialPlasmaCutterLight #Нужно сделать улучшения WeaponMechIndustrialKineticAccelerator по аналогии с ручным для прогресса в раунде
      - MechEquipmentGrabberSmallMining
  - type: Reflect
    reflectProb: 0.05
    spread: 180
    soundOnReflect: /Audio/Weapons/block_metal1.ogg
    reflects:
    - NonEnergy
  - type: MobThresholds
    currentThresholdState: Alive
    thresholds:
      0: Alive
      200: Critical
    showOverlays: false
    allowRevives: true
  - type: ContainerFill
    containers:
      mech-battery-slot:
      - PowerCageMedium
  - type: AccessReader
    access: [["Mining"]]
  - type: Storage
    grid:
    - 0,0,11,7
    clickInsert: false
    maxItemSize: Normal
    storageOpenSound: /Audio/Effects/closetopen.ogg
    storageCloseSound: /Audio/Effects/closetclose.ogg
    whitelist:
      tags:
      - Ore
  - type: Speech
    speechSounds: Borg
  - type: TTS
    voice: Glados
  - type: RadarBlip
    color: "#4800ff"
    scale: 1.1
    shape: Triangle
    requireInSpace: false

