- type: entity
  id: BaseSunriseBlyashankaProp
  parent: BaseStructure
  abstract: true
  name: Blyashanka wreck
  description: An inoperable Blyashanka mech hull, left behind as a monument to a lost battle.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Anchorable
  - type: InteractionOutline
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: _Sunrise/Objects/Specific/Mech/blyashanka.rsi
    scale: 1.05, 1.05
  - type: Appearance
  - type: Damageable
    damageModifierSet: StructuralMetallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: DamageVisuals
    thresholds: [50, 100, 150, 250, 350, 450]
    trackAllDamage: true
    damageOverlay:
      sprite: _Sunrise/Objects/Specific/Mech/blyashanka.rsi
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          ScrapSteel:
            min: 2
            max: 4
          SunriseMechBlyashankaHarnessSpawnerLow:
            min: 1
            max: 1
          SunriseMechBlyashankaLLegSpawnerLow:
            min: 1
            max: 1
          SunriseMechBlyashankaRLegSpawnerLow:
            min: 1
            max: 1
          SunriseMechBlyashankaLLeg2SpawnerLow:
            min: 1
            max: 1
          SunriseMechBlyashankaRLeg2SpawnerLow:
            min: 1
            max: 1
          SunriseMechBlyashankaArmorPlateSpawnerLow:
            min: 1
            max: 1
          MechGygaxBoardSpawnerLow:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  parent: BaseSunriseBlyashankaProp
  id: SunriseBlyashankaPropClosed
  name: closed Blyashanka wreck
  description: An inoperable Blyashanka mech hull with its cockpit sealed shut.
  components:
  - type: Sprite
    state: base

- type: entity
  parent: BaseSunriseBlyashankaProp
  id: SunriseBlyashankaPropOpen
  name: open Blyashanka wreck
  description: An inoperable Blyashanka mech hull with its cockpit left open.
  components:
  - type: Sprite
    state: base-open

- type: entity
  parent: MarkerBase
  id: SunriseBlyashankaPropClosedDamagedSpawner
  name: randomly damaged closed Blyashanka wreck spawner
  suffix: Random
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Sunrise/Objects/Specific/Mech/blyashanka.rsi
      state: base
  - type: RandomSpawner
    offset: 0
    prototypes:
    - SunriseBlyashankaPropClosedDamaged50
    - SunriseBlyashankaPropClosedDamaged100
    - SunriseBlyashankaPropClosedDamaged150
    - SunriseBlyashankaPropClosedDamaged250
    - SunriseBlyashankaPropClosedDamaged350
    - SunriseBlyashankaPropClosedDamaged450

- type: entity
  parent: MarkerBase
