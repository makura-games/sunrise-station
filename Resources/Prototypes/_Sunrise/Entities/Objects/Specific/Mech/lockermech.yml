- type: entity
  id: MechLocker
  parent: [ BaseMech, IndustrialMech ]
  name: LockerMech
  description: Slow, but sealed mech. Assembled from trash.
  components:
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: /Textures/_Sunrise/Objects/Specific/Mech/lockermech.rsi
    scale: 1.08, 1.08
    layers:
    - map: [ "enum.MechVisualLayers.Base" ]
      state: lockermech
      sprite: /Textures/_Sunrise/Objects/Specific/Mech/lockermech.rsi
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Mecha/sound_mecha_powerloader_step.ogg
  - type: Mech
    baseState: lockermech
    openState: lockermech-open
    brokenState: lockermech-broken
    airtight: true
    maxEquipmentAmount: 2
    pilotBlacklist:
      species:
      - Felinid
  - type: Vehicle
    transferDamageModifier:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.5
        Heat: 0.5
        Shock: 0.5
        Caustic: 0.5
        Structural: 0.5
        Mangleness: 0
    operatorWhitelist:
      components:
      - HumanoidProfile
  - type: MeleeWeapon
    hidden: true
    attackRate: 1
    damage:
      types:
        Blunt: 5
  - type: MovementSpeedModifier
    baseWalkSpeed: 1
    baseSprintSpeed: 3.1
  - type: Reflect
    reflectProb: 0.15
    spread: 180
    soundOnReflect: /Audio/Weapons/block_metal1.ogg
    reflects:
    - NonEnergy
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound
    - Ripley
  - type: MobThresholds
    thresholds:
      0: Alive
      300: Critical
    showOverlays: false
    allowRevives: true
  - type: Construction
    graph: LockerMechConstruction
    node: lockermech

- type: entity
  id: MechLockerBattery
  parent: MechLocker
  suffix: Battery
  components:
  - type: ContainerFill
    containers:
      mech-battery-slot:
      - PowerCageMedium
