- type: entity
  id: MechArmorBase
  abstract: true
  parent: ClothingOuterBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Specific/Mech/mecha_equipment.rsi
    layers:
    - state: mecha_abooster_proj
      visible: false
  - type: Clothing
    sprite: Objects/Specific/Mech/mecha_equipment.rsi
  - type: Unremoveable
  - type: Pierceable
    level: Rock

- type: entity
  id: MechArmorThin
  parent: MechArmorBase
  name: mech armor (thin)
  categories: [ HideSpawnMenu ]
  components:
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.9
        Shock: 2
        Heat: 0.8
        Structural: 0.05
      flatReductions:
        Blunt: 2
        Heat: 1
  - type: Pierceable
    level: Metal

