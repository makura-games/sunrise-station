  - type: Icon
    state: pda-space-prison-prisoner-screen-H-cracked
  - type: PdaAnimationVisuals
    animatedState: pda-space-prison-prisoner-screen-H-cracked
    idInsertedLayerState: id_inserted-space-prison

- type: entity
