- type: entity
  id: BaseStationTransitHub
  abstract: true
  components:
  - type: StationTransitHub
    map: /Maps/_Sunrise/Nonstations/transit_hub_big.yml # Временно, пока не домапят
    biomes:
    - PlainGrasslands
    - PlainLowDesert
    - PlainSnow

- type: entity
  id: BaseStationGoal
  abstract: true
  components:
  - type: StationGoal
    goals:
    - Shuttle
    - Singularity
    - SolarPanels
    - Artifacts
    - Bank
    - Zoo
    - MiningOutpost
    - Tesla

- type: entity
  id: BaseStationPlanetPrison
  abstract: true
  components:
  - type: PlanetPrisonStation
    stationsModern:
    - PlanetPrison
    stationsOld:
    - PlanetPrisonOld
    biomes:
    - PlainGrasslands
    - PlainLowDesert
    - PlainSnow
    shuttleWhitelist:
      components:
      - SecurityShuttle
      - PrisonShuttle
      - ErtShuttle

- type: entity
  id: PrisonStationAlertLevels
  abstract: true
  components:
  - type: AlertLevel
    availableAlertLevels:
    - SunrisePrisonRollCall
    - SunrisePrisonBreakfast
    - SunrisePrisonWork
    - SunrisePrisonExercise
    - SunrisePrisonRest
    - SunrisePrisonShower
    - SunrisePrisonLightsOut
    - SunrisePrisonLockdown
    defaultAlertLevel: SunrisePrisonLightsOut
    currentAlertLevel: SunrisePrisonLightsOut

