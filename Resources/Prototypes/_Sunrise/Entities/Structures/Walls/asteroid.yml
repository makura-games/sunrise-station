# Базальтовые и андезитовые стены нужны Sunrise-прототипам после их удаления из Wizden.
- type: entity
  id: WallRockBasalt
  name: basalt
  parent: WallRock
  components:
  - type: Icon
    sprite: _Sunrise/Structures/Walls/rock.rsi
    state: rock_wall
  - type: IconSmooth
    key: walls
    mode: NoSprite
  - type: SmoothEdge
  - type: Sprite
    sprite: _Sunrise/Structures/Walls/rock.rsi
    layers:
    - state: rock_wall
    - map: ["enum.EdgeLayer.South"]
      state: rock_wall_south
    - map: ["enum.EdgeLayer.East"]
      state: rock_wall_east
    - map: ["enum.EdgeLayer.North"]
      state: rock_wall_north
    - map: ["enum.EdgeLayer.West"]
      state: rock_wall_west

- type: entity
  id: WallRockAndesite
  name: andesite
  parent: WallRock
  components:
  - type: Icon
    sprite: _Sunrise/Structures/Walls/rock.rsi
    state: rock_andesite
  - type: IconSmooth
    key: walls
    mode: NoSprite
  - type: SmoothEdge
  - type: Sprite
    sprite: _Sunrise/Structures/Walls/rock.rsi
    layers:
    - state: rock_andesite
    - map: ["enum.EdgeLayer.South"]
      state: rock_andesite_south
    - map: ["enum.EdgeLayer.East"]
      state: rock_andesite_east
    - map: ["enum.EdgeLayer.North"]
      state: rock_andesite_north
    - map: ["enum.EdgeLayer.West"]
      state: rock_andesite_west

# Бананиумные породы сохранены в Sunrise после их удаления из Wizden.
- type: entity
  id: AsteroidRockBananium
  parent: AsteroidRock
  description: An ore vein rich with bananium.
  suffix: Bananium
  components:
  - type: OreVein
    oreChance: 1.0
    currentOre: OreBananium
  - type: Icon
    sprite: _Sunrise/Structures/Walls/rock.rsi
    state: rock_asteroid
  - type: IconSmooth
    key: walls
    mode: NoSprite
  - type: SmoothEdge
  - type: Sprite
    sprite: _Sunrise/Structures/Walls/rock.rsi
    layers:
    - state: rock_asteroid
    - map: ["enum.EdgeLayer.South"]
      state: rock_asteroid_south
    - map: ["enum.EdgeLayer.East"]
      state: rock_asteroid_east
    - map: ["enum.EdgeLayer.North"]
      state: rock_asteroid_north
    - map: ["enum.EdgeLayer.West"]
      state: rock_asteroid_west
    - state: rock_bananium
      map: ["enum.MiningScannerVisualLayers.Overlay"]

- type: entity
  id: AsteroidRockBananiumCrab
  parent: AsteroidRockBananium
  suffix: Bananium Crab
  components:
  - type: OreVein
    currentOre: OreBananiumCrab

