- type: entity
  parent: ClothingOuterArmorBasic
  id: ClothingOuterVestArmorSec
  name: armor vest
  description: A slim Type I armored vest that provides decent protection against most types of damage.
  components:
    - type: Sprite
      sprite: _Sunrise/Clothing/OuterClothing/Vests/armor_sec.rsi
    - type: Clothing
      sprite: _Sunrise/Clothing/OuterClothing/Vests/armor_sec.rsi
    - type: Construction
      graph: UpgradeArmorVest
      node: start

- type: entity
  parent: ClothingOuterArmorBasic
  id: ClothingOuterVestArmorMedSec
  name: security medic armor vest
  description: A security medic's armor vest, with little pockets for little things.
  components:
    - type: Storage
      grid:
      - 0,0,2,1
      maxItemSize: Small
    - type: ContainerContainer
      containers:
       storagebase: !type:Container
        ents: []
    - type: UserInterface
      interfaces:
        enum.StorageUiKey.Key:
          type: StorageBoundUserInterface
    - type: Sprite
      sprite: _Sunrise/Clothing/OuterClothing/Vests/armor_sec_med.rsi
    - type: Clothing
      sprite: _Sunrise/Clothing/OuterClothing/Vests/armor_sec_med.rsi

- type: entity
  parent: ClothingOuterBase
  id: ClothingOuterVestSecurityMedic
  name: security medic vest
  description: A lightweight vest worn by the Security Medic.
  components:
    - type: Sprite
      sprite: _Sunrise/Clothing/OuterClothing/Vests/vest_security_medic.rsi
    - type: Clothing
      sprite: _Sunrise/Clothing/OuterClothing/Vests/vest_security_medic.rsi
    - type: Tag
      tags:
      - Vest
      - NudeBottom  # INTERACTIONS
      - WhitelistChameleon

- type: entity
  parent: [ClothingOuterVestArmorSec, ClothingOuterStorageBase, BaseSecurityContraband]
  id: ClothingOuterVestWebSec
  name: security web vest
  description: A high-quality Type I armored vest made from a hard synthetic material. It's surprisingly flexible and light, despite formidable armor plating.
  components:
    - type: Sprite
      sprite: _Sunrise/Clothing/OuterClothing/Vests/web_armor_sec.rsi
    - type: Clothing
      sprite: _Sunrise/Clothing/OuterClothing/Vests/web_armor_sec.rsi
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.7
          Slash: 0.7
          Piercing: 0.5
          Heat: 0.9
    - type: ExplosionResistance
      damageCoefficient: 0.9
    - type: Construction
      graph: UpgradeArmorVest
      node: webvest

- type: entity
  parent: ClothingOuterVestWebSec
  id: ClothingOuterVestWebBlue
  name: blueshild web vest
  components:
    - type: Sprite
      sprite: _Sunrise/Clothing/OuterClothing/Vests/web_armor_blue.rsi
    - type: Clothing
      sprite: _Sunrise/Clothing/OuterClothing/Vests/web_armor_blue.rsi
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.5
          Slash: 0.5
          Piercing: 0.5
          Heat: 0.5
          Caustic: 0.7
    - type: ExplosionResistance
      damageCoefficient: 0.8
    - type: Construction
      graph: UpgradeArmorVestBlueshield
      node: webvest

- type: entity
  parent: [ClothingOuterVestWeb, BaseChameleon]
  id: ClothingOuterVestWebChameleon
  name: chameleon web vest
  description: A synthetic armor vest with holographic plates hidden under the webbing.
  suffix: Chameleon
  components:
    - type: Tag
      tags: []
    - type: ChameleonClothing
      slot: [outerClothing]
      default: ClothingOuterVestWeb
      requireTag: Vest
    - type: UserInterface
      interfaces:
        enum.StorageUiKey.Key:
          type: StorageBoundUserInterface
        enum.ChameleonUiKey.Key:
          type: ChameleonBoundUserInterface

- type: entity
  parent: [ClothingOuterVestWebElite, BaseChameleon]
  id: ClothingOuterVestWebEliteChameleon
  name: elite chameleon vest
  description: An elite synthetic armor vest with holographic plates hidden under the heat resistant fibers.
  suffix: Chameleon
  components:
    - type: Tag
      tags: []
    - type: ChameleonClothing
      slot: [outerClothing]
      default: ClothingOuterVestWebElite
      requireTag: Vest
    - type: UserInterface
      interfaces:
        enum.StorageUiKey.Key:
          type: StorageBoundUserInterface
        enum.ChameleonUiKey.Key:
          type: ChameleonBoundUserInterface
