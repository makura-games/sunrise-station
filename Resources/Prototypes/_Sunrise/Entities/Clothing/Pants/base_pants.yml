- type: entity
  abstract: true
  parent: Clothing
  id: ClothingPantsBase
  components:
  - type: Clothing
    slots:
      - PANTS
  - type: Item
    size: Tiny
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: Sprite
    state: icon

- type: entity
  abstract: true
  parent: ClothingPantsBase
  id: ClothingPantsBaseButcherable
  components:
  - type: Butcherable
    butcheringType: Knife
    spawned:
    - id: MaterialCloth1
      amount: 1
  - type: PhysicalComposition
    materialComposition:
      Cloth: 50
  - type: Tag
    tags:
    - ClothMade
    - Recyclable

- type: entity
  abstract: true
  parent: ClothingPantsBaseButcherable
  id: ClothingPantsStorageBase
  components:
  - type: ItemSlots
    slots:
      storagebase:
        insertSound:
          collection: EquipSounds
          params:
            maxDistance: 3
        whitelist:
          sizes:
          - Tiny
          - Small
  - type: ContainerContainer
    containers:
      storagebase: !type:ContainerSlot
