- type: entity
  parent: [ClothingShoesBootsMagBase, ClothingShoesBootsCombat, BaseSecurityContraband]
  id: ClothingShoesBootsMagCombat
  name: combat magboots
  description: Combat magnetic boots, often used during extravehicular activity to ensure the user remains safely attached to the vehicle.
  components:
  - type: Sprite
    sprite: _Sunrise/Clothing/Shoes/magboots_combat.rsi
    state: icon
  - type: Clothing
    sprite: _Sunrise/Clothing/Shoes/magboots_combat.rsi
  - type: Magboots
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: ClothingSlowOnDamageModifier
    modifier: 0.5

- type: entity
  parent: ClothingShoesBootsMagCombat
  id: ClothingShoesBootsMagPirate
  name: pirate magboots
  description: Repainted combat magnets to match the colors of pirates.
  components:
  - type: Sprite
    sprite: _Sunrise/Clothing/Shoes/magboots_pirate.rsi
    state: icon
  - type: Clothing
    sprite: _Sunrise/Clothing/Shoes/magboots_pirate.rsi
  - type: Magboots

- type: entity
  abstract: true
  parent: [ClothingShoesMilitaryBase, ClothingShoesBootsMag]
  id: BaseSunriseClothingShoesBootsMagPirateMurmillo
  components:
  - type: Sprite
    sprite: _Sunrise/Clothing/Shoes/magboots_pirate.rsi
    state: icon
  - type: Clothing
    sprite: _Sunrise/Clothing/Shoes/magboots_pirate.rsi
    equipDelay: 3
    unequipDelay: 9
    stripDelay: 18
  - type: ClothingSpeedModifier
    walkModifier: 0.4
    sprintModifier: 0.4
    requireActivated: false
  - type: Modsuit
  - type: ToggleableClothing
    clothingPrototype: ClothingOuterHardsuitMurmillo
    requiredSlot: feet
    slot: outerClothing

- type: entity
  parent: BaseSunriseClothingShoesBootsMagPirateMurmillo
  id: SunriseClothingShoesBootsMagPirateMurmilloActive
  name: murmillo MOD-boots
  description: Heavy pirate magnetic boots with a Murmillo hardsuit ready to deploy without a MOD core.
  suffix: Pirate, MOD, Active
  components:
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot
      item: !type:ContainerSlot
  - type: Modsuit
    isActivated: true

- type: entity
  parent: BaseSunriseClothingShoesBootsMagPirateMurmillo
  id: SunriseClothingShoesBootsMagPirateMurmillo
  name: murmillo MOD-boots
  description: Heavy pirate magnetic boots with a Murmillo hardsuit deployment system awaiting a MOD core.
  suffix: Pirate, MOD, Inactive
  components:
  - type: ItemSlots
    slots:
      modsuit_core:
        name: power-cell-slot-component-slot-name-default
        disableEject: true
        swap: false
        whitelist:
          tags:
          - ModsuitCore
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot
      modsuit_core: !type:ContainerSlot
      item: !type:ContainerSlot

- type: entity
  parent: SunriseClothingShoesBootsMagPirateMurmillo
  id: SunriseClothingShoesBootsMagPirateMurmilloDamaged
  name: murmillo MOD-boots
  description: Heavy pirate magnetic boots containing a damaged Murmillo hardsuit and awaiting a MOD core.
  suffix: Pirate, MOD, Damaged, Inactive
  components:
  - type: ToggleableClothing
    clothingPrototype: ClothingOuterHardsuitMurmilloDamaged

- type: entity
  parent: [ClothingShoesBootsMagBase, BaseSecurityContraband]
  id: ClothingShoesBootsMagSec
  name: Security magboots
  description: Security magnetic boots, often used during extravehicular activity to ensure the user remains safely attached to the vehicle.
  components:
  - type: Sprite
    sprite: _Sunrise/Clothing/Shoes/magboots_sec.rsi
    state: icon
  - type: Clothing
    sprite: _Sunrise/Clothing/Shoes/magboots_sec.rsi
  - type: Magboots
  - type: ClothingSpeedModifier
    walkModifier: 0.75
    sprintModifier: 0.7
  - type: ClothingSlowOnDamageModifier
    modifier: 0.75

- type: entity
  parent: ClothingShoesBootsMagBase
  id: ClothingShoesBootsMagAtmos
  name: Atmos magboots
  components:
  - type: Sprite
    sprite: _Sunrise/Clothing/Shoes/magboots_atmos.rsi
  - type: Clothing
    sprite: _Sunrise/Clothing/Shoes/magboots_atmos.rsi
  - type: ApcPowerReceiver
    needsPower: false
    powerLoad: 1
  - type: Item
    size: Huge
  - type: Charger
    slotId: charger_slot
    portable: true
    chargeRate: 10
  - type: ContainerContainer
    containers:
      charger_slot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      charger_slot:
        ejectOnInteract: false
        whitelist:
          components:
          - PowerCell
