- type: entity
  parent: ClothingBackpackDuffel
  id: ClothingBackpackDuffelMilitary
  name: army duffel bag
  description: A large duffel bag for holding any army goods.
  components:
    - type: Sprite
      sprite: _Sunrise/Clothing/Back/Duffels/military.rsi
    - type: Storage
      grid:
        - 0,0,7,4
      maxItemSize: Huge
