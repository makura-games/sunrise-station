- type: entity
  abstract: true
  parent: Clothing
  id: ClothingHeadsetNokey
  name: headset
  description: An updated, modular intercom that fits over the head. Takes encryption keys.
  components:
  - type: ContainerContainer
    containers:
      key_slots: !type:Container
  - type: Headset
    toggleAction: ActionToggleHeadset
  - type: EncryptionKeyHolder
    keySlots: 4
  - type: Sprite
    state: icon
  - type: Item
    size: Small
  - type: Clothing
    slots:
    - ears
    sprite: Clothing/Ears/Headsets/base.rsi
  - type: UserInterface
    interfaces:
      enum.HeadsetUiKey.Key:
        type: HeadsetBoundUserInterface

