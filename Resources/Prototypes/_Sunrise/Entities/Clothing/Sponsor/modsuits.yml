# Эксклюзивные вещи спонсорского инвентаря из подборки арт-директора (ноябрь 2026).
# Если меняете ID вещи, поправьте entityPrototype в спонсорском каталоге сайта, иначе купившие перестанут её получать.

- type: entity
  parent: ClothingBackpack
  id: SunriseSponsorClothingModsuitBackCMO
  name: Hippocrates MOD control unit
  description: The control unit of the Hippocrates MOD, an advanced suit by DeForest Medical Corporation. A red cross stands out on its turquoise casing.
  categories: [ SponsorExclusive ]
  components:
  - type: Sprite
    sprite: _Sunrise/Clothing/Sponsor/Back/cmo.rsi
    state: icon
  - type: Clothing
    sprite: _Sunrise/Clothing/Sponsor/Back/cmo.rsi
  - type: ToggleableClothing
    action: ActionToggleSuitPiece
    clothingPrototype: SunriseSponsorClothingOuterModsuitBodyCMO
    requiredSlot: back
    slot: outerClothing
  - type: Modsuit
    isActivated: true

- type: entity
  parent: ClothingOuterHardsuitBase
  id: SunriseSponsorClothingOuterModsuitBodyCMO
  name: Hippocrates MOD chestplate
  description: The turquoise chestplate of the Hippocrates MOD, worn over a crimson undersuit with white shoulder pads.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Sunrise/Clothing/Sponsor/OuterClothing/cmo.rsi
    state: icon
  - type: Clothing
    sprite: _Sunrise/Clothing/Sponsor/OuterClothing/cmo.rsi
  - type: HideLayerClothing
    slots: [ Tail ]
  - type: PressureProtection
    highPressureMultiplier: 0.3
    lowPressureMultiplier: 5500
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.75
        Heat: 0.9
        Radiation: 0.3
        Caustic: 0.2
  - type: ClothingSpeedModifier
    walkModifier: 0.85
    sprintModifier: 0.85
  - type: ToggleableClothing
    action: ActionToggleSuitPiece
    clothingPrototype: SunriseSponsorClothingHeadHelmetModsuitCMO
    requiredSlot: outerclothing
    slot: head
  - type: Modsuit
    isActivated: true

- type: entity
  parent: [ ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase ]
  id: SunriseSponsorClothingHeadHelmetModsuitCMO
  name: Hippocrates MOD helmet
  description: A dark MOD helmet with a large teal visor.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Sunrise/Clothing/Sponsor/Head/cmo.rsi
    layers:
    - state: icon
    - state: icon-flash
      map: [ light ]
      visible: false
      shader: unshaded
  - type: Clothing
    sprite: _Sunrise/Clothing/Sponsor/Head/cmo.rsi
    clothingVisuals:
      head:
      - state: equipped-head
  - type: ToggleableVisuals
    spriteLayer: light
    clothingVisuals: {}
  - type: HandheldLight
    addPrefix: false
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95
        Heat: 0.95
        Radiation: 0.9
        Caustic: 0.9
  - type: PressureProtection
    highPressureMultiplier: 0.6
    lowPressureMultiplier: 1000
  - type: FlashImmunity
  - type: ToggleableClothing
    action: ActionToggleSuitPiece
    clothingPrototype: SunriseSponsorClothingHandsModsuitCMO
    requiredSlot: head
    slot: gloves
  - type: Modsuit
    isActivated: true

- type: entity
  parent: ClothingHandsBase
  id: SunriseSponsorClothingHandsModsuitCMO
  name: Hippocrates MOD gauntlets
  description: Crimson gloves with turquoise plates over the knuckles, part of the Hippocrates MOD.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Sunrise/Clothing/Sponsor/Hands/cmo.rsi
    state: icon
  - type: Clothing
    sprite: _Sunrise/Clothing/Sponsor/Hands/cmo.rsi
  - type: ToggleableClothing
    action: ActionToggleSuitPiece
    clothingPrototype: SunriseSponsorClothingModsuitShoesCMO
    requiredSlot: gloves
    slot: shoes
  - type: Modsuit
    isActivated: true

- type: entity
  parent: ClothingShoesBase
  id: SunriseSponsorClothingModsuitShoesCMO
  name: Hippocrates MOD boots
  description: Bulky turquoise boots of the Hippocrates MOD, each marked with a medical cross.
  categories: [ HideSpawnMenu ]
