# Эксклюзивные вещи спонсорского инвентаря из подборки арт-директора (ноябрь 2026).
# Если меняете ID вещи, поправьте entityPrototype в спонсорском каталоге сайта, иначе купившие перестанут её получать.

- type: entity
  parent: ClothingOuterHardsuitBase
  id: SunriseSponsorClothingOuterHardsuitTarkhan
  name: Basilisk hardsuit
  description: A sealed hardsuit designed by the Phaethon Dynasty and painted in a royal white palette. A rare sight.
  categories: [ SponsorExclusive ]
  components:
  - type: Sprite
    sprite: _Sunrise/Clothing/Sponsor/OuterClothing/basilisk.rsi
    state: icon
  - type: Clothing
    sprite: _Sunrise/Clothing/Sponsor/OuterClothing/basilisk.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.525
    lowPressureMultiplier: 10000
  - type: ClothingSpeedModifier
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.75
        Heat: 0.9
  - type: ExplosionResistance
    damageCoefficient: 0.85
  - type: ToggleableClothing
    clothingPrototype: SunriseSponsorClothingHeadHelmetHardsuitTarkhan

- type: entity
  parent: [ ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase ]
  id: SunriseSponsorClothingHeadHelmetHardsuitTarkhan
  name: Basilisk hardsuit helmet
  description: A sealed helmet that completes the Basilisk hardsuit.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Sunrise/Clothing/Sponsor/Head/basilisk.rsi
    layers:
    - state: icon
    - state: icon
      map: [ light ]
      visible: false
  - type: Clothing
    sprite: _Sunrise/Clothing/Sponsor/Head/basilisk.rsi
    clothingVisuals:
      head:
      - state: equipped-HELMET
  - type: ToggleableVisuals
    spriteLayer: light
    clothingVisuals: {}
  - type: HandheldLight
    addPrefix: false
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000

- type: entity
  parent: ClothingOuterHardsuitBase
  id: SunriseSponsorClothingOuterHardsuitM86
  name: M86 hardsuit
  description: A bulky black hardsuit with blue trim and cyan indicators, the successor to an older, long-retired series.
  categories: [ SponsorExclusive ]
  components:
  - type: Sprite
    sprite: _Sunrise/Clothing/Sponsor/OuterClothing/m86.rsi
    state: icon
  - type: Clothing
    sprite: _Sunrise/Clothing/Sponsor/OuterClothing/m86.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.525
    lowPressureMultiplier: 10000
  - type: ClothingSpeedModifier
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.5
        Heat: 0.5
        Radiation: 0.25
        Caustic: 0.5
  - type: ExplosionResistance
    damageCoefficient: 0.6
  - type: ToggleableClothing
    clothingPrototype: SunriseSponsorClothingHeadHelmetHardsuitM86

- type: entity
  parent: [ ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase ]
  id: SunriseSponsorClothingHeadHelmetHardsuitM86
  name: M86 hardsuit helmet
  description: A sealed helmet that completes the hardsuit of the same name.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Sunrise/Clothing/Sponsor/Head/m86.rsi
    layers:
    - state: icon
    - state: icon-flash
      map: [ light ]
      visible: false
      shader: unshaded
  - type: Clothing
    sprite: _Sunrise/Clothing/Sponsor/Head/m86.rsi
    clothingVisuals:
      head:
      - state: off-equipped-HELMET
  - type: ToggleableVisuals
    spriteLayer: light
    clothingVisuals:
      head:
      - state: on-equipped-HELMET
        shader: unshaded
  - type: HandheldLight
    addPrefix: false
  - type: PressureProtection
    highPressureMultiplier: 0.45
    lowPressureMultiplier: 10000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.8

- type: entity
  parent: [ ClothingOuterEVASuitBaseToggleable, BaseMedicalContraband ]
  id: SunriseSponsorClothingOuterEVASuitFsb
  name: Far Star EVA suit
  description: The standard-issue EVA suit aboard Far Star Biotech vessels, with dark blue plating, white shoulders and cyan indicators. It comes with two cupholders.
  categories: [ SponsorExclusive ]
  components:
  - type: Sprite
    sprite: _Sunrise/Clothing/Sponsor/OuterClothing/fsb_voidsuit.rsi
    state: icon
  - type: Clothing
    sprite: _Sunrise/Clothing/Sponsor/OuterClothing/fsb_voidsuit.rsi
  - type: Appearance
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
    requireActivated: false
  - type: Pierceable
    level: Metal
  - type: Armor
    modifiers:
      coefficients:
        Heat: 0.9
        Radiation: 0.75
        Caustic: 0.5
  - type: GroupExamine
  - type: ItemToggleExaminableStatus
  - type: ItemToggle
    onUse: false
    soundActivate:
      path: "/Audio/Items/flashlight_on.ogg"
    soundDeactivate:
      path: "/Audio/Items/flashlight_off.ogg"
  - type: ItemToggleActiveSound
    activeSound:
      path: "/Audio/Effects/Vehicle/ambulancesiren.ogg"
      params:
        volume: -4
  - type: UseDelay
    delay: 1.0
  - type: ToggleClothing
    action: ActionToggleParamedicSiren
  - type: ItemTogglePointLight
  - type: PointLight
    enabled: false
    radius: 2
    energy: 2
    color: blue
    lightMask: ConeDouble
  - type: RotatingLight
    speed: 360
  - type: Tag
    tags: [ Hardsuit ]
  - type: ToggleableClothing
    clothingPrototype: SunriseSponsorClothingHeadHelmetHardsuitFSB

- type: entity
  parent: [ ClothingHeadSuitWithLightBase, ClothingHeadEVAHelmetBase ]
  id: SunriseSponsorClothingHeadHelmetHardsuitFSB
  name: Far Star EVA helmet
  description: A sealed helmet that completes the Far Star EVA suit.
  categories: [ HideSpawnMenu ]
  components:
