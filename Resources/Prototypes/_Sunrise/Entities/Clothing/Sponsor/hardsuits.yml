    sprite: _Sunrise/Clothing/Sponsor/Head/fsb_eva_helmet.rsi
    layers:
    - state: icon
    - state: icon-flash
      map: [ light ]
      visible: false
      shader: unshaded
  - type: Clothing
    sprite: _Sunrise/Clothing/Sponsor/Head/fsb_eva_helmet.rsi
    clothingVisuals:
      head:
      - state: off-equipped-HELMET
  - type: ToggleableVisuals
    spriteLayer: light
    clothingVisuals:
      head:
      - state: on-equipped-HELMET
        shader: unshaded
  - type: HandheldLight
    addPrefix: false
  - type: Armor
    modifiers:
      coefficients:
        Heat: 0.9
        Radiation: 0.75
  - type: Tag
    tags: [ HelmetEVA ]

