  - type: Sprite
    sprite: _Sunrise/Clothing/Sponsor/Head/darkhood.rsi
    state: icon
  - type: Clothing
    sprite: _Sunrise/Clothing/Sponsor/Head/darkhood.rsi
  - type: HideLayerClothing
