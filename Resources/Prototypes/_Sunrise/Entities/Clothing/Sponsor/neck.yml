- type: entity
  parent: [ ClothingNeckBase, BaseFoldable ]
  id: SunriseSponsorClothingNeckDarkCloakVClose
  name: dark cloak
  description: A long, loose garment the color of night that flows elegantly around the figure, adding an air of mystery.
  categories: [ SponsorExclusive ]
  components:
  - type: Sprite
    sprite: _Sunrise/Clothing/Sponsor/Neck/darkcloakclose.rsi
    layers:
    - state: icon
      map: [ unfoldedLayer ]
    - state: icon-open
      map: [ foldedLayer ]
      visible: false
  - type: Clothing
    sprite: _Sunrise/Clothing/Sponsor/Neck/darkcloakclose.rsi
  - type: ToggleableClothing
    clothingPrototype: SunriseSponsorClothingHeadDarkHoodV
    slot: head
    verbText: toggle-clothing-verb-hood
    requiredSlot: [ neck ]
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot {}
  - type: FoldableClothing
    foldedEquippedPrefix: open
    foldedHeldPrefix: open
  - type: Foldable
    canFoldInsideContainer: true
    unfoldVerbText: fold-zip-verb
    foldVerbText: fold-unzip-verb

- type: entity
  parent: ClothingHeadHatHoodWinterBase
  id: SunriseSponsorClothingHeadDarkHoodV
  name: dark cloak hood
  description: Deep and soft as a shadow, it frames the face with a sense of cozy mystery. It perfectly complements the cloak, giving its wearer the look of a mysterious wanderer.
  categories: [ HideSpawnMenu ]
