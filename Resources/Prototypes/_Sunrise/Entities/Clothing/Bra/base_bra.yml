- type: entity
  abstract: true
  parent: Clothing
  id: ClothingBraBase
  components:
  - type: Clothing
    slots: [bra]
  - type: Item
    size: Tiny
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: Sprite
    state: icon

- type: entity
  abstract: true
  parent: ClothingBraBase
  id: ClothingBraBaseButcherable
  components:
  - type: Butcherable
    butcheringType: Knife
    spawned:
    - id: MaterialCloth1
      amount: 1
  - type: PhysicalComposition
    materialComposition:
      Cloth: 50
  - type: Tag
    tags:
    - ClothMade
    - Recyclable

- type: entity
  abstract: true
  parent: ClothingBraBaseButcherable
  id: ClothingBraStorageBase
  components:
  - type: ItemSlots
    slots:
      storagebase:
        insertSound:
          collection: EquipSounds
          params:
            maxDistance: 3
        whitelist:
          sizes:
          - Tiny
  - type: ContainerContainer
    containers:
      storagebase: !type:ContainerSlot
