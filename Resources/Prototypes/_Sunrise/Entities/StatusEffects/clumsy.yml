    clumsySound: *ReptilianScream
  - type: ClumsyGunStatusEffect
    clumsySound: *ReptilianScream
    failDamage:
      types:
        Blunt: 2
        Piercing: 7
        Heat: 0.75
        Shock: 0.75
        Cold: 0.75
        Caustic: 0.75
  - type: ClumsyInjectorStatusEffect
    clumsySound: *ReptilianScream
  - type: ClumsyVaultStatusEffect
    clumsySound: *ReptilianScream
