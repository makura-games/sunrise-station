- type: entity
  parent: StatusEffectClumsyAll
  id: StatusEffectClumsyArtifact
  name: artifact clumsy
  components:
  - type: ClumsyGunStatusEffect
    failDamage:
      types:
        Blunt: 3
        Piercing: 7
        Heat: 0.75
        Shock: 0.75
        Cold: 0.75
        Caustic: 0.75

- type: entity
