- type: entity
  id: RandomFleshAnomalySpawner
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: Structures/Specific/anomaly.rsi
      state: anom5
  - type: RandomSpawner
    prototypes:
    - AnomalyFlesh
    rarePrototypes:
    - AnomalyClown
    rareChance: 0.20
    offset: 0.15

- type: entity
  id: MetusRandomAnomalySpawner
  parent: RandomAnomalySpawner
  name: random anomaly spawner (without shadow)
  suffix: Metus
  components:
  - type: RandomSpawner
    chance: 1
    prototypes:
    - AnomalyPyroclastic
    - AnomalyGravity
    - AnomalyElectricity
    - RandomFleshAnomalySpawner
    - AnomalyBluespace
    - AnomalyIce
    - RandomRockAnomalySpawner
    - AnomalyLiquid
    - AnomalyFlora
    # AnomalyShadow excluded
    - AnomalyTech
    - AnomalySanta
    - AnomalyBanana
    rareChance: 0.3
    rarePrototypes:
    - MetusRandomAnomalyInjectorSpawner
    offset: 0.15

- type: entity
  id: MetusRandomAnomalyInjectorSpawner
  parent: RandomAnomalyInjectorSpawner
  name: random anomaly injector spawner (without shadow)
  suffix: Metus
  components:
  - type: RandomSpawner
    prototypes:
    - AnomalyTrapPyroclastic
    - AnomalyTrapElectricity
    # AnomalyTrapShadow excluded
    - AnomalyTrapIce
    - AnomalyTrapFlora
    - AnomalyTrapBluespace
    - AnomalyTrapFlesh
    - AnomalyTrapGravity
    - AnomalyTrapTech
    - AnomalyTrapRock
    - AnomalyTrapSanta
    chance: 1

- type: entity
  name: temporary radiation
  id: RadiationTemporary
  categories: [ HideSpawnMenu ]
  components:
  - type: RadiationSource
    intensity: 2
    slope: 0.1 #should affect the entire room
  - type: TimedDespawn
    lifetime: 50
  - type: PointLight
    color: "#13FF4B" #tritum green
    energy: 1
    falloff: 10
    radius: 10
    softness: 1
  - type: EmitSoundOnSpawn
    sound:
      collection:
        RadiationPulse