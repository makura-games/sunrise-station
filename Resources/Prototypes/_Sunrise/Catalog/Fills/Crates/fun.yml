- type: entity
  id: CrateFunSprayPaints
  name: spray paint crate
  description: a crate filled with spray paint.
  parent: CratePlastic
  suffix: Spray Paint
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: SprayPaintBlue
          amount: 2
          prob: 0.33
        - id: SprayPaintRed
          amount: 2
          prob: 0.33
        - id: SprayPaintOrange
          amount: 2
          prob: 0.33
        - id: SprayPaintBlack
          amount: 2
          prob: 0.33
        - id: SprayPaintGreen
          amount: 2
          prob: 0.33
        - id: SprayPaintPurple
          amount: 2
          prob: 0.33
        - id: SprayPaintWhite
          amount: 2
          prob: 0.33
        - id: DeathPaint
          amount: 2
        - id: DeathPaintTwo
          amount: 2

- type: entity
  id: CrateGreytide
  parent: CrateGenericSteel
  name: greytide crate
  description: A crate with greytide things.
  suffix: DEBUG
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: TiderLathe
        - id: FireBomb
          amount: 3
        - id: MaterialCardboard
        - id: CableApcStack
        - id: JugWeldingFuel
        - id: ClothingBackpackDuffelGreytideMaterials
        - id: ClothingBeltUtilityFilled
        - id: ToolboxElectricalFilled
        - id: ToolboxMechanicalFilled
        - id: ClothingHeadHatWelding
        - id: BoxLightbulb
        - id: SheetPlasteel
        - id: MaterialWoodPlank
        - id: ModularReceiver

- type: entity
  id: CrateGreytideMakeshiftWeapons
  parent: CrateGreytide
  name: greytide makeshift weapons crate
  description: A greytide crate with up to five random makeshift weapons.
  suffix: Makeshift Weapons
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - !type:GroupSelector
          rolls: !type:RangeNumberSelector
            range: 3, 5
          children:
          - id: WeaponPistolMakeshiftCrafted
          - id: WeaponRevolverMakeshift
          - id: WeaponShotgunImprovisedLoaded
          - id: WeaponSubMachineGunMakeshift
          - id: WeaponSniperMakeshift

