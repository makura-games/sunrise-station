- type: entity
  id: CrateNPCVariantCubeBoxSunrise
  parent: CrateGenericSteel
  name: monkey cube crate
  description: A crate containing single box of monkey cubes.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: VariantCubeBoxSunrise

- type: entity
  parent: CrateMedicalSecure
  id: SunriseCrateEpidemicResponse
  name: epidemic response crate
  description: Swabs, suppressants and protective masks for an outbreak.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: SunriseDiseaseSwab
          amount: 10
        - id: SunrisePillCanisterAntimicrobial
          amount: 2
        - id: SunrisePillCanisterAntitussive
        - id: BoxSterileMask
          amount: 2
        # Сырьё вакцинатора: его же можно намолоть в биореклаймере, но на старте вспышки взять негде.
        - id: MaterialBiomass
        # Чашки для культур: исследование штамма без живых больных.
        - id: SunrisePetriDishBox
        # Полевой набор: найти очаг и погасить его, не возвращаясь в лабораторию.
        - id: SunriseDiseaseScanner
        - id: SunriseDiseaseSprayer

- type: entity
  parent: CrateMedicalSecure
  id: SunriseCrateMedicalManualHealingDebug
  name: manual medicine debug crate
  description: Contains manual-use healing items for debugging.
  suffix: Debug
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: Ointment
        - id: RegenerativeMesh
        - id: Brutepack
        - id: MedicatedSuture
        - id: Bloodpack
        - id: Gauze
        - id: Blueointment20
        - id: Bluebrutepack20
        - id: RedOintment
        - id: SyndicateOintment
        - id: RedBrutePack
        - id: SyndicateBrutePack
        - id: RedPunctPack
        - id: RedLacePack
        - id: RedBruizPack
