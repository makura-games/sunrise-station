# Debug suffix instead of category
# so that there is a chance that the item will drop from the artifact as one of the rare rewards
# the debug boxes of furs themselves are not something OP

- type: entity
  parent: CrateScience
  id: SunriseCrateDurandAssembly
  name: Durand assembly crate
  description: A crate containing everything needed to assemble a Durand mech, including tools and welding protection.
  suffix: Debug
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: DurandHarness
        - id: DurandHead
        - id: DurandLArm
        - id: DurandRArm
        - id: DurandLLeg
        - id: DurandRLeg
        - id: MicroManipulatorStockPart
          amount: 5
        - id: CableApcStack10
        - id: CableMVStack10
        - id: Flash
          amount: 2
        - id: SheetRUGlass1
        - id: DurandCentralElectronics
        - id: DurandPeripheralsElectronics
        - id: DurandTargetingElectronics
        - id: PowerCageSmall
        - id: MechAirTank
        - id: MechThruster
        - id: SheetPlasteel10
        - id: DurandArmorPlate
        - id: ToolboxMechanicalFilledAllTools
        - id: ClothingHeadHatWelding

