- type: entity
  name: cardboard box
  parent: BoxBase
  id: BoxSurvivalBase
  abstract: true
  description: A cardboard box for storing things.
  components:
  - type: Item
    size: Large
    shape:
    - 0,0,2,1
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,2,2

- type: entity
  name: survival box
  parent: BoxCardboardSmall
  id: BoxRepairSynth
  description: It's a box with basic internals inside.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: Welder
        - id: CableApcStack
  - type: Sprite
    layers:
      - state: box_science
      - state: flare

- type: entity
  name: survival box
  parent: BoxCardboardSmall
  id: BoxHugSynth
  description: It's a box with basic internals inside.
  components:
  - type: Sprite
    layers:
    - state: box_hug
    - state: heart
  - type: Item
    heldPrefix: hug
  - type: Tag
    tags:
    - BoxHug
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: Welder
        - id: CableApcStack

- type: entity
  name: survival box
  parent: BoxSurvivalBase
  id: BoxRepairSecurity
  description: It's a box with basic internals inside.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingMaskGasSecurity
        - id: Welder
        - id: CableApcStack
        - id: Flare
  - type: Sprite
    layers:
    - state: box_science
    - state: flare

- type: entity
  name: survival box
  parent: BoxSurvivalBase
