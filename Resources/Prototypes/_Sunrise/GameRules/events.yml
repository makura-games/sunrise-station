- type: entity
  parent: BaseGameRule
  id: RevolutionarySmugglerStashSpawn
  components:
  - type: StationEvent
    earliestStart: 0
    duration: 1
    minimumPlayers: 1
    weight: 0
  - type: RandomSpawnRule
    prototype: RevolutionarySmugglerStash

- type: entity
  id: VentbullMigration
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    weight: 5
    duration: null
  - type: VentCrittersRule
    entries:
    - id: MobPibbleVent
      prob: 0.03

- type: entity
  parent: BaseAntagGhostRoleRule
  id: AbductorsSpawn
  components:
  - type: StationEvent
    earliestStart: 15
    weight: 7.5
    minimumPlayers: 10
    duration: 1
  - type: RuleGrids
  - type: LoadMapRule
    gridPath: /Maps/_Sunrise/Shuttles/Antag/abductor_shuttle.yml
  - type: AntagObjectives
    objectives:
    - AbductObjective
  - type: AntagSpawner # Sunrise-todo: починить AntagLoadProfileRule для бубукторов
    prototype: MobAbductor
  - type: AntagSelection
    antags:
    - !type:FixedAntagCount
      proto: SunriseAbductorScientist
    - !type:FixedAntagCount
      proto: SunriseAbductorAgent
  - type: DynamicRuleCost
    cost: 100

- type: entity
  id: AbductorVictim
  parent: BaseGameRule
  components:
  - type: AntagObjectives
    objectives:
    - AbductorEscapeShuttleObjective
  - type: AntagRandomObjectives
    sets:
    - groups: AbductorObjectiveGroups
      maxPicks: 1
    maxDifficulty: 10
  - type: GameRule
    minPlayers: 1
  - type: AbductorVictimRule
  - type: AntagSelection
    antags:
    - !type:FixedAntagCount
      proto: SunriseAbductorVictim
  - type: DynamicRuleCost
    cost: 70

