- type: antagSpecifier
  parent: BaseAntagSpecifier
  id: SunriseAbductorScientist
  pickPlayer: false
  spawnerPrototype: AbductorScientistSpawner
  startingGear: AbductorScientistGear
  briefing:
    text: abductor-role-greeting
    color: Green
    sound: /Audio/_Sunrise/Abductor/abductor.ogg
  components:
  - type: Abductor
  - type: Muted
  - type: AbductorScientist
  - type: ActionGrant
    actions:
    - ActionReturnToShip
  - type: Tag
    tags:
    - Abductor
    - AbductorScientist
    - CanPilot
    - DoorBumpOpener
    - FootstepSound
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  mindRoles:
  - MindRoleLoneAbductor

