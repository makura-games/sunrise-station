- type: antagSpecifier
  parent: BaseAntagSpecifier
  id: SunriseAssaultCommander
  prefRoles: [ AssaultCommander ]
  fallbackRoles: [ AssaultOperative ]
  spawnerPrototype: SpawnPointAssaultOpsCommander
  startingGear: AssaultCommanderGear
  roleLoadout:
  - RoleSurvivalAssaultOps
  components:
  - type: GhostPanelAntagonistMarker
    name: assaultops-title
    description: assaultops-ghostpanel-commander
    priority: 85
  - type: AssaultOperative
  - type: NpcFactionMember
    factions:
    - Syndicate
  - type: RandomMetadata
    nameSegments:
    - NamesFirst
    - NamesLast
    nameFormat: name-format-standard
  mindRoles:
  - MindRoleAssaultCommander

- type: antagSpecifier
  parent: BaseAntagSpecifier
  id: SunriseAssaultOperative
  prefRoles: [ AssaultOperative ]
  fallbackRoles: [ AssaultCommander ]
  spawnerPrototype: SpawnPointAssaultOpsOperative
  startingGear: AssaultOperativeGear
  roleLoadout:
  - RoleSurvivalAssaultOps
  components:
  - type: GhostPanelAntagonistMarker
    name: assaultops-title
    description: assaultops-ghostpanel-operative
    priority: 85
  - type: AssaultOperative
  - type: NpcFactionMember
    factions:
    - Syndicate
  - type: RandomMetadata
    nameSegments:
    - NamesFirst
    - NamesLast
    nameFormat: name-format-standard
  mindRoles:
  - MindRoleAssaultOperative

- type: entity
  id: AssaultOps
  parent: BaseGameRule
  components:
  - type: GameRule
    minPlayers: 40
    minCommandStaff: 3
  - type: AssaultOpsRule
    faction: Syndicate
  - type: LoadMapRule
    gridPath: /Maps/_Sunrise/Shuttles/Antag/assaultops.yml
  - type: RuleGrids
  - type: AntagLoadProfileRule
    speciesOverride: Human
    speciesOverrideBlacklist:
    - Vox
    - Felinid
    - Diona
    - HumanoidXeno
    - Predator
  - type: AntagSelection
    selectionTime: PrePlayerSpawn
    antags:
    - !type:FixedAntagCount
      proto: SunriseAssaultCommander
    - !type:LinearAntagCount
      proto: SunriseAssaultOperative
      playerRatio: 15
      range:
        min: 1
        max: 5
