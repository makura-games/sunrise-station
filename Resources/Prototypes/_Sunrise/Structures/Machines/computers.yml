- type: entity
  parent: BaseComputer
  id: BaseComputerSunrise
  abstract: true
  name: computer
  components:
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
    layers:
    - map: [ "computerLayerBody" ]
      state: computer
    - map: [ "computerLayerKeyboard" ]
      state: generic_keyboard
    - map: [ "computerLayerScreen" ]
      sprite: _Sunrise/Structures/Machines/computers.rsi
      state: generic
    - map: [ "computerLayerKeys" ]
      sprite: _Sunrise/Structures/Machines/computers.rsi
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open

- type: entity
  parent: BaseComputer
  id: BaseComputerSunriseUniqueFrame
  abstract: true
  name: computer
  components:
  - type: Sprite
    sprite: _Sunrise/Structures/Machines/computers.rsi
    layers:
    - map: [ "computerLayerBody" ]
      state: computer
    - map: [ "computerLayerKeyboard" ]
      state: generic_keyboard
    - map: [ "computerLayerScreen" ]
      state: icarus
    - map: [ "computerLayerKeys" ]
      state: icarus_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: GenericVisualizer
    visuals:
      enum.ComputerVisuals.Powered:
        computerLayerScreen:
          True: { visible: true, shader: unshaded }
          False: { visible: false }
        computerLayerKeys:
          True: { visible: true, shader: unshaded }
          False: { visible: true, shader: shaded }
      enum.WiresVisuals.MaintenancePanelState:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: false }
          False: { visible: true }

- type: entity
  id: BaseComputerShipyard
  abstract: true
  parent: BaseComputerSunrise
  name: shipyard console
  description: Used to purchase and sell shuttles
  components:
  - type: ActivatableUI
    key: enum.ShipyardConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ShipyardConsoleUiKey.Key:
        type: ShipyardConsoleBoundUserInterface
  - type: Computer
    board: null
  - type: Construction
    graph: SunriseShipyardComputer
    node: computer
    deconstructionTarget: null
    containers:
    - board
  - type: Repairable
    doAfterDelay: 10
    allowSelfRepair: false
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Breakage" ]
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#b89f25"
  - type: ShipyardConsole
    account: Cargo
    vesselGroup: station
    announcementChannel: Supply
  - type: ContainerContainer
    containers:
      board: !type:Container
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      sprite: _Sunrise/Structures/Machines/computers.rsi
      state: request
    - map: ["computerLayerKeys"]
      sprite: _Sunrise/Structures/Machines/computers.rsi
      state: tech_key
    - map: ["enum.ShipyardConsoleVisualLayers.Broken"]
      state: broken
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.ShipyardConsoleVisuals.Broken:
        enum.ShipyardConsoleVisualLayers.Broken:
          True: { visible: true }
          False: { visible: false }

