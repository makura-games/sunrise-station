- type: entity
  id: ImplantExtractor
  parent: BaseMachinePowered
  name: microwave implant extractor
  description: A high-tech device specifically designed for implant extraction in conditions with low-skilled medical personnel.
  components:
  - type: Interrogator
  - type: Sprite
    sprite: _Sunrise/Structures/Machines/interrogator.rsi
    snapCardinals: true
    layers:
    - state: base
      map: [ "enum.InterrogatorVisualLayers.Base" ]
    - state: extraction-on
      map: [ "enum.InterrogatorVisualLayers.Extract" ]
      visible: false
  - type: PointLight
    color: "#3a807f"
    radius: 2
    energy: 10
    enabled: false
  - type: Physics
    bodyType: Static
  - type: Construction
    graph: Machine
    node: machine
    containers:
    - machine_board
    - machine_parts
    - body_container
  - type: EmptyOnMachineDeconstruct
    containers:
    - body_container
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StrongMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Machine
    board: InterrogatorMachineCircuitboard
  - type: WiresPanel
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: Appearance
  - type: ContainerContainer
    containers:
      body_container: !type:ContainerSlot
      machine_board: !type:Container
      machine_parts: !type:Container

- type: entity
  id: Interrogator
  parent: ImplantExtractor
  name: interrogator
  description: apchy
  components:
  - type: Interrogator
  - type: Machine
    board: InterrogatorMachineCircuitboard

- type: entity
  id: InterrogatorMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: interrogator machine board
  description: A machine printed circuit board for a interrogator.
  components:
  - type: Sprite
    state: medical
  - type: MachineBoard
    prototype: Interrogator
    stackRequirements:
      Manipulator: 4
      Glass: 1
      Cable: 1

- type: entity
  id: BaseShower
  name: shower
  description: A simple shower. It just stands there.
  placement:
    mode: SnapgridCenter
    snap:
    - Wallmount
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _Sunrise/Structures/Specific/shower.rsi
    layers:
    - state: icon
      map: ["enum.ShowerVisualLayers.Base"]
    - state: water
      map: ["enum.ShowerVisualLayers.Water"]
      visible: false
      shader: unshaded
  - type: Shower
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ShowerVisuals.Active:
        enum.ShowerVisualLayers.Water:
          True: { visible: true }
          False: { visible: false }
  - type: Physics
    bodyType: Static
  - type: WallMount
  - type: Anchorable
  - type: Rotatable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Drain
  - type: Construction
    graph: Shower
    node: shower
