- type: gameMap
  id: SunriseGelta
  mapName: 'Gelta'
  mapPath: /Maps/_Sunrise/Station/OutPool/gelta.yml
  maxRandomOffset: 0
  randomRotation: false
  minPlayers: 65
  stations:
    Gelta:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Гельта {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'TG'
        - type: SpawnGridAndDockToStation
          grids:
          - gridPath: /Maps/_Sunrise/Shuttles/Security/mosquitt.yml
            priorityTag: DockSecurity
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/_Sunrise/Shuttles/Evac/emergency-centipede.yml
        - type: StationJobs
          availableJobs: # 91-115 jobs total w/o latejoins & interns, 106-132 jobs total w/ latejoins & interns
