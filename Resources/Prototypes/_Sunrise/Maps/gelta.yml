            Reporter: [ 2, 2 ]
            Barber: [ 1, 1 ]
            #engineering (10)
            ChiefEngineer: [ 1, 1 ]
            SeniorEngineer: [ 1, 1 ]
            AtmosphericTechnician: [ 3, 3 ]
            StationEngineer: [ 5, 5 ]
            TechnicalAssistant: [ 4, 4 ] # intern, exclude from dept count
            #medical (13-14)
