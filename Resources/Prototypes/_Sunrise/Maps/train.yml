- type: gameMap
  id: SunriseTrain
  mapName: 'Train'
  mapPath: /Maps/_Sunrise/Station/train.yml
  maxRandomOffset: 0
  randomRotation: false
  minPlayers: 0
  maxPlayers: 60
  stations:
    Train:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Train "Sentipode" {0}-{1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'ED'
        - type: SpawnGridAndDockToStation
          grids:
          - gridPath: /Maps/_Sunrise/Shuttles/Salvage/asteroidcracker.yml
            priorityTag: DockMining
          - gridPath: /Maps/_Sunrise/Shuttles/Security/mosquitt.yml
            priorityTag: DockSecurity
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/_Sunrise/Shuttles/Evac/emergency.yml
        - type: StationJobs
          availableJobs: # 53 jobs total w/o latejoins & interns, 65 jobs total w/ latejoins & interns
            #command (7)
            Captain: [ 1, 1 ]
            HeadOfPersonnel: [ 1, 1 ]
            HeadOfSecurity: [ 1, 1 ]
            ChiefMedicalOfficer: [ 1, 1 ]
            ChiefEngineer: [ 1, 1 ]
            ResearchDirector: [ 1, 1 ]
            Quartermaster: [ 1, 1 ]
            Adjutant: [ 1, 1 ]
            NanoTrasenRepresentative: [ 1, 1 ]
            ComMaid: [ 1, 1 ]
            #service (11 - 12)
            Bartender: [ 1, 1 ]
            Botanist: [ 2, 2 ]
            Chef: [ 1, 1 ]
            Janitor: [ 2, 2 ]
            Chaplain: [ 1, 1 ]
            Librarian: [ 1, 1 ]
            ServiceWorker: [ 2, 3 ]
            Reporter: [ 1, 1 ]
            Barber: [ 1, 1 ]
            #engineering (7)
            SeniorEngineer: [ 1, 1 ]
            AtmosphericTechnician: [ 2, 2 ]
            StationEngineer: [ 4, 4 ]
            TechnicalAssistant: [ 3, 3 ] #intern, not counted
            #medical (5)
            SeniorPhysician: [ 1, 1 ]
            Chemist: [ 2, 2 ]
            MedicalPathologist: [ 1, 1 ]
            MedicalDoctor: [ 2, 2 ]
            MedicalIntern: [ 2, 2 ] #intern, not counted
            Paramedic: [ 1, 1 ]
            Psychologist: [ 1, 1 ]
            #science (4)
            SeniorResearcher: [ 1, 1 ]
            Roboticist: [ 2, 3 ]
            Scientist: [ 4, 4 ]
            ResearchAssistant: [ 2, 2 ] #intern, not counted
            #security (9 - 10)
            Warden: [ 1, 1 ]
            SeniorOfficer: [ 1, 1 ]
            Brigmedic: [ 1, 2 ]
            SecurityOfficer: [ 6, 6 ]
            SecurityCadet: [ 3, 3 ] #intern, not counted
            Detective: [ 1, 1 ]
            SecurityPilot: [ 1, 1 ]
            #supply (6)
            SalvageSpecialist: [ 3, 3 ]
            CargoTechnician: [ 3, 3 ]
            MailCarrier: [ 1, 2 ]
            MiningSpecialist: [ 1, 1 ]
            #civilian (3+)
            Passenger: [ -1, -1 ] #infinite, not counted
            Clown: [ 1, 1 ]
            Mime: [ 1, 1 ]
            Musician: [ 1, 1 ]
            #blueshield (1)
            BlueShieldOfficer: [ 1, 1 ]
            #law (3)
            IAA: [ 1, 1 ]
            Lawyer: [ 1, 2 ]
            #silicon (2)
            Borg: [ 2, 2 ]
            JanitorBorg: [ 1, 1 ]
            ServiceBorg: [ 1, 1 ]
            ClownBorg: [ 1, 1 ]
            PeaceBorg: [ 1, 1 ]
