- type: constructionGraph
  id: KammererUpgrade
  start: kammerer
  graph:
  - node: kammerer
    entity: WeaponShotgunKammererEmpty

  - node: specialKitStart
    entity: KammererSpecialUpgradeKit
    edges:
    - to: specialWeaponInserted
      steps:
      - tag: WeaponShotgunKammererBase
        name: construction-graph-tag-kammerer-base
        store: kammerer-special-weapon

  - node: specialWeaponInserted
    edges:
    - to: specialOpened
      steps:
      - tool: Screwing
        doAfter: 2

  - node: specialOpened
    edges:
    - to: specialBarrelInserted
      steps:
      - tag: ModularBarrel
        name: crafting-menu-name-MB
        store: kammerer-special-barrel

  - node: specialBarrelInserted
    edges:
    - to: specialWelded
      steps:
      - tool: Welding
        doAfter: 2

  - node: specialWelded
    edges:
    - to: special
      steps:
      - tool: Screwing
        doAfter: 2

  - node: special
    entity: WeaponShotgunKammererSpecialEmpty
    edges:
    - to: specialKitStart
      conditions:
      - !type:ContainerNotEmpty
        container: kammerer-special-weapon
      steps:
      - tool: Screwing
        doAfter: 2
      - tool: Welding
        doAfter: 2
      - tool: Screwing
        doAfter: 2
      completed:
      - !type:EmptyContainer
        container: kammerer-special-barrel
        pickup: true
      - !type:EmptyContainer
        container: kammerer-special-weapon
        pickup: true

  - node: trenchKitStart
    entity: KammererTrenchUpgradeKit
