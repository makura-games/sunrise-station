    - to: trenchOpened
      steps:
      - tool: Screwing
        doAfter: 1

  - node: trenchOpened
    edges:
    - to: trenchCut
      steps:
      - tool: Cutting
        doAfter: 2

  - node: trenchCut
    edges:
