    - node: drozdKitInserted
      edges:
        - to: drozdOpened
          steps:
            - tool: Screwing
              doAfter: 1

    - node: drozdOpened
      edges:
        - to: drozdMagazineInserted
          steps:
            - tag: MagazineP90Empty
              name: construction-graph-tag-magazine-p90-empty
              store: drozd-p90-magazine

    - node: drozdMagazineInserted
      edges:
        - to: drozdRechambered
          steps:
            - tool: Anchoring
              doAfter: 2

    - node: drozdRechambered
      edges:
        - to: drozdCut
          steps:
            - tool: Cutting
              doAfter: 2

    - node: drozdCut
      edges:
        - to: upgradedrozd
          steps:
            - tool: Screwing
              doAfter: 1
          completed:
            - !type:AdminLog
              message: "Converted Drozd to Drozd Mk2"
              impact: High

    - node: upgradedrozd
      entity: WeaponSubMachineGunDrozdMk2Empty
      edges:
        - to: start
          steps:
            - tool: Screwing
              doAfter: 1
            - tool: Cutting
              doAfter: 2
            - tool: Anchoring
              doAfter: 2
            - tool: Screwing
              doAfter: 1
          completed:
            - !type:EmptyContainer
              container: drozd-upgrade-kit
              pickup: true
            - !type:EmptyContainer
              container: drozd-p90-magazine
              pickup: true

- type: constructionGraph
  id: UpgradeArmorVest
  start: start
  graph:
    - node: start
      entity: ClothingOuterArmorBasic
      edges:
        - to: plate
          steps:
            - tag: UpgradeKitPlate
              name: construction-graph-tag-pltvest
              doAfter: 5
        - to: stab
          steps:
            - tag: UpgradeKitStab
              name: construction-graph-tag-stbvest
              doAfter: 5
        - to: heat
          steps:
            - tag: UpgradeKitHeat
              name: construction-graph-tag-absrbvest
              doAfter: 5
    - node: plate
      entity: ClothingOuterArmorPlate
      edges:
        - to: bullet
          steps:
            - tag: UpgradeKitBullet
              name: construction-graph-tag-blltvest
              doAfter: 8
    - node: bullet
      entity: ClothingOuterArmorBulletproof
      edges:
        - to: bullet_heavy
          steps:
            - tag: UpgradeKitBulletHeavy
              name: construction-graph-tag-hblltvest
              doAfter: 12
    - node: bullet_heavy
      entity: ClothingOuterArmorBulletproofHeavy
    - node: stab
      entity: ClothingOuterArmorStab
      edges:
        - to: riot
          steps:
            - tag: UpgradeKitRiot
              name: construction-graph-tag-riotvest
              doAfter: 8
    - node: riot
      entity: ClothingOuterArmorRiot
    - node: heat
      entity: ClothingOuterArmorHeatAbsorb
      edges:
        - to: reflective
          steps:
            - tag: UpgradeKitReflective
              name: construction-graph-tag-rflctvest
              doAfter: 8
    - node: reflective
      entity: ClothingOuterArmorReflective

# Gorilla Gauntlet
- type: constructionGraph
  id: UpgradeCyberGorilla
  start: start
  graph:
    - node: start
      entity: WeaponGauntletGorilla
      edges:
        - to: upgraded
          steps:
            - tag: GorillaUpgradeKit
              name: construction-graph-tag-gorilla-upgrade-kit
              doAfter: 2
    - node: upgraded
      entity: WeaponGauntletGorillaUpgraded

# Gorilla
- type: constructionGraph
  id: UpgradeCyberArmGorilla
  start: start
  graph:
    - node: start
      edges:
        - to: base_left
          steps: []
    - node: base_left
      entity: LeftArmCyberGorilla
      edges:
        - to: base_right
          steps:
            - tool: Screwing
              doAfter: 1
        - to: upgraded_left
          steps:
            - tag: WeaponPistolCHIMPUpgradeKit
              name: construction-graph-tag-weapon-pistol-chimp-upgrade-kit
            - tag: GorillaUpgradeKit
              name: construction-graph-tag-gorilla-upgrade-kit
              doAfter: 2
    - node: base_right
      entity: RightArmCyberGorilla
      edges:
        - to: base_left
          steps:
            - tool: Screwing
              doAfter: 1
        - to: upgraded_right
          steps:
            - tag: WeaponPistolCHIMPUpgradeKit
              name: construction-graph-tag-weapon-pistol-chimp-upgrade-kit
            - tag: GorillaUpgradeKit
              name: construction-graph-tag-gorilla-upgrade-kit
              doAfter: 2
    - node: upgraded_left
      entity: LeftArmCyberGorillaUpgraded
      edges:
        - to: upgraded_right
          steps:
            - tool: Screwing
              doAfter: 1
        - to: base_left
          steps:
            - tool: Prying
              doAfter: 2
    - node: upgraded_right
      entity: RightArmCyberGorillaUpgraded
      edges:
        - to: upgraded_left
          steps:
            - tool: Screwing
              doAfter: 1
        - to: base_right
          steps:
            - tool: Prying
              doAfter: 2

