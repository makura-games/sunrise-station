# Janitor borg
- type: borgType
  id: janitor

  # Sunrise-Start
  job: JanitorBorg
  # Sunrise-End

  # Description
  dummyPrototype: BorgChassisJanitor

  # Functional
  extraModuleCount: 4
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - BorgModuleJanitor

  defaultModules:
  - BorgModuleStandart
  - BorgModulePrying
  - BorgModuleCleaning
  - BorgModuleCustodial

  radioChannels:
  - Science
  - Service

  # Sunrise-Start
  footstepCollection:
    collection: FootstepJanitorBorg
    params:
      volume: -5
  # Sunrise-End

  # Visual
  inventoryTemplateId: borgShort
  spriteBodyState: janitor
  spriteBodyMovementState: janitor_moving
  spriteHasMindState: janitor_e
  spriteNoMindState: janitor_e_r
  spriteToggleLightState: janitor_l

  # Pet
  petSuccessString: petting-success-janitor-cyborg
  petFailureString: petting-failure-janitor-cyborg
  addComponents:
  - type: FootprintAreaCleaner
  - type: Absorbent
    pickupAmount: 500
  - type: Solution
    id: absorbed
    solution:
      maxVol: 500
  - type: Spillable
    solution: absorbed
  - type: RefillableSolution
    solution: absorbed

# Medical borg
- type: borgType
  id: medical

  # Sunrise-Start
  job: MedicalBorg
  # Sunrise-End

  # Description
  dummyPrototype: BorgChassisMedical

  # Functional
  extraModuleCount: 5
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - BorgModuleMedical

  defaultModules:
  - BorgModulePrying
  - BorgModuleChemical
  - BorgModuleTopicals
  - BorgModuleRescue

  radioChannels:
  - Science
  - Medical

  addComponents:
  - type: SolutionScanner
  - type: ShowHealthBars
    damageContainers:
    - Biological
  - type: ShowHealthIcons
    damageContainers:
    - Biological
  # Sunrise-Start
  - type: TTS
    voice: TurretFloor
  - type: MovementSpeedModifier
    baseWalkSpeed : 3
    baseSprintSpeed : 5
  - type: FabricateCandy
  - type: InnateItem
    instantActions:
    - HandheldStationMapUnpowered
    - HandheldEmergencyCrewMonitorBorg
    entityTargetActions:
    - HandheldHealthAnalyzer
  # Sunrise-End

  # Visual
  inventoryTemplateId: borgDutch
  spriteBodyState: medical
  spriteBodyMovementState: medical_moving
  spriteHasMindState: medical_e
  spriteNoMindState: medical_e_r
  spriteToggleLightState: medical_l

  # Pet
  petSuccessString: petting-success-medical-cyborg
  petFailureString: petting-failure-medical-cyborg

  # Sounds
  footstepCollection:
    collection: FootstepHoverBorg


