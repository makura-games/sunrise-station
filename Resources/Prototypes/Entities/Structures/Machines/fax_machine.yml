- type: entity
  parent: [ BaseMachinePowered, StructureHealthMachineWeak ]
  id: FaxMachineBase
  name: long range fax machine
  description: Bluespace technologies on the application of bureaucracy.
  components:
  - type: Sprite
    sprite: _Sunrise/Structures/Machines/fax_machine.rsi # Sunrise-Edit
    drawdepth: SmallObjects
    layers:
    - state: icon
    - state: idle
      map: [ "faxEyes" ]
    - state: printing
      map: [ "printing" ]
      visible: false
    - state:
      map: [ "enum.FaxMachineVisuals.VisualState" ]
  - type: Icon
    sprite: _Sunrise/Structures/Machines/fax_machine.rsi # Sunrise-Edit
    state: icon
  - type: Appearance
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 25
        mask:
        - TabletopMachineMask
        layer:
        - TabletopMachineLayer
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: ActivatableUI
    key: enum.FaxUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.FaxUiKey.Key:
        type: FaxBoundUi
  - type: StationAiWhitelist
  - type: ApcPowerReceiver
    powerLoad: 250
  - type: Faxecute
    damage:
      types:
        Blunt: 100
  - type: FaxMachine
    paperSlot:
      insertSound: /Audio/Machines/scanning.ogg
      ejectSound: /Audio/Machines/tray_eject.ogg
      whitelist:
        components:
          - FaxableObject #used to be PaperComponent - brainfood1183
      blacklist:
        components:
          - CargoSlip
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        faxEyes:
          True: { visible: true }
          False: { visible: false }
      enum.FaxMachineVisuals.VisualState:
        printing:
          Printing: { visible: true }
          Normal: { visible: false }
        enum.FaxMachineVisuals.VisualState:
          Inserting: { visible: true }
          Normal: { visible: false }
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      Paper: !type:ContainerSlot
  - type: DeviceNetworkRequiresPower
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: Fax
    transmitFrequencyId: Fax
  - type: RequireProjectileTarget

# Special
- type: entity
  parent: FaxMachineBase
  id: FaxMachineCentcom
  name: CentComm long range fax machine
  suffix: CentCom
  components:
  - type: Sprite
    layers:
    - state: icon
      color: "#bfe3ff"
    - state: idle
      map: [ "faxEyes" ]
    - state: printing
      map: [ "printing" ]
      visible: false
    - state:
      map: [ "enum.FaxMachineVisuals.VisualState" ]
  - type: FaxMachine
    name: "Central Command"
    notifyAdmins: true
    receiveStationGoal: true # Sunrise-StationGoal

- type: entity
  parent: FaxMachineBase
  id: FaxMachineSyndie
  name: syndicate long range fax machine
  suffix: Syndicate
  components:
  - type: Sprite
    layers:
    - state: icon
      color: "#a3a3a3"
    - state: idle
      map: [ "faxEyes" ]
    - state: printing
      map: [ "printing" ]
      visible: false
    - state:
      map: [ "enum.FaxMachineVisuals.VisualState" ]
  - type: FaxMachine
    name: "ERR*?*%!"
    responsePings: false
    notifyAdmins: true
  - type: Emagged
    emagType: Interaction

- type: entity
  parent: FaxMachineBase
  id: FaxMachineCaptain
  name: captain long range fax machine
  suffix: NukeCodes
  components:
    - type: FaxMachine
      name: "Captain's Office"
      receiveNukeCodes: true
      receiveStationGoal: true # Sunrise-StationGoal
    - type: StealTarget
      stealGroup: FaxMachineCaptain

# sunrise-start
# handled_fax
- type: entity
  name: handheld_FaxBase
  parent: BaseItem
  id: HandheldFaxBase
  description: Portable fax.
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _Sunrise/Structures/Machines/fax_machine.rsi # Sunrise-Edit
    drawdepth: SmallObjects
    layers:
    - state: icon
      map: [ "enum.FaxMachineVisuals.VisualState" ]
  - type: Icon
    sprite: _Sunrise/Structures/Machines/fax_machine.rsi # Sunrise-Edit
    state: icon
  - type: Appearance
  - type: ActivatableUI
    key: enum.FaxUiKey.Key
  - type: UserInterface
    interfaces:
      enum.FaxUiKey.Key:
        type: FaxBoundUi
  - type: ApcPowerReceiver
    needsPower: false
    powerLoad: 250
  - type: FaxMachine
    paperSlot:
      insertSound: /Audio/Machines/scanning.ogg
      ejectSound: /Audio/Machines/tray_eject.ogg
      whitelist:
        components:
          - FaxableObject
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.FaxMachineVisuals.VisualState:
          True: { state: idle }
          False: { state: icon }
      enum.FaxMachineVisuals.VisualState:
        enum.FaxMachineVisuals.VisualState:
          Printing: { state: printing }
          Normal: {state: idle}
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: Fax
    transmitFrequencyId: Fax
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      Paper: !type:ContainerSlot


- type: entity
  name: Handheld fax
  parent: HandheldFaxBase
  id: HandheldFax
  components:
  - type: FaxMachine
    name: "Representative"
  - type: Sprite
    sprite: _Sunrise/Objects/Devices/handled_fax.rsi
    drawdepth: SmallObjects
    layers:
    - state: icon
      map: [ "enum.FaxMachineVisuals.VisualState" ]
    - state: scanner
      shader: unshaded
  - type: Tag
    tags:
    - HighRiskItem
  - type: StealTarget
    stealGroup: HandheldFax
# sunrise-end
