- type: entity
  abstract: true
  parent: [ BaseStructureDynamic, StructureHealthBarrier ]
  id: PlasticFlapsBase
  placement:
    mode: SnapgridCenter
  components:
  - type: Anchorable
    flags:
    - Anchorable
  - type: Rotatable
  - type: Sprite
    sprite: Structures/Specific/plastic-flaps.rsi
    state: plasticflaps
    drawdepth: Mobs
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 100
        mask:
        - Impassable
        layer:
        - MidImpassable
  - type: Damageable
    damageModifierSet: PlasticMod
  # Sunrise-Start
  - type: ExaminableDamage
    messages: WindowMessages
  - type: Repairable
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 5
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks.rsi
  # Sunrise-End
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPlastic1:
            min: 1
            max: 3
  - type: StaticPrice
    price: 100
  - type: IconSmooth
    key: walls
    mode: NoSprite
  - type: PlacementReplacement
    key: walls
  - type: StructureAligner
  - type: StructureAlignerPylon

- type: entity
  id: PlasticFlapsClear
  parent: PlasticFlapsBase
  name: plastic flaps
  suffix: Clear
  description: Heavy duty, plastic flaps. Definitely can't get past those. No way.
  components:
  - type: Construction
    graph: PlasticFlapsGraph
    node: plasticFlaps

- type: entity
  id: PlasticFlapsOpaque
  parent: PlasticFlapsBase
  name: plastic flaps
  suffix: Opaque
  description: Heavy duty, plastic flaps. Definitely can't get past those. No way.
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 100
        mask:
        - Impassable
        layer:
        - Opaque
        - MidImpassable
  - type: Occluder
  - type: Construction
    graph: PlasticFlapsGraph
    node: opaqueFlaps

- type: entity
  id: PlasticFlapsAirtightClear
  parent: [BaseDeltaPressureGlass, PlasticFlapsBase] # Sunrise-Edit
  name: airtight plastic flaps
  suffix: Airtight, Clear
  description: Heavy duty, slightly stronger, airtight plastic flaps. Definitely can't get past those. No way.
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Airtight
  - type: StaticPrice
    price: 100
  # Sunrise-Start
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 7
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks.rsi
  # Sunrise-End

- type: entity
  id: PlasticFlapsAirtightOpaque
  parent: PlasticFlapsAirtightClear #Sunrise-edit
  name: airtight plastic flaps
  suffix: Airtight, Opaque
  description: Heavy duty, slightly stronger, airtight plastic flaps. Definitely can't get past those. No way.
  components:
  - type: Airtight
  - type: StaticPrice
    price: 100
  # Sunrise-Start
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 6.5
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks.rsi
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 100
        mask:
        - Impassable
        layer:
        - Opaque
        - MidImpassable
  - type: Occluder
  #Sunrise-end
