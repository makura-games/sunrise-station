- type: entity
  id: CarpRift
  name: carp rift
  description: A rift akin to the ones space carp use to travel long distances.
  placement:
    mode: SnapgridCenter
  components:
  - type: DragonRift
    # Sunrise-start
    spawnPrototypes:
    - MobCarpDragon
    - MobCarpHoloDragon
    - MobCarpRainbowDragon
    - MobSharkDragon
    # Sunrise-end
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Fixtures
  - type: Sprite
    layers:
    - sprite: Structures/Specific/carp_rift.rsi
      state: icon
      color: "#569fff"
      shader: unshaded
  - type: InteractionOutline
  - type: Clickable
  - type: PointLight
    enabled: true
    color: "#366db5"
    radius: 10.0
    energy: 5.0
    netsync: false
  - type: NavMapBeacon
    color: "#ff0000"
    text: carp rift
    # only show after making the announcement at 50%
    enabled: false
  - type: Damageable
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/Weapons/Guns/Gunshots/rocket_launcher.ogg
#Sunrise-start
  - type: DamageOverlay
  - type: AoEHeal
    threshold: 0.9
    damage:
      # Это немного: 160 проникающих ранений вылечатся наполовину примерно за две минуты.
      types:
        Blunt: -1
        Slash: -1
        Piercing: -2
        Heat: -1
        Shock: -1
        Cold: -1
        Caustic: -1
        Asphyxiation: -1
        Bloodloss: -1
        Poison: -1
        Radiation: -1
    whitelist:
      tags:
      - CarpRiftHealTarget
#Sunrise-end
