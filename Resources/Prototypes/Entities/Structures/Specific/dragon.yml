- type: entity
  id: CarpRift
  name: carp rift
  description: A rift akin to the ones space carp use to travel long distances.
  placement:
    mode: SnapgridCenter
  components:
  - type: DragonRift
    # Sunrise-start
    spawnPrototypes:
    - MobCarpDragon
    - MobCarpHoloDragon
    - MobCarpRainbowDragon
    - MobSharkDragon
    # Sunrise-end
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
    canCollide: true #Sunrise-edit
  - type: Fixtures
#Sunrise-start
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.48,0.25,0.48"
        density: 75
        mask:
        - MachineMask
        layer:
        - MachineLayer
#Sunrise-end
  - type: Sprite
    layers:
    - sprite: Structures/Specific/carp_rift.rsi
      state: icon
      color: "#569fff"
      shader: unshaded
  - type: InteractionOutline
  - type: Clickable
  - type: PointLight
    enabled: true
    color: "#366db5"
    radius: 10.0
    energy: 5.0
    netsync: false
  - type: NavMapBeacon
    color: "#ff0000"
    text: carp rift
    # only show after making the announcement at 50%
    enabled: false
  - type: Damageable
    damageModifierSet: Rift #Sunrise-edit
  - type: Injurable
    damageContainer: Rift #Sunrise-edit
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/Weapons/Guns/Gunshots/rocket_launcher.ogg
#Sunrise-start
  - type: DamageOverlay
  - type: AoEHeal
    threshold: 0.9
    damage:
      # Это немного: 160 проникающих ранений вылечатся наполовину примерно за две минуты.
      types:
        Blunt: -2.67
        Slash: -2.67
        Piercing: -2.66
        Heat: -1.25
        Shock: -1.25
        Cold: -1.25
        Caustic: -1.25
        Asphyxiation: -2.5
        Bloodloss: -2.5
        Poison: -2.5
        Radiation: -2.5 # Sunrise-Edit
    whitelist:
      tags:
      - CarpRiftHealTarget
#Sunrise-end
