- type: entity
  abstract: true
  parent: [ BaseStructure, StructureHealthBarrierWeak ]
  id: BaseRailing
  name: railing
  description: Basic railing meant to protect idiots like you from falling.
  components:
  - type: Sprite
    drawdepth: SmallObjects
    sprite: _Starlight/Structures/Walls/railing.rsi # Sunrise-Edit
  - type: Icon
    sprite: _Starlight/Structures/Walls/railing.rsi # Sunrise-Edit
  - type: Physics
    bodyType: Static
  - type: InteractionOutline
  - type: Repairable
  - type: Damageable
    damageModifierSet: RodMetalMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          PartRodMetal1:
            min: 0
            max: 1
  - type: Climbable
  - type: Construction
    graph: Railing
  - type: RCDDeconstructable
    cost: 2
    delay: 2
    fx: EffectRCDDeconstruct2

- type: entity
  parent: BaseRailing
  id: Railing
  suffix: Steel # Sunrise-Add
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Walls/railing.rsi # Sunrise-Edit
    state: side
  - type: Icon
    sprite: _Starlight/Structures/Walls/railing.rsi # Sunrise-Edit
    state: side
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,-0.25"
        density: 1000
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: Construction
    node: railing

