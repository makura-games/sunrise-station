- type: entity
  parent: ClothingBackpackHoldingBase #Standardized Bluespace Bags
  id: ClothingBackpackSatchelHolding
  name: satchel of holding
  description: A satchel that opens into a localized pocket of bluespace.
  components:
  # Sunrise edit start - сохраняем визуалы и характеристики сумки хранения
  - type: Sprite
    sprite: _Sunrise/Clothing/Back/Satchels/holding.rsi
    state: icon
    layers:
    - state: icon
    - state: icon-unlit
      shader: unshaded
  - type: Item
    size: Ginormous
    inhandVisuals:
      left:
      - state: inhand-left
      - state: inhand-left-unlit
        shader: unshaded
      right:
      - state: inhand-right
      - state: inhand-right-unlit
        shader: unshaded
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,17,7
  - type: Clothing
    sprite: _Sunrise/Clothing/Back/Satchels/holding.rsi
    clothingVisuals:
      back:
      - state: equipped-BACKPACK
      - state: equipped-BACKPACK-unlit
        shader: unshaded
  - type: StaticPrice
    price: 700
  - type: PhysicalComposition
    materialComposition:
      Steel: 1000
      Silver: 300
      Cloth: 500
      Plasma: 600
      Uranium: 40
  # Sunrise edit end

