- type: entity
  id: WeaponMechMelleDrill
  parent: BaseMechWeaponMelee
  name: exosuit drill
  suffix: Mech Weapon, Melee, Industrial
  description: Equipment for mining exosuits. This is the drill that'll pierce the rocks!
  components:
  - type: Sprite
    state: mecha_drill
  # Sunrise-start
  - type: Item
    sprite: _Sunrise/Objects/Specific/Mech/mecha_inhand.rsi
    heldPrefix: drill
  # Sunrise-end
  - type: Tag
    tags:
    - Pickaxe
    - IndustrialMech
  - type: MeleeWeapon
    autoAttack: true
    angle: 0
    wideAnimationRotation: -90
    soundHit:
      path: "/Audio/Items/drill_hit.ogg"
    attackRate: 3.5
    damage:
      types:
        Blunt: 3
        Slash: 3
        Piercing: 3
        Structural: 30 # ~10 seconds for solid wall / ~21 secods for reinforced wall #Sunrise-edit

