# Sunrise-start
# All Sunrise-specific changes are marked with this block and annotated inline.
# These edits add compatibility with Sunrise projectile & pierce logic, make the barrier destructible,
# and add tags/visuals needed by Sunrise systems.
# Sunrise-end
- type: entity
  name: deployable barrier
  id: DeployableBarrier
  description: A deployable barrier. Swipe your ID card to lock/unlock it.
  parent: BaseStructure
  components:
  - type: Transform
    anchored: false
    noRot: true
  - type: Sprite
    sprite: Objects/Specific/Security/barrier.rsi
    layers:
    - state: idle
    - state: locked
      map: ["enum.LockVisualLayers.Lock"]
  - type: Appearance
  - type: LockVisuals
  # Sunrise-start
  # Added wall tag and interaction outline for compatibility with wall-based systems and UI.
  # Reason: many systems (pathfinding, interaction outlines, auto-targeting) check for the 'Wall' tag
  # to decide special behaviour; InteractionOutline enables hover outlines in our client UI.
  - type: InteractionOutline
  - type: Tag
    tags:
    - Wall
  # Sunrise-end
  # Sunrise-start
  # Added physics component required for projectile interaction.
  # canCollide must be true for physics engine to report collisions with projectiles.
  - type: Physics
    bodyType: Static
    canCollide: true
  # Sunrise-end
  - type: Airtight
  - type: Fixtures
    fixtures:
      base:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 75
        mask:
        - MachineMask
      # Sunrise-start
      # Added a dedicated collision fixture for projectile blocking.
      # Use FullTileMask + WallLayer to behave like a standard wall (blocks movement, bullets, and interactions).
      # This is the recommended, engine-backed pairing that ensures projectile systems and other physics code treat
      # the barrier as a full-tile wall.
      barrier:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 150
        mask:
          - FullTileMask
        layer:
          - WallLayer
      # Sunrise-end
  - type: DeployableBarrier
    fixture: barrier
  # Sunrise-start
  # Added projectile penetration interaction support.
  # This allows configured projectiles with pierce to interact with the barrier's Pierceable component.
  - type: Pierceable
    level: Rock
  # Sunrise-end
  - type: AccessReader
    access: [["Security"]]
  - type: Lock
    locked: false
    lockOnClick: true
    lockTime: 5
    unlockTime: 5
  # Sunrise-start
  # Added damage handling so the barrier can receive and resist damage.
  # This integrates with damage/Destructible flows in Sunrise (e.g. explosive vs ballistic interactions).
  - type: Damageable
    damageModifierSet: Metallic
  # Sunrise-end
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel:
            min: 5
            max: 5
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: PointLight
    enabled: false
    radius: 3
    color: red
  - type: StaticPrice
    price: 200
