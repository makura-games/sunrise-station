- type: entity
  abstract: true
  parent: [BaseItem, BaseSecurityContraband]
  id: BaseBola
  name: bola
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: Objects/Weapons/Throwable/bola.rsi
    state: icon
  - type: EmitSoundOnThrow
    sound: /Audio/Weapons/bolathrow.ogg
  - type: EmitSoundOnLand
    sound: /Audio/Effects/snap.ogg
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DamageOnLand
    damage:
      types:
        Blunt: 5
  - type: Ensnaring
    freeTime: 2.0
    breakoutTime: 3.5 #all bola should generally be fast to remove
    walkSpeed: 0.5 #makeshift bola shouldn't slow too much
    sprintSpeed: 0.5
    staminaDamage: 0 # anything but this is gamebreaking
    canThrowTrigger: true
    canMoveBreakout: true
    maxEnsnares: 1
  - type: LandAtCursor
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.4
        density: 20 # derived from base_item
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2

- type: entity
  parent: BaseBola
  id: Bola
  name: makeshift bola
  description: A makeshift bola, cobbled together with some spare cuffs and metal. It doesn't look like it's going to stay together for very long.
  components:
  - type: Construction
    graph: Bola
    node: bola

- type: entity
  parent: BaseBola
  id: SecurityBola
  name: tactical bola
  description: A bola, comprised of steel anchors linked together with a wire cable. # Sunrise-Edit - после снятия тактическая бола расходуется.
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Throwable/bola/bola_security.rsi # Sunrise-Edit - сохраняем спрайт Sunrise.
    state: icon
  - type: DamageOnLand
    damage:
      types:
        Blunt: 0 #reusable, in contrast to makeshift
  - type: Ensnaring
    freeTime: 2.5 #slightly slower free time than makeshift
    breakoutTime: 4.0 #slightly slower breakout time than makeshift
    # Sunrise edit start - сохраняем баланс старой BolaSecurity под каноническим ID Wizden.
    walkSpeed: 0.6
    sprintSpeed: 0.6
    staminaDamage: 10
    destroyOnRemove: true
    # Sunrise edit end
    canThrowTrigger: true
    canMoveBreakout: true
    maxEnsnares: 1
  - type: Tag # Sunrise-Edit - совместимость с поясами и снаряжением Sunrise.
    tags:
    - BolaSecurity
    - SecBeltEquip
