- type: entity
  parent: BaseBullet
  id: BulletKinetic
  categories: [ HideSpawnMenu ]
  name: kinetic bolt
  description: Not too bad, but you still don't want to get hit by it.
  components:
  - type: Sprite
    noRot: false
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: chronobolt
      shader: unshaded
  - type: Reflective
    reflective:
    - NonEnergy
  - type: Projectile
    impactEffect: BulletImpactEffectKinetic
    damage:
      types:
        Blunt: 25 # Sunrise-Edit
        Structural: 20 # Sunrise-Edit
  # Short lifespan
  - type: TimedDespawn
    lifetime: 0.275 # Sunrise-Edit - дальность около 6.5 тайлов
  - type: GatheringProjectile
  # Sunrise added start - дополнительное оглушение кинетическим импульсом
  - type: StaminaDamageOnCollide
    damage: 10
  # Sunrise added end

- type: entity
  parent: BaseBullet
  id: BulletKineticShuttle
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    noRot: false
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: chronobolt
      shader: unshaded
  - type: Projectile
    impactEffect: BulletImpactEffectKinetic
    damage:
      types:
        Blunt: 30
        Structural: 35
    # Sunrise edit start - снаряд пробивает слабые конструкции
    penetrationThreshold: 80
    penetrationDamageTypeRequirement:
    - Structural
    # Sunrise edit end
  - type: Ammo
    muzzleFlash: HitscanEffect
  - type: TimedDespawn
    lifetime: 1.5
  - type: PointLight
    radius: 2.5
    color: white
    energy: 0.5
  # Sunrise edit start - шаттловый снаряд отслеживается радаром и наносит урон выносливости
  - type: RadarBlip
    color: "#ffdd44"
    scale: 0.7
    shape: Circle
  - type: StaminaDamageOnCollide
    damage: 6
  # Sunrise edit end

- type: entity
  parent: BaseBullet
  id: BulletCharge
  categories: [ HideSpawnMenu ]
  name: charge bolt
  description: Marks a target for additional damage.
  components:
  - type: Sprite
    noRot: false
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: chronobolt
      shader: unshaded
  - type: Reflective
    reflective:
    - NonEnergy
  - type: GatheringProjectile
  - type: DamageMarkerOnCollide
    whitelist:
      components:
      - MobState
    damage:
      types:
        Blunt: 20 # Sunrise-Edit
        Slash: 5 # Sunrise-Edit
  - type: Projectile
    impactEffect: BulletImpactEffectKinetic
    damage:
      types:
        Blunt: 0
  # Short lifespan
  - type: TimedDespawn
    lifetime: 0.4

# Deals less damage, glaive has better HP recovery
- type: entity
  parent: BulletCharge
  id: BulletChargeGlaive
  name: leech bolt
  components:
  - type: DamageMarkerOnCollide
    whitelist:
      components:
      - MobState
    damage:
      types:
        Blunt: 1
        Slash: 5
