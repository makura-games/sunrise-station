- type: antag
  id: HeadRev
  name: roles-antag-rev-head-name
  antagonist: true
  setPreference: true
  playTimeTracker: AntagHeadRevolutionary # Sunrise-Edit
  objective: roles-antag-rev-head-objective
  guides: [ Revolutionaries ]
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 1h
  # Sunrise-Edit
  previewIcon:
    sprite: /Textures/_Sunrise/Interface/Misc/antag_preview.rsi
    state: head_rev
  storytellerStress: 2

- type: antagSpecifier
  abstract: true
  parent: RestrictedAntag
  id: BaseRev
  name: revolutionary
  prefRoles:
  - GenericTeamAntagonist # For antag ban purposes
  components:
  - type: Revolutionary

- type: antagSpecifier
  parent: BaseRev
  id: HeadRev
  prefRoles:
  - HeadRev
  fallbackRoles: # Sunrise-Edit
  - Rev
  briefing:
    text: head-rev-role-greeting
    color: CornflowerBlue
    sound: "/Audio/Ambience/Antag/headrev_start.ogg"
  startingGear: HeadRevGear
  components:
  - type: Revolutionary
  - type: HeadRevolutionary
  mindRoles:
  - MindRoleHeadRevolutionary

# TODO: Make it so creating new revolutionaries uses antag prototypes! This saves a *lot* of boilerplate for conversion antags.

# Sunrise edit start - отдельный спецификатор обычного революционера
- type: antagSpecifier
  parent: BaseRev
  id: Rev
  prefRoles:
  - Rev
  fallbackRoles: # Sunrise-Edit
  - HeadRev
  blacklist:
    components:
    - CommandStaff
    - MindShield
  briefing:
    text: rev-role-greeting
    color: CornflowerBlue
    sound: "/Audio/Ambience/Antag/headrev_start.ogg"
  mindRoles:
  - MindRoleRevolutionary
# Sunrise edit end

- type: antag
  id: Rev
  name: roles-antag-rev-name
  antagonist: true
  setPreference: true # Sunrise-Edit
  playTimeTracker: AntagRevolutionary # Sunrise-Edit
  objective: roles-antag-rev-objective
  guides: [ Revolutionaries ]
  storytellerStress: 0.2 # Sunrise-Edit

- type: startingGear
  id: HeadRevGear
  storage:
    back:
    - Flash
    - ClothingEyesGlassesHiddenSecurityChameleon # Sunrise-Edit
    - BlueprintImplanterExtractor  # Sunrise-add
    - PinpointerSmugglerRevolutionaryStash  # Sunrise-add
