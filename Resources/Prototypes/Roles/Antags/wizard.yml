- type: antag
  id: Survivor
  name: roles-antag-survivor-name
  antagonist: true
  objective: roles-antag-survivor-objective
  playTimeTracker: AntagSurvivor # Sunrise-Edit
  storytellerStress: 1.0 # Sunrise-Edit
  # guides: [  ]

- type: antag
  id: Wizard
  name: roles-antag-wizard-name
  antagonist: true
  # setPreference: true # Disabled as roundstart gamemode until reworked
  objective: roles-antag-wizard-objective # TODO: maybe give random objs and stationary ones from AntagObjectives and AntagRandomObjectives
  requirements: # I hate time locked roles but this should be enough time for someone to be acclimated
  - !type:OverallPlaytimeRequirement
    time: 5h
  playTimeTracker: AntagWizard # Sunrise-Edit
  guides: [ Wizard ]
  storytellerStress: 5.0 # Sunrise-Edit

- type: antagSpecifier
  parent: RestrictedAntag
  id: Wizard
  spawnerPrototype: SpawnPointGhostWizard
  startingGear: WizardBlueGear
  roleLoadout:
  - RoleSurvivalExtended
  briefing:
    text: wizard-role-greeting
    color: Turquoise
    # TODO: Need Wizard Start sound
    #sound: "/Audio/Ambience/Antag/wizard_start.ogg"
  # TODO: WizardComp as needed
  components:
  # Sunrise edit start - маркер мага для панели призраков
  - type: GhostPanelAntagonistMarker
    name: ghost-panel-antagonist-wizard-name
    description: ghost-panel-antagonist-wizard-description
    priority: 5
  # Sunrise edit end
  - type: NpcFactionMember
    factions:
    - Wizard
  - type: RandomMetadata
    nameSegments:
    - NamesWizardFirst
    - NamesWizardLast
    nameFormat: name-format-wizard
  mindRoles:
  - MindRoleWizard

# See wizard_startinggear for wiz start gear options
