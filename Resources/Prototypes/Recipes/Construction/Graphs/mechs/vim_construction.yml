- type: constructionGraph
  id: Vim
  start: start
  graph:
  - node: start
    edges:
    - to: vim
      steps:
      - assemblyId: Vim
        guideString: mech-construction-guide-string

      - tag: VoiceTrigger
        name: construction-graph-tag-voice-trigger
        icon:
          sprite: "Objects/Devices/voice.rsi"
          state: "voice"
        completed:
        - !type:VisualizerDataInt
          key: "enum.MechAssemblyVisuals.State"
          data: 1
      - tag: MechReactor # Sunrise-Edit — для сборки меха требуется реактор
        name: construction-graph-component-mech-reactor # Sunrise-Edit
        store: battery-container
        icon:
          sprite: _Sunrise/Objects/Power/mech_reactors.rsi # Sunrise-Edit
          state: medium # Sunrise-Edit
      - tool: Screwing
        doAfter: 1
  - node: vim
    actions:
    - !type:BuildMech
      mechPrototype: MechVim
