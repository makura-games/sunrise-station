#Grenade Thrower
- type: entity
  name: Grenade Thrower "Rumbler"
  parent: [WeaponGrenadeLauncherSecurity, BaseMajorContraband]
  id: CyberGrenadeThrower
  description: A single-shot, break-action integrated grenade launcher. Capable of firing a variety of grenades and hand grenades and small artillery casing.
  components:
  - type: Reflect
    reflectProb: 0.05
    spread: 120
    soundOnReflect: /Audio/_Starlight/Armor/Ricochet/ricochet1_1.ogg #armor_ricochet #collection
    reflects:
    - NonEnergy
  - type: HeldSpeedModifier
    walkModifier: 1
    sprintModifier: 0.8
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Guns/Cyber/grenade_thrower.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
  - type: Gun
    fireRate: 0.55
    minAngle: 6
    maxAngle: 18
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/ship_friendship.ogg
    projectileSpeed: 15
    bigTrigger: true
  - type: UseDelayOnShoot
  - type: UseDelay
    delay: 8
  - type: ItemSlots
    slots:
      gun_chamber:
        name: Chamber
        startingItem: GrenadeFlash
        priority: 1
        whitelist:
          tags:
          - Grenade
          - HandGrenadeAmmo
          - CartridgeAntiMateriel
          - ShellShotgun
          - ShellShotgunImprovised
  - type: KnockbackByUserTag
    doestContain:
