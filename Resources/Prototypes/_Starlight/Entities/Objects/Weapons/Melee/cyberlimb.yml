        knockback: 4
        staminaMultiplier: 30
      Felinid:
        knockback: 2 #half of what resomi take
        staminaMultiplier: 30
      AnomalyHost:
        knockback: 1 #half of what Xeno take
        staminaMultiplier: 25
      HumanoidXeno:
        knockback: 1
        staminaMultiplier: 20
      Predator:
        knockback: 1
        staminaMultiplier: 15

