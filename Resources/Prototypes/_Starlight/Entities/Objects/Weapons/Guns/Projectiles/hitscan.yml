# Apollo Heavy Laser - shuttle cannon beam
- type: entity
  id: ApolloHeavyLaser
  name: apollo heavy laser beam
  parent: BasicHitscan
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Heat: 250
        Structural: 100
  - type: HitscanBasicRaycast
    maxDistance: 128
  - type: HitscanReflect
    reflectiveType: Energy
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: muzzle_beam_heavy
    travelFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: beam_heavy
    impactFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: impact_beam_heavy
    bullet:
      sprite:
        sprite: Objects/Weapons/Guns/Projectiles/projectiles_tg.rsi
        state: heavylaser

