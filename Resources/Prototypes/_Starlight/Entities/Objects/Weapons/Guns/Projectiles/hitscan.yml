## energy

- type: entity
  id: BasicHitscanNoBeam
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanAmmo
  - type: HitscanBasicRaycast
  - type: HitscanReflect
  - type: HitscanBasicEffects

- type: entity
  id: EnergyTrace
  parent: BasicHitscan
  categories: [ HideSpawnMenu ]
  abstract: true
  components:
  - type: HitscanBasicRaycast
    collisionMask: BulletImpassable
  - type: HitscanReflect
    reflectiveType: Energy
  - type: HitscanBasicVisuals
    bullet:
      sprite:
        sprite: Objects/Weapons/Guns/Projectiles/projectiles_tg.rsi
        state: heavylaser

