- type: entity
  name: riot shotgun
  parent: [BaseWeaponShotgunPump, BaseGunWieldable, BaseSecurityContraband]
  id: WeaponShotgunRiot
  description: A sturdy shotgun with a longer magazine and a fixed tactical stock designed for non-lethal riot control.
  components:
  - type: Item
    sprite: _Starlight/Objects/Weapons/Guns/Shotguns/riot_inhands_64x.rsi
  - type: Gun
    spread: 20
    projectileSpeed: 35
  - type: GunSpreadModifier # Sunrise-Add
    spread: 1.2
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Shotguns/riot.rsi
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Guns/Shotguns/riot.rsi
  - type: GunRequiresWield
  - type: BallisticAmmoProvider
    capacity: 8
    proto: ShellShotgunBeanbag
  - type: Construction
    graph: ShotgunRiotSawn
    node: start
    deconstructionTarget: null

- type: entity
  name: sawn-off riot shotgun
  parent: [BaseWeaponShotgunPump, BaseSecurityContraband]
  id: WeaponShotgunRiotSawn
  description: Come with me if you want to live.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Shotguns/riot_sawn.rsi
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Guns/Shotguns/riot_sawn.rsi
  - type: Item
    size: Normal
    shape:
    - 0,0,2,0
    sprite: _Starlight/Objects/Weapons/Guns/Shotguns/riot_sawn_inhands_64x.rsi
  - type: Gun
    fireRate: 1.65
    spread: 30
    projectileSpeed: 35
  - type: GunSpreadModifier # Sunrise-Add
    spread: 1.4
  - type: BallisticAmmoProvider
    capacity: 5
    proto: ShellShotgunBeanbag
  - type: Construction
    graph: ShotgunRiotSawn
    node: shotgunsawn
    deconstructionTarget: null
  - type: CanDualWield # Sunrise-Edit
    dualWieldInaccuracyPenalty: 0.2
    dualWieldFireRatePenalty: 0.2
    dualWieldRecoilPenalty: 0.2

- type: entity
  parent: WeaponShotgunRiotSawn
  id: WeaponShotgunRiotSawnEmpty
  suffix: Empty
  components:
  - type: BallisticAmmoProvider
    proto: null
  - type: Construction
    graph: ShotgunRiotSawn
    node: shotgunsawn
    deconstructionTarget: null

- type: entity
  name: cycler shotgun
  parent: [BaseWeaponShotgunAny, BaseGunWieldable, BaseSecurityContraband] # , BaseSecuritySalvageContraband
  id: WeaponShotgunCycler
  description: An advanced shotgun with two separate magazine tubes, allowing you to quickly toggle between ammo types.
  components:
  - type: Item
    sprite: _Starlight/Objects/Weapons/Guns/Shotguns/cycler.rsi
    size: Large
  - type: GunSpreadModifier # Sunrise-Add
    spread: 1.3
  - type: Gun
    spread: 30
    fireRate: 2
    projectileSpeed: 25
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_Starlight/Weapons/Guns/Gunshots/minotaur.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Shotguns/cycler.rsi
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Guns/Shotguns/cycler.rsi
  - type: GunRequiresWield
  - type: RevolverAmmoProvider
    whitelist:
      tags:
      - ShellShotgun
      - SpeedLoaderShotgun
    proto: ShellShotgun
    capacity: 14
    chambers: [ True, True, True, True, True, True, True, True, True, True, True, True, True,  True, ]
    ammoSlots: [ null, null, null, null, null, null, null, null, null, null, null, null, null, null, ]
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/shotgun_insert.ogg
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
      revolver-ammo: !type:Container
  - type: UseDelay
    delay: 0.15

- type: entity
  name: Tkach Ya-Sui GA 12 revolver
  parent: [BaseWeaponShotgunAny, BaseSecurityContraband] # , BaseSecuritySalvageContraband
  id: WeaponShotgunGA12
  description: An outdated sidearm rarely seen in use by certain PMCs that operate throughout the frontier systems, featuring a three-shell cylinder. Thats right, shell, this one shoots twelve gauge.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Shotguns/ga12.rsi
  - type: Item
    sprite: _Starlight/Objects/Weapons/Guns/Shotguns/ga12.rsi
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Guns/Shotguns/ga12.rsi
    quickEquip: false
    slots:
    - suitStorage
    - Belt
  - type: Tag
    tags:
    - Sidearm
  - type: AmmoCounter
  - type: Gun
    spread: 30
    selectedMode: SemiAuto
    fireRate: 2
    projectileSpeed: 25
    availableModes:
    - SemiAuto
  - type: GunSpreadModifier # Sunrise-Add
    spread: 1.4
  - type: BallisticAmmoProvider
    capacity: 3
  - type: RevolverAmmoProvider
    whitelist:
      tags:
      - ShellShotgun
      - SpeedLoaderShotgun
    proto: ShellShotgun
    capacity: 3
    chambers: [ True, True, True ]
    ammoSlots: [ null, null, null ]
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/shotgun_insert.ogg
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
      revolver-ammo: !type:Container
  - type: KnockbackByUserTag
    doestContain:
      Resomi:
        knockback: 3
        staminaMultiplier: 20
      Felinid:
        knockback: 1.5 #half of what resomi take
        staminaMultiplier: 20

- type: entity
  name: "AS-12 'Minotaur' Shotgun"
  parent: [BaseWeaponShotgunAny, BaseGunWieldable, BaseSyndicateContraband]
  id: WeaponShotgunMinotaur
  description: Smooth, powerful, highly illegal. The newest full auto shotgun available at the market, utilizes standard 12g drum mags. Property of Gorlex Marauders.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Shotguns/minotaur.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Large
    shape:
    - 0,0,3,2
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Guns/Shotguns/minotaur.rsi
  - type: GunRequiresWield
  - type: Gun
    spread: 20
    fireRate: 3
    projectileSpeed: 30
    burstFireRate: 4
    burstCooldown: 0.5
    selectedMode: Burst
    shotsPerBurst: 3
    availableModes:
    - Burst
    - FullAuto
    soundGunshot:
      path: /Audio/_Starlight/Weapons/Guns/Gunshots/minotaur.ogg
  - type: GunSpreadModifier # Sunrise-Add
    spread: 1.2
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineShotgunXL
        priority: 2
        whitelist:
          tags:
          - MagazineShotgun
        whitelistFailPopup: gun-magazine-whitelist-fail
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: ChamberMagazineAmmoProvider
    autoEject: true
  - type: MagazineVisuals
    magState: mag
    steps: 6
    zeroVisible: true
  - type: Appearance

