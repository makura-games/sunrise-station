      ballistic-ammo: !type:Container
      revolver-ammo: !type:Container
  - type: KnockbackByUserTag
    doestContain:
      Resomi:
        knockback: 3
        staminaMultiplier: 20
      Felinid:
        knockback: 1.5 #half of what resomi take
