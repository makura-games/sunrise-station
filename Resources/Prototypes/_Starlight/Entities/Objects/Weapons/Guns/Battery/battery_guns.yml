- type: entity
  name: hybrid taser
  parent: [ BaseWeaponBatterySmall, BaseSecurityContraband ]
  id: WeaponAdvancedTaser
  description: A low-capacity, energy-based stun gun used by security teams to subdue targets at range.
  components:
  - type: Tag
    tags:
    - Taser
    - Sidearm
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Battery/adv_taser.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: disable
      map: ["enum.FireModesLayers.FireMode"]
      shader: unshaded
    - state: disable-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Appearance
  - type: Item
    heldPrefix: disable4
  - type: Clothing
    quickEquip: false
    sprite: Objects/Weapons/Guns/Battery/disabler.rsi # Sunrise-Edit
    slots:
    - Belt
    - suitStorage # Sunrise-Edit
  - type: Gun
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/taser.ogg
  - type: MagazineVisuals
    magState: disable
    steps: 5
    zeroVisible: true
  - type: BatteryAmmoProvider
    proto: BulletDisabler
    fireCost: 62.5
  - type: BatteryWeaponFireModes
    fireModes:
    - proto: BulletDisabler
      fireCost: 62.5
      visualState: disable
      magState: disable
      heldPrefix: disable4
    - proto: BulletTaser
      fireCost: 166
      visualState: stun
      magState: stun
      heldPrefix: stun4
  - type: StealTarget
    stealGroup: OfficerHandgun

- type: entity
  name: X-01 multiphase energy gun
  parent: [ BaseWeaponBatterySmall, BaseSecurityContraband ]
  id: WeaponMultiphaseGun
  description: This is an expensive, modern version of the antique laser pistol, with several unique fire modes.
  components:
  - type: Appearance
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Battery/multiphase_gun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: disable-unshaded
      map: ["enum.FireModesLayers.FireMode"]
      shader: unshaded
    - state: disable-unshaded-0
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Lock
    mindShieldLock: true
  - type: AccessReader
    access: [["BlueShield"]]
  - type: Item
    size: Normal
    shape:
    - 0, 0, 1, 1
    heldPrefix: disabler
  - type: MagazineVisuals
    magState: disable
    steps: 5
    zeroVisible: true
  - type: BatteryAmmoProvider
    proto: BulletDisabler
    fireCost: 83
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Guns/Battery/multiphase_gun.rsi
  - type: BatteryWeaponFireModes
    fireModes:
    - proto: BulletDisabler
      fireCost: 83
      magState: disable
      visualState: disable-unshaded
      heldPrefix: disabler
    - proto: BulletTaser
      fireCost: 166
      magState: stun
      visualState: stun-unshaded
      heldPrefix: stun
    - proto: RedMediumLaser
      fireCost: 125
      magState: kill
      visualState: kill-unshaded
      heldPrefix: lethal
    - proto: DestroyBeam
      fireCost: 175
      magState: destroy
      visualState: destroy-unshaded
      heldPrefix: destroy
    - proto: BulletEMP
      fireCost: 500
      magState: ion
      visualState: ion-unshaded
      heldPrefix: special
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser3.ogg
  - type: Battery
    maxCharge: 2500
    startingCharge: 2500
  - type: EmpImmune
  - type: Tag
    tags:
    - HighRiskItem
    - Sidearm
    - BigSmallArms
  - type: StaticPrice
    price: 9750
  - type: StealTarget
    stealGroup: WeaponEnergyGunMultiphase

