- type: entity
  id: BaseSpeedLoaderShotgun
  name: "speed loader (.50)"
  parent: [ BaseItem ]
  abstract: true
  components:
  - type: Item
    sprite: Objects/Tools/screwdriver.rsi
    storedRotation: -90
    size: Normal
    shape:
    - 0,0,0,2
  - type: Tag
    tags:
      - SpeedLoaderShotgun
  - type: SpeedLoader
  - type: BallisticAmmoProvider
    mayTransfer: true
    fillDelay: 0.1
    whitelist:
      tags:
        - ShellShotgun
    capacity: 4
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Guns/Ammunition/SpeedLoaders/Shotgun/shotgun_speed_loader.rsi
    layers:
      - state: base
        map: [ "enum.GunVisualLayers.Base" ]
      - state: base-4
        map: [ "enum.GunVisualLayers.Mag" ]
      - state: base-tip-4
        map: [ "enum.GunVisualLayers.Tip" ]
        color: "#F4001F"
  - type: MagazineVisuals
    magState: base
    steps: 5
    zeroVisible: false
  - type: Appearance

- type: entity
  id: SpeedLoaderShotgunBuck
