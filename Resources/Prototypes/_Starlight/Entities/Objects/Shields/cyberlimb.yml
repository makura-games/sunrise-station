- type: entity
  name: bulwark
  parent: [BaseItem, BaseSecurityContraband]
  id: EnergyShieldCyber
  description: The true shield for warriors, made out of hard-light materials making it lightweight and portable.
  components:
    - type: ItemToggle
      soundActivate:
        path: /Audio/Weapons/ebladeon.ogg
      soundDeactivate:
        path: /Audio/Weapons/ebladeoff.ogg
      # Sunrise-Start
      predictable: false
      soundFailToActivate:
        path: /Audio/Machines/button.ogg
        params:
          variation: 0.250
      # Sunrise-End
    - type: ItemToggleActiveSound
      activeSound:
        path: /Audio/Weapons/ebladehum.ogg
    - type: ItemToggleSize
      activatedSize: Huge
    - type: ComponentToggler
      components:
      - type: DisarmMalus
        malus: 0.6
    - type: HeldSpeedModifier
      walkModifier: 1
      sprintModifier: 0.9
    - type: Sprite
      sprite: _Starlight/Objects/Weapons/Melee/cybershield.rsi
      layers:
        - state: cybershield-icon
        - state: cybershield-on
          color: "#FFFFFF"
          visible: false
          shader: unshaded
          map: [ "shield" ]
    - type: Item
      size: Small
      sprite: _Starlight/Objects/Weapons/Melee/cybershield.rsi
      heldPrefix: cybershield
    - type: UseDelay
      delay: 0.5
    - type: ToggleableVisuals
      spriteLayer: shield
      inhandVisuals:
        left:
          - state: inhand-left-shield
            shader: unshaded
        right:
          - state: inhand-right-shield
            shader: unshaded
    - type: PointLight
      netsync: false
      enabled: false
      radius: 1.5
      energy: 3
      color: "#a22529"
    - type: ItemTogglePointLight
    - type: Reflect
      reflectProb: 0.15
      reflects:
        - Energy
    - type: Blocking
      passiveBlockModifier:
        coefficients:
          Blunt: 0.75
          Slash: 0.75
          Piercing: 0.75
          Heat: 0.75
      activeBlockModifier:
        coefficients:
          Blunt: 0.45
          Slash: 0.45
          Piercing: 0.45
          Heat: 0.45
        flatReductions:
          Heat: 1
          Piercing: 1
    - type: Appearance
    - type: Damageable
    - type: Injurable
      damageContainer: Shield
    - type: BatterySelfRecharger
      autoRechargeRate: 75
      autoRechargePauseTime: 5
    - type: EnergyShield
    - type: ExaminableBattery
    - type: Battery
      maxCharge: 1500
      startingCharge: 1500
    - type: PowerCellDraw
      useCharge: 2.5
    # - type: Destructible
    #   thresholds:
    #     - trigger:
    #         !type:DamageTrigger
    #         damage: 150
    #       behaviors:
    #         - !type:DoActsBehavior
    #           acts: [ "Destruction" ]
    #     - trigger:
    #         !type:DamageTrigger
    #         damage: 100
    #       behaviors:
    #         - !type:DoActsBehavior
    #           acts: [ "Destruction" ]
    #         - !type:PlaySoundBehavior
    #           sound:
    #             collection: GlassBreak
    #         #- !type:SpawnEntitiesBehavior - Breaks arm. Who'da thunk?
    #           #spawn:
    #             #BrokenEnergyShieldCyber:
    #               #min: 1
    #               #max: 1
    - type: StaticPrice
      price: 350

