- type: entity
  name: patch
  description: On-touch administration of chemicals.
  parent: BaseStarlightHealingItem
  id: BasePatch
  abstract: true
  components:
  - type: Sprite
    state: bandaid
  - type: Solution
    id: patch
    solution:
      maxVol: 20
  - type: Item
    size: Tiny
  - type: Appearance
  - type: Patch
  - type: Tag
    tags:
      - Patch

- type: entity
  id: Patch
  parent: BasePatch

- type: entity
  id: PatchBruteSmall
  name: brute patch small
  parent: BasePatch
  components:
  - type: Sprite
    state: bandaid-brute
  - type: Solution
    id: patch
    solution:
      maxVol: 20
      reagents:
      - ReagentId: Tricordrazine
        Quantity: 10

- type: entity
  id: PatchBrute
  name: brute patch
  parent: BasePatch
  components:
  - type: Sprite
    state: bandaid-brute
  - type: Solution
    id: patch
    solution:
      maxVol: 20
      reagents:
      - ReagentId: Bicaridine
        Quantity: 15

- type: entity
  id: PatchBurnSmall
  name: burn patch small
  parent: BasePatch
  components:
  - type: Sprite
    state: bandaid-burn-small
  - type: Solution
    id: patch
    solution:
      maxVol: 20
      reagents:
      - ReagentId: Dermaline
        Quantity: 10

- type: entity
  id: PatchBurn
  name: burn patch
  parent: BasePatch
  components:
  - type: Sprite
    state: bandaid-burn
  - type: Solution
    id: patch
    solution:
      maxVol: 20
      reagents:
      - ReagentId: Dermaline
        Quantity: 15

- type: entity
  id: PatchOmni
  name: omni patch
  parent: BasePatch
  components:
  - type: Sprite
    state: bandaid-burn
  - type: Solution
    id: patch
    solution:
      maxVol: 20
      reagents:
      - ReagentId: Omnizine
        Quantity: 12 #Sunrise-Edit
      - ReagentId: TranexamicAcid #Sunrise-Edit
        Quantity: 3 #Sunrise-Edit


- type: entity
  id: PatchMedical
  name: medical patch
  parent: BasePatch
  components:
  - type: Sprite
    state: bandaid-med
  - type: Solution
    id: patch
    solution:
      maxVol: 20
      reagents:
      - ReagentId: Dermaline
        Quantity: 10
      - ReagentId: Bicaridine
        Quantity: 10

- type: entity
  id: PatchClown
  name: clown patch
  parent: BasePatch
  components:
  - type: Sprite
    state: bandaid-clown
  - type: Solution
    id: patch
    solution:
      maxVol: 20
      reagents:
      - ReagentId: Bananadine
        Quantity: 5
      - ReagentId: Happiness
        Quantity: 5
      - ReagentId: MuteToxin
        Quantity: 10

- type: entity
  name: patch pack
  id: PatchPack
  parent: BaseStorageItem
  description: Storage of multiple patches efficiently.
  components:
  - type: Item
    size: Tiny
    sprite: _Starlight/Objects/Specific/Chemistry/patch_pack.rsi
  - type: Sprite
    scale: 0.9,0.9
    sprite: _Starlight/Objects/Specific/Chemistry/patch_pack.rsi
    state: icon
  - type: Tag
    tags:
      - PatchPack
  - type: Storage
    maxItemSize: Tiny
    grid:
    - 0,0,4,1
    quickInsert: true
    areaInsert: true
    areaInsertRadius: 1
    whitelist:
      tags:
      - Patch

- type: entity
  name: patch pack
  parent: PatchPack
  id: PatchPackBrute
  suffix: Brute
  components:
  - type: Label
    currentLabel: brute patch
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: PatchBrute
          amount: 5

- type: entity
  name: patch pack
  parent: PatchPack
  id: PatchPackHeat
  suffix: Heat
  components:
  - type: Label
    currentLabel: Heat patch
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: PatchBurn
          amount: 5

- type: entity
  name: patch pack
  parent: PatchPack
  id: PatchPackBruteHeat
  suffix: Brute-Heat
  components:
  - type: Label
    currentLabel: brute/heat patch
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: PatchBrute
          amount: 5
        - id: PatchBurn
          amount: 5

- type: entity
  name: bluespace drug storage
  id: BluespacePillPatchCanister
  parent: BaseStorageItem
  description: A technologically advanced device for storing small-sized medications such as patch and pills, it has two containers of different shapes, which unite the central storage of the device.
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Specific/Chemistry/bluespace_pillcanister.rsi
    state: icon
  - type: Item
    size: Small
    storedRotation: -90
    sprite: _Sunrise/Objects/Specific/Chemistry/bluespace_pillcanister.rsi
  - type: Tag
    tags:
      - PillCanister
      - PatchPack
  - type: Storage
    grid:
    - 0,0,4,2
    - 6,0,10,2
    quickInsert: true
    areaInsert: true
    areaInsertRadius: 1
    storageInsertSound: /Audio/Effects/pill_insert.ogg
    storageRemoveSound: /Audio/Effects/pill_remove.ogg
    whitelist:
      tags:
      - Pill
      - Patch
  - type: Dumpable
