- author: VigersRay
  changes:
  - message: 'Добавлен режим "Рассказчик" который полностью заменяет обычный генератор случайных событий на гибкую систему которая добавляет угрозы в зависимости от текущего состояния станции, а так следует концепту "взлетов и падений" давая время на отдых от угроз. Это полностью опциональный режим который могут выбрать игроки по желанию. Важно: Режим ни разу не тестировался и вероятно является крайне сырым, для доработки режима собирается множество метрик, поэтому будет его доработка значительно ускорится если он будет запускаться хотя бы пару раз в день, а так же вы будете давать свой фитбек в дискорде.'
    type: Add
