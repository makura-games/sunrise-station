- proto: HolographicPaper
  entities:
  - uid: 360
    components:
    - type: Transform
      parent: 1
      pos: 4.2526345,2.3056076
    - type: Paper
      stampState: paper_stamp-centcom
      stampedBy:
      - stampedName: stamp-component-stamped-name-centcom
        stampedColor: '#006600FF'
      - stampedName: stamp-component-stamped-name-specops
        stampedColor: '#4543B4FF'
      content: >
        CLMX CLG Core Gunship M3 техническая информация.


        Высокоскоростной многоцелевой перехватчик для уничтожения одиночных слабо или средневооруженных шаттлов. Маневренные двигатели позволяют избегать столкновений в космическом пространстве, преследовать практически любые цели, ведя при этом огонь из фронтовых пушек.


        * Нажмите на красную кнопку, чтобы привести фланговые орудия в боеспособное состояние. Нажмите еще раз на кнопку после окончания боя, чтобы перевести фланговые орудия в состояние хранения.


        (!!!) Внимание (!!!) Стрельба из фланговых орудий без поднятия гермозатворов хранения приведет к детонации и уничтожению орудий.


        * Нажмите на желтую кнопку на консоли сканера масс, чтобы активировать гермозатворы изоляции шлюзов.


        * Нажмите на желтую кнопку на стене, чтобы активировать режим изоляции гермозатворов окон.


        * Рекомендация: Активируйте турели командования в летальный режим. Ситуативно настройте доступы. Если статус угрозы высок, установите доступы только на пункте "Капитан".
